<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IHK Тренажер</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
:root{--bg:#0b0d13;--s1:#13161f;--s2:#1a1e2b;--border:#252a3a;--acc:#4f7fff;--green:#22c55e;--red:#ef4444;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:2px solid var(--acc);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:14px;font-weight:700;color:#fff}
.hdr-back{color:var(--acc);font-size:13px;font-weight:600;text-decoration:none;padding:6px 12px;border:1px solid var(--acc);border-radius:7px}
.mode-tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border)}
.mode-btn{flex:1;padding:11px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;transition:all .2s}
.mode-btn.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--s2)}
.day-scroll{display:flex;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.day-scroll::-webkit-scrollbar{display:none}
.day-btn{padding:9px 14px;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;transition:all .2s;flex-shrink:0}
.day-btn.on{color:var(--acc);border-bottom-color:var(--acc)}
.day-btn.full{color:var(--green)}
.day-btn.full.on{border-bottom-color:var(--green)}
.day-prog{display:block;font-size:9px;font-weight:500;opacity:.75;margin-top:1px}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.q-info{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px;font-family:'JetBrains Mono',monospace}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;background:var(--s2);border:2px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.dot.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lang-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.lang-btn{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.lang-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.flashcard{perspective:1200px;margin-bottom:14px}
.fc-inner{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:22px 20px;display:flex;flex-direction:column}
.fc-front{background:var(--s1);border:1px solid var(--border)}
.fc-back{background:#091708;border:1px solid #1a4a2a;transform:rotateY(180deg)}
.fc-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.fc-front .fc-lbl{color:var(--acc)}.fc-back .fc-lbl{color:var(--green)}
.fc-id{font-size:11px;color:var(--muted);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.fc-q{font-size:15px;line-height:1.7;color:var(--text);flex:1}
.fc-a{font-size:13px;line-height:1.75;color:#86efac;flex:1;overflow-y:auto;white-space:pre-wrap}
.fc-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.btn-show{width:100%;padding:13px;border-radius:10px;border:2px solid var(--acc);background:#0d1829;color:#93c5fd;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:8px}
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-back{background:var(--s2);border:1px solid var(--border);color:var(--muted)}
.btn-next{background:var(--acc);border:none;color:#fff}
.vcard{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.vcard-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.vcard-id{font-size:11px;color:var(--muted);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.vcard-q{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:16px}
textarea{width:100%;background:var(--s2);border:2px solid var(--acc);border-radius:10px;color:var(--text);padding:12px;font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;resize:none;margin-bottom:10px;min-height:90px}
textarea::placeholder{color:var(--muted);font-size:13px}
.v-check{width:100%;padding:13px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:10px;transition:opacity .2s}
.v-check:disabled{opacity:.4;cursor:not-allowed}
.ai-res{padding:14px;border-radius:10px;font-size:13px;line-height:1.7;display:none;margin-bottom:10px}
.ai-res.loading{background:var(--s2);border:1px solid var(--border);color:var(--muted);display:block}
.ai-res.ok{background:#0a1a10;border:1px solid var(--green);color:#86efac;display:block}
.ai-res.no{background:#1a0808;border:1px solid var(--red);color:#fca5a5;display:block}
.ans-box{background:#091708;border:1px solid #1a4a2a;border-radius:10px;padding:14px;font-size:13px;color:#86efac;white-space:pre-wrap;line-height:1.75;display:none;margin-bottom:10px}
.ans-box.show{display:block}
.dialog-area{border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-top:4px;display:none}
.dialog-area.show{display:block}
.dlbl{font-size:11px;color:var(--muted);margin-bottom:8px}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qbtn{background:var(--s2);border:1px solid var(--border);color:#94a3b8;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.drow{display:flex;gap:6px}
.dinp{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif}
.dsend{background:var(--acc);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}
.dresp{margin-top:10px;font-size:13px;line-height:1.75;color:#86efac;white-space:pre-wrap}
.v-btns{display:flex;gap:8px;margin-top:10px}
.v-btn-ans{flex:1;padding:11px;border-radius:9px;background:#0d1829;border:2px solid var(--acc);color:#93c5fd;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.v-btn-next{flex:1;padding:11px;border-radius:9px;background:var(--acc);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">📦 IHK Тренажер — Lagerlogistik</div>
  <a class="hdr-back" href="/">← Назад</a>
</div>
<div class="mode-tabs">
  <button class="mode-btn on" id="mFlash" onclick="setMode('flash')">📚 Картки</button>
  <button class="mode-btn" id="mVoice" onclick="setMode('voice')">🎤 Голос + AI</button>
</div>
<div class="day-scroll" id="dayScroll"></div>
<main id="main"></main>
<script src="/data.de.js"></script>
<script src="/data.ua.js"></script>
<script>
// картки показують німецький набір; український беремо з DATA_UA за id
const DATA = DATA_DE;
(function(){
  const DE={
    '1.1':'Vor der Entladung prüfe ich den Empfänger — Name und Adresse — und das Lieferdatum, um sicherzustellen, dass die Lieferung für uns bestimmt ist und pünktlich geliefert wurde.\n\nWeitere mögliche Angaben: Absender · Kennzeichen des Fahrzeugs · Bestellnummer',
    '1.2':'Ich trage das Datum 28.04.2026 ein und unterschreibe im Feld „Ware erhalten". Damit bestätige ich dem Fahrer die ordnungsgemäße Anlieferung.\n\nBei Schäden würde ich einen Vorbehalt eintragen, z.B. „2 Kartons eingedrückt", und den Fahrer ebenfalls unterschreiben lassen — ohne Vorbehalt kann der Transporteur nicht haftbar gemacht werden!',
    '1.3':'Ein Tausch ist nicht möglich bei: gebrochenen oder fehlenden Bodenbrettern, fehlenden oder beschädigten Klötzen, fehlendem oder unlesbarem EPAL-Brandzeichen.',
    '1.4':'Es gibt vier Mangelarten:\n\n1. Identitätsmangel — falsches Produkt, z.B. kurze schwarze Hose statt langer grauer Sporthose.\n2. Quantitätsmangel — falsche Menge, z.B. 1.400 statt 1.500 Stück.\n3. Qualitätsmangel — fehlerhafte Verarbeitung, z.B. schlechte Nähte oder Löcher.\n4. Beschaffenheitsmangel — falsches Material, z.B. Baumwolle statt Polyester.\n\nBei allen Mängeln: zuerst Nacherfüllung verlangen! (§ 437 BGB)',
    '1.5':'1.500 × 15 ÷ 100 = 225 Stück → QS-Abteilung.\nRestliche 1.275 Stück → Sperrfläche S 20.\n\nRechenweg immer vollständig angeben — ohne Rechenweg = 0 Punkte!',
    '1.6':'Die Ware kommt auf die Sperrfläche, weil sie noch nicht qualitätsgeprüft wurde und daher nicht für den Verkauf oder die Auslieferung freigegeben ist.\n\nAuf der Sperrfläche wird verhindert, dass nicht geprüfte Ware versehentlich eingelagert oder ausgeliefert wird.',
    '1.7':'Ich fülle den Internen Transportbeleg aus:\n\nHinlieferung:\n  Lagerzone:         C\n  Artikelnummer:     240150\n  An Abteilung:      Qualitätssicherung\n  Menge in Stück:    225\n  Lieferschein-Nr.:  55016-20\n\nRücksendung:\n  Lagerzone C · Sperrfläche S 20',
    '1.8':'Eltron GmbH kann Nachbesserung verlangen — der Verkäufer muss die mangelhaften Nähte reparieren. Alternativ ist Ersatzlieferung möglich.\n\nReihenfolge § 437 BGB:\n1. Nacherfüllung (Nachbesserung ODER Ersatzlieferung) — vorrangig!\n2. Rücktritt oder Minderung\n3. Schadensersatz',
    '1.9.1':'12 × 6 × 20,00 € = 1.440,00 €\n\nErgebnis: Die zusätzlichen Lagerkosten betragen 1.440,00 €.',
    '1.9.2':'7.800,00 € − 1.440,00 € = 6.360,00 €\n\nErgebnis: Die tatsächliche Einsparung beträgt 6.360,00 €.',
    '1.10.1':'Summe der Anteile: 5+4+3+3 = 15. Wert einer Einheit: 120 ÷ 15 = 8 Stück.\nRot: 5×8 = 40 · Gelb: 4×8 = 32 · Blau: 3×8 = 24 · Grün: 3×8 = 24.\nProbe: 40+32+24+24 = 120 ✓',
    '1.10.2':'Eltron GmbH übernimmt die Sortimentsfunktion — das Lager stellt aus einzelnen Artikeln verschiedener Farben kundenspezifische Sets zusammen.',
    '1.10.3':'Ich lege zwischen die Europalette und die unterste Lage der Sets eine Zwischenlage aus Wellpappe oder Folie.',
    '2.1.1':'Es handelt sich um die statische Bereitstellung. Die Ware steht fest an einem festen Lagerplatz. Der Kommissionierer bewegt sich selbst zur Ware und entnimmt die Artikel — Prinzip: Mann-zur-Ware.',
    '2.1.2':'Der Hauptvorteil ist der geringere Investitionsaufwand — es wird keine aufwendige technische Anlage benötigt, einfache Regale reichen aus.',
    '2.2.2':'Ich berechne die Regalhöhe:\n10 cm + (8 Ebenen × 40 cm) = 10 + 320 = 330 cm = 3,30 m',
    '2.2.3':'Ich wähle den Bulder 1308, weil er als einziges Gerät beide Anforderungen gleichzeitig erfüllt: Hubhöhe mindestens 3,00 m (300 cm ✓) und 2 Personen im Fahrerstand (✓).',
    '2.3':'Beim Pick-Pack-Verfahren wird der Artikel direkt beim Entnehmen aus dem Regal in den Versandkarton gelegt. Kommissionierung und Verpackung erfolgen in einem einzigen Arbeitsgang.',
    '2.4.1':'Der Meldebestand ist die Lagermenge, bei deren Unterschreitung eine neue Bestellung ausgelöst wird. Er stellt sicher, dass der Verbrauch während der Lieferzeit gedeckt ist, ohne dass ein Fehlbestand entsteht.',
    '2.4.2':'Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand\n= 100 m × 5 Tage + 300 m = 500 + 300 = 800 m'
  };
  const UA={
    '1.1':'Перед розвантаженням я перевіряю одержувача — ім\'я та адресу — і дату доставки, щоб переконатись що поставка призначена для нас і доставлена вчасно.\n\nІнші можливі дані: відправник · номерний знак авто · номер замовлення',
    '1.2':'Я вписую дату 28.04.2026 і підписую у полі „Ware erhalten". Цим підтверджую водієві належну доставку.\n\nПри пошкодженнях я б вніс застереження (Vorbehalt), напр. „2 ящики вм\'яті", і водій теж мав би підписати — без застереження перевізник не несе відповідальності!',
    '1.3':'Обмін неможливий при: зламаних або відсутніх дошках настилу, відсутніх або пошкоджених кубиках-опорах, відсутньому або нечитабельному знаку EPAL.',
    '1.4':'Є чотири види дефектів:\n\n1. Identitätsmangel — не той товар, напр. короткі чорні штани замість довгих сірих.\n2. Quantitätsmangel — не та кількість, напр. 1.400 замість 1.500 штук.\n3. Qualitätsmangel — дефекти виготовлення, напр. погані шви або дірки.\n4. Beschaffenheitsmangel — неправильний матеріал, напр. бавовна замість поліестеру.\n\nПри всіх дефектах спочатку вимагати Nacherfüllung! (§ 437 BGB)',
    '1.5':'Щоб дізнатись скільки штук іде на перевірку, беру загальну кількість 1.500 штук, множу на відсоток 15 і ділю на 100 — отримую 225 штук для відділу QS. Решта 1.275 штук (1.500 − 225) іде на заблоковану зону S 20 і чекає результату перевірки.\n\nХід розрахунку завжди писати повністю — без нього = 0 балів!',
    '1.6':'Товар розміщується на заблокованій зоні, оскільки він ще не пройшов перевірку якості і тому не звільнений для продажу або відвантаження.\n\nНа заблокованій зоні запобігається випадкове складування або відвантаження неперевіреного товару.',
    '1.7':'Я заповнюю внутрішній транспортний документ:\n\nДоставка:\n  Зона складу:       C\n  Артикул:           240150\n  До відділу:        Qualitätssicherung\n  Кількість (шт.):   225\n  Номер накладної:   55016-20\n\nПовернення:\n  Зона C · Заблокована зона S 20',
    '1.8':'Eltron GmbH може вимагати Nachbesserung — постачальник мусить виправити дефектні шви. Альтернативно можна вимагати Ersatzlieferung — нові бездоганні штани.\n\nПорядок § 437 BGB:\n1. Nacherfüllung (Nachbesserung АБО Ersatzlieferung) — першочергово!\n2. Rücktritt або Minderung\n3. Schadensersatz',
    '1.9.1':'Множу кількість палет (12) на тривалість зберігання (6 місяців) і на ціну за палету на місяць (20,00 €):\n12 × 6 × 20,00 € = 1.440,00 €\n\nРезультат: Додаткові витрати на зберігання становлять 1.440,00 €.',
    '1.9.2':'Від можливої економії відраховую додаткові витрати на зберігання:\n7.800,00 € − 1.440,00 € = 6.360,00 €\n\nРезультат: Фактична економія становить 6.360,00 €. Купівля вигідна, але менше ніж здається на перший погляд.',
    '1.10.1':'Складаю суму часток: 5+4+3+3 = 15. Одна частка = 120 ÷ 15 = 8 штук.\nЧервоних: 5×8 = 40 · Жовтих: 4×8 = 32 · Синіх: 3×8 = 24 · Зелених: 3×8 = 24.\nПеревірка: 40+32+24+24 = 120 ✓',
    '1.10.2':'Eltron GmbH виконує Sortimentsfunktion — склад збирає з окремих артикулів різних кольорів індивідуальні набори для клієнтів.',
    '1.10.3':'Я кладу між Euro-палетою і нижнім шаром наборів прокладку з гофрокартону або плівки.',
    '2.1.1':'Це статична підготовка (statische Bereitstellung). Товар стоїть нерухомо на фіксованому місці. Комплектувальник сам переміщується до товару і забирає артикули — принцип: людина-до-товару.',
    '2.1.2':'Головна перевага — менші інвестиційні витрати — не потрібне дороге автоматичне обладнання, достатньо звичайних стелажів.',
    '2.2.2':'Я розраховую висоту стелажу:\n10 см + (8 рівнів × 40 см) = 10 + 320 = 330 см = 3,30 м',
    '2.2.3':'Я вибираю Bulder 1308, тому що він єдиний відповідає обом вимогам одночасно: висота підйому мінімум 3,00 м (300 см ✓) і 2 особи на водійській платформі (✓).',
    '2.3':'При методі Pick-Pack артикул безпосередньо при вилученні з стелажу кладеться у відправний картон. Комплектування і упаковка відбуваються в одному робочому кроці.',
    '2.4.1':'Meldebestand — це кількість товару на складі, при досягненні якої автоматично розміщується нове замовлення. Він гарантує що споживання під час часу постачання буде покрито без виникнення дефіциту.',
    '2.4.2':'Meldebestand = Денне споживання × Час постачання + Мінімальний запас\n= 100 м × 5 днів + 300 м = 500 + 300 = 800 м'
  };
  ['a1','a2','a3','a4'].forEach(k=>{
    if(!DATA[k])return;
    DATA[k].qs.forEach(q=>{
      if(DE[q.id])q.de_a=DE[q.id];
      if(UA[q.id])q.ua_a=UA[q.id];
    });
  });
})();

// Український ТЕКСТ ПИТАННЯ беремо з data.ua.js за id — переклад уже є
// для всіх 112 питань, тож режим UA більше не показує німецьке питання.
//
// Відповіді (ans) навмисно НЕ чіпаємо: у data.ua.js вони теж німецькі —
// це зразкова відповідь, яку на екзамені треба написати німецькою.
// Українські відповіді існують лише там, де їх виписано вручну (UA вище).
(function(){
  if(typeof DATA_UA==='undefined')return;
  const byId={};
  Object.values(DATA_UA).forEach(s=>(s.qs||[]).forEach(q=>{byId[q.id]=q;}));
  Object.values(DATA).forEach(s=>(s.qs||[]).forEach(q=>{
    const u=byId[q.id];
    if(u&&!q.ua_q&&u.text)q.ua_q=u.text;
  }));
})();

let mode='flash',day=0,qIdx=0,flipped=false,lang='ua',dialogCtx=null,done={};

const PKEY='ihk_voice_v1';
function loadProg(){
  try{
    const p=JSON.parse(localStorage.getItem(PKEY)||'null');
    if(!p||p.v!==1)return;
    if(p.done&&typeof p.done==='object')done=p.done;
    if(p.mode==='flash'||p.mode==='voice')mode=p.mode;
    if(p.lang==='de'||p.lang==='ua')lang=p.lang;
    if(Number.isInteger(p.day))day=Math.min(Math.max(p.day,0),totalDays()-1);
    if(Number.isInteger(p.qIdx))qIdx=Math.min(Math.max(p.qIdx,0),getDayQs(day).length-1);
  }catch(e){}
}
function saveProg(){
  try{localStorage.setItem(PKEY,JSON.stringify({v:1,day,qIdx,mode,lang,done,updated:new Date().toISOString()}));}catch(e){}
}
function markDone(){
  const q=getDayQs(day)[qIdx];
  if(q&&!done[q.id]){done[q.id]=true;renderDays();}
  saveProg();
}
function dayStats(d){
  const qs=getDayQs(d);
  return {ok:qs.filter(q=>done[q.id]).length,tot:qs.length};
}

function getAllQs(){const a=[];['a1','a2','a3','a4'].forEach(k=>{if(DATA[k])DATA[k].qs.forEach(q=>a.push(q));});return a;}
function getDayQs(d){return getAllQs().slice(d*5,(d+1)*5);}
function totalDays(){return Math.ceil(getAllQs().length/5);}

function renderDays(){
  let h='';
  for(let i=0;i<totalDays();i++){
    const s=dayStats(i);
    const cls='day-btn'+(i===day?' on':'')+(s.tot&&s.ok===s.tot?' full':'');
    h+=`<button class="${cls}" onclick="goDay(${i})">Tag ${i+1}<span class="day-prog">${s.ok}/${s.tot}</span></button>`;
  }
  document.getElementById('dayScroll').innerHTML=h;
}
function goDay(d){day=d;qIdx=0;flipped=false;saveProg();renderDays();renderMain();}
function syncMode(){
  document.getElementById('mFlash').className='mode-btn'+(mode==='flash'?' on':'');
  document.getElementById('mVoice').className='mode-btn'+(mode==='voice'?' on':'');
}
function setMode(m){
  mode=m;syncMode();
  qIdx=0;flipped=false;saveProg();renderMain();
}
function renderMain(){mode==='flash'?renderFlash():renderVoice();}
function dots(){
  return getDayQs(day).map((_,i)=>
    `<div class="dot ${i===qIdx?'on':''}" onclick="goQ(${i})">${i+1}</div>`).join('');
}
function goQ(i){qIdx=i;flipped=false;saveProg();renderMain();}
function nextQ(){qIdx=(qIdx+1)%getDayQs(day).length;flipped=false;saveProg();renderMain();}

function renderFlash(){
  const qs=getDayQs(day);
  if(qIdx>=qs.length)qIdx=0;
  const q=qs[qIdx];
  if(!q){document.getElementById('main').innerHTML='<div class="q-info">Питань немає</div>';return;}
  const ua=lang==='ua';
  const qt=ua&&q.ua_q?q.ua_q:q.text;
  const at=ua&&q.ua_a?q.ua_a:(q.de_a||q.ans||'');
  const clDE=lang==='de'?'lang-btn on':'lang-btn';
  const clUA=lang==='ua'?'lang-btn on':'lang-btn';
  document.getElementById('main').innerHTML=`
    <div class="q-info">Питання ${qIdx+1} / ${getDayQs(day).length}</div>
    <div class="lang-row">
      <button class="${clDE}" onclick="setLang('de')">DE</button>
      <button class="${clUA}" onclick="setLang('ua')">UA</button>
    </div>
    <div class="dots">${dots()}</div>
    <div class="flashcard">
      <div class="fc-inner ${flipped?'flipped':''}" onclick="flipCard()">
        <div class="fc-face fc-front">
          <div class="fc-lbl">❓ Aufgabe ${q.id}</div>
          <div class="fc-id">⭐ ${q.pts} Punkte</div>
          <div class="fc-q">${qt}</div>
          <div class="fc-hint">👆 Натисни щоб побачити відповідь</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-lbl">✅ Відповідь</div>
          <div class="fc-a">${at}</div>
        </div>
      </div>
    </div>
    <div id="fcBtns">${flipped
      ?`<div class="btn-row"><button class="btn btn-back" onclick="flipCard()">← Питання</button><button class="btn btn-next" onclick="nextQ()">Далі →</button></div>`
      :`<button class="btn-show" onclick="flipCard()">Показати відповідь</button>`
    }</div>`;
}
function setLang(l){lang=l;saveProg();renderMain();}
function flipCard(){flipped=!flipped;if(flipped)markDone();renderMain();}

// Показує відповідь тією мовою, що й картки: українську, якщо вона є.
function getAns(q){
  const t=(lang==='ua'&&q.ua_a)?q.ua_a:(q.de_a||q.ans||'');
  return t.split('\n').join('<br>');
}
function renderVoice(){
  const qs=getDayQs(day);
  if(qIdx>=qs.length)qIdx=0;
  const q=qs[qIdx];
  if(!q){document.getElementById('main').innerHTML='<div class="q-info">Питань немає</div>';return;}
  const ua=lang==='ua';
  const qt=ua&&q.ua_q?q.ua_q:q.text;
  const clDE=lang==='de'?'lang-btn on':'lang-btn';
  const clUA=lang==='ua'?'lang-btn on':'lang-btn';
  document.getElementById('main').innerHTML=`
    <div class="q-info">Питання ${qIdx+1} / ${getDayQs(day).length}</div>
    <div class="lang-row">
      <button class="${clDE}" onclick="setLang('de')">DE</button>
      <button class="${clUA}" onclick="setLang('ua')">UA</button>
    </div>
    <div class="dots">${dots()}</div>
    <div class="vcard">
      <div class="vcard-lbl">❓ Aufgabe ${q.id}</div>
      <div class="vcard-id">⭐ ${q.pts} Punkte</div>
      <div class="vcard-q">${qt}</div>
      <textarea id="vInp" placeholder="🎤 Говори через Samsung клавіатуру або пиши тут..." oninput="onVI(this.value)" rows="4"></textarea>
      <button class="v-check" id="vBtn" onclick="vCheck()" disabled>🤖 AI перевіряє</button>
      <div class="ai-res" id="vAi"></div>
      <div class="ans-box" id="vAns">${getAns(q)}</div>
      <div class="dialog-area" id="vDlg">
        <div class="dlbl">💬 Запитай AI далі:</div>
        <div class="qbtns">
          <button class="qbtn" onclick="askQ('Як правильно відповісти?')">Як правильно?</button>
          <button class="qbtn" onclick="askQ('Що я пропустив?')">Що пропустив?</button>
          <button class="qbtn" onclick="askQ('Ідеальна відповідь')">Ідеальна відповідь</button>
        </div>
        <div class="drow">
          <input class="dinp" id="dInp" placeholder="Своє питання...">
          <button class="dsend" onclick="sendDlg()">→</button>
        </div>
        <div class="dresp" id="dResp"></div>
      </div>
      <div class="v-btns">
        <button class="v-btn-ans" onclick="showVAns()">📖 Відповідь</button>
        <button class="v-btn-next" onclick="nextQ()">Далі →</button>
      </div>
    </div>`;
}
function onVI(v){const b=document.getElementById('vBtn');if(b){b.disabled=!v.trim();b.style.opacity=v.trim()?'1':'0.4';}}
function showVAns(){
  const el=document.getElementById('vAns');
  if(!el)return;
  el.classList.toggle('show');
  if(el.classList.contains('show'))markDone();
}
async function vCheck(){
  const inp=document.getElementById('vInp'),ai=document.getElementById('vAi'),dlg=document.getElementById('vDlg');
  if(!inp||!inp.value.trim())return;
  const q=getDayQs(day)[qIdx],ans=inp.value.trim();
  ai.className='ai-res loading';ai.textContent='⏳ AI перевіряє...';
  try{
    const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`Du bist ein verständnisvoller IHK-Prüfer. Bewerte den INHALT, nicht die Formulierung.
Frage: ${q.text}
Musterlösung: ${q.de_a||q.ans||''}
Antwort: ${ans}
Kerninhalt stimmt → ✅ Richtig! Punkte fehlen → ❌ Nicht vollständig. 1-2 Sätze Ukrainisch.`})});
    const d=await r.json();
    const t=d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    ai.className='ai-res '+(t.includes('✅')?'ok':'no');ai.innerHTML=t;
    markDone();
    dialogCtx={q:q.text,ans:q.de_a||q.ans||'',user:ans,ai:t};
    if(dlg)dlg.className='dialog-area show';
  }catch(e){ai.className='ai-res no';ai.textContent='Помилка AI.';}
}
async function askQ(t){const i=document.getElementById('dInp');if(i)i.value=t;sendDlg();}
async function sendDlg(){
  const inp=document.getElementById('dInp'),resp=document.getElementById('dResp');
  if(!inp||!resp||!inp.value.trim())return;
  const c=dialogCtx||{};resp.textContent='⏳...';
  try{
    const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`IHK Lagerlogistik. Питання: ${c.q}. Відповідь: ${c.ans}. Учень: ${c.user}. Запит: ${inp.value.trim()}. Коротко українською.`})});
    const d=await r.json();
    resp.textContent=d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    inp.value='';
  }catch(e){resp.textContent='Помилка.';}
}

loadProg();
syncMode();
renderDays();
renderMain();
</script>
<script src="/nav.js"></script>
</body>
</html>
