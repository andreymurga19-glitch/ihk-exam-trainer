<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHK Exam Trainer 2026 — UA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0b0d13;--s1:#13161f;--s2:#1a1e2b;--s3:#222639;--border:#252a3a;--acc:#4f7fff;--gold:#f5c842;--green:#22c55e;--red:#ef4444;--purple:#a78bfa;--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.65;min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-size:15px;font-weight:700;color:#fff}.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-txt{font-size:12px;color:var(--dim);white-space:nowrap}
.prog-bar{width:120px;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}

/* TABS */
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stats-bar{display:flex;gap:0;background:#0d0f17;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:10px 14px;gap:10px}
.stats-bar::-webkit-scrollbar{display:none}
.stat-chip{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:8px 13px;min-width:128px;flex-shrink:0}
.stat-chip .sc-title{font-size:10px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.stat-chip .sc-main{font-size:15px;font-weight:700;color:#fff}
.stat-chip .sc-sub{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.5}
.stat-chip.active{border-color:var(--acc);background:#11192e}

/* EXAM LAUNCH BOX */
.exam-launch-box{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#2a0a0a,#1a0505);border:1px solid #7f1d1d;border-radius:12px;padding:14px 18px;margin-bottom:18px;flex-wrap:wrap}
.exam-launch-box .elb-title{font-size:14px;font-weight:700;color:#fca5a5}
.exam-launch-box .elb-sub{font-size:11px;color:#9ca3af;margin-top:2px}

/* EXAM MODE OVERLAY */
#examOverlay{position:fixed;inset:0;background:var(--bg);z-index:5000;display:none;flex-direction:column}
#examOverlay.show{display:flex}
.exam-hdr{background:linear-gradient(135deg,#1a0505,#2a0a0a);border-bottom:2px solid #dc2626;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.exam-hdr-title{font-size:14px;font-weight:700;color:#fff}
.exam-timer{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:#fca5a5;background:#1a0505;border:1px solid #7f1d1d;border-radius:8px;padding:6px 14px}
.exam-timer.warn{color:var(--gold);border-color:var(--gold);animation:examPulse 1s infinite}
.exam-timer.danger{color:#fca5a5;border-color:#dc2626;animation:examPulse .5s infinite}
@keyframes examPulse{0%,100%{opacity:1}50%{opacity:.5}}
.exam-progress{font-size:12px;color:var(--muted)}
.exam-body{flex:1;overflow-y:auto;padding:20px 16px 100px;max-width:760px;margin:0 auto;width:100%}
.exam-q-num{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.exam-q-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:0}
.exam-q-text{font-size:15px;color:#fff;line-height:1.7;margin-bottom:18px}
.exam-opt{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:13px 16px;margin-bottom:9px;color:var(--text);font-size:14px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.exam-opt:hover{border-color:var(--acc)}
.exam-opt.selected{border-color:var(--acc);background:#1a2d4f;color:#93c5fd;font-weight:600}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0f17;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;justify-content:center;align-items:center}
.exam-nav button{padding:11px 22px;border-radius:9px;font-weight:600;font-size:14px;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.exam-btn-prev{background:var(--s2);color:var(--text)}
.exam-btn-next{background:var(--acc);color:#fff}
.exam-btn-finish{background:#dc2626;color:#fff}
.exam-dots{display:flex;flex-wrap:wrap;gap:5px;padding:14px 16px;max-width:760px;margin:0 auto}
.exam-dot{width:26px;height:26px;border-radius:6px;background:var(--s2);border:1px solid var(--border);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-family:'JetBrains Mono',monospace}
.exam-dot.answered{background:#1a3a2a;border-color:var(--green);color:var(--green)}
.exam-dot.current{border-color:var(--acc);border-width:2px;color:#fff}

/* EXAM RESULT SCREEN */
.exam-result{max-width:480px;margin:40px auto;text-align:center;padding:0 16px}
.exam-result-badge{font-size:64px;margin-bottom:10px}
.exam-result-title{font-size:24px;font-weight:700;margin-bottom:8px}
.exam-result-title.pass{color:var(--green)}
.exam-result-title.fail{color:#fca5a5}
.exam-result-score{font-size:46px;font-weight:800;color:#fff;margin:18px 0 4px}
.exam-result-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.exam-result-bar{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin-bottom:24px}
.exam-result-fill{height:100%;border-radius:5px}
.exam-result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.exam-result-stat{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:12px}
.exam-result-stat .ers-num{font-size:20px;font-weight:700;color:#fff}
.exam-result-stat .ers-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-family:'Inter',sans-serif}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
#subTabs{background:#0d0f17;padding-left:8px}
.nav-group{background:var(--s1);border-bottom:1px solid var(--border)}
.nav-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:6px 14px 0;font-weight:600}
.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-size:13px;font-weight:700;color:#fff}
#subTabs .tab{font-size:12px;padding:8px 14px;color:#7c8aa5}
#subTabs .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.on){color:var(--text)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 160px)}
.sidebar{width:210px;min-width:210px;background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
.content{flex:1;overflow-y:auto;padding:22px 24px 60px}
.vocab-side{width:230px;min-width:230px;background:var(--s1);border-left:1px solid var(--border);overflow-y:auto}

/* SIDEBAR ITEMS */
.sb-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:6px;cursor:pointer;margin:1px 4px;transition:background .15s}
.sb-item:hover{background:var(--s2)}
.sb-item.act{background:#1a2d4f}
.sb-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc);font-weight:700;min-width:30px}
.sb-name{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:115px}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;margin-left:auto}
.sb-item.done .sb-dot{background:var(--green)}
.sb-pts{font-size:10px;color:var(--muted);margin-left:2px;flex-shrink:0}

/* SITUATION */
.sit-box{background:#0d1829;border:1px solid #1d3a60;border-radius:12px;padding:18px 20px;margin-bottom:22px}
.sit-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.sit-box p{color:#94a3b8;font-size:13px;line-height:1.75}
.sit-box table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.sit-box th{background:#162035;color:var(--acc);padding:7px 10px;text-align:left;font-size:11px;font-weight:600}
.sit-box td{padding:6px 10px;border-bottom:1px solid #1a2535;color:var(--dim)}
.sit-box tr:last-child td{border:none}

/* QUESTION CARD */
.qcard{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:border-color .2s}
.qcard:hover{border-color:var(--s3)}
.qcard-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.qbadge{background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;font-family:'JetBrains Mono',monospace;white-space:nowrap;flex-shrink:0}
.qpts{background:var(--s2);color:var(--gold);font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.qtext{font-size:13.5px;color:var(--text);line-height:1.75;flex:1}
.qtext strong{color:#fff}

/* BTNS */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s}
.btn-exp{background:#152238;color:#60a5fa;border:1px solid #1e3a5f}.btn-exp:hover{background:#1a2f4f}
.btn-hint{background:#1e1500;color:var(--gold);border:1px solid #2d2000}.btn-hint:hover{background:#2a1e00}
.btn-check{background:var(--acc);color:#fff}.btn-check:hover{background:#3a6bef}
.btn-clr{background:var(--s2);color:var(--muted);border:1px solid var(--border)}.btn-clr:hover{color:var(--red)}

/* BOXES */
.exp-box{background:#0c1e38;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:12px 15px;margin:8px 0;font-size:13px;color:#93c5fd;display:none;line-height:1.7}
.hint-box{background:#1a1200;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 15px;margin:8px 0;font-size:13px;color:#fcd34d;display:none;line-height:1.7}
.exp-box.on,.hint-box.on{display:block}

/* TEXTAREA */
.ans-area{margin-top:8px}
.ans-area textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:11px 13px;resize:vertical;min-height:80px;outline:none;transition:border-color .2s}
.ans-area textarea:focus{border-color:var(--acc)}

/* AI RESULT */
.ai-res{margin-top:10px;padding:14px 16px;border-radius:9px;font-size:13px;display:none;line-height:1.7}
.ai-res.on{display:block}
.ai-res.ok{background:#0a2015;border:1px solid #166534;color:#86efac}
.ai-res.bad{background:#200a0a;border:1px solid #991b1b;color:#fca5a5}
.ai-res.part{background:#1a1300;border:1px solid #854d0e;color:#fde68a}
.ai-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;opacity:.8}
.ai-loading{color:var(--muted);font-size:13px;padding:8px 0;display:none}
.ai-loading.on{display:block}

/* VOCAB SIDE */
.vs-hdr{padding:14px 15px;border-bottom:1px solid var(--border)}
.vs-hdr h3{font-size:13px;font-weight:700;color:var(--text)}
.vs-hdr p{font-size:11px;color:var(--muted);margin-top:2px}
.vs-body{padding:8px}
.vs-item{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.vs-word{color:var(--gold);font-weight:600;font-size:12px;word-break:break-all}
.vs-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0;line-height:1;flex-shrink:0}
.vs-del:hover{color:var(--red)}
.vs-empty{padding:20px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}

/* TABLES in questions */
.qt{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.qt th{background:var(--s2);color:var(--acc);padding:7px 10px;text-align:left;font-size:11px;border-bottom:1px solid var(--border)}
.qt td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--dim)}
.qt tr:last-child td{border:none}
.qtext table, .sit-box table{max-width:100%;overflow-x:auto;display:block}
.ai-res table{max-width:100%;overflow-x:auto;display:block}
.ans-table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.ans-table td,.ans-table th{padding:6px 10px;border:1px solid #2d3a5a;color:#e2e8f0}
.ans-table th{background:#162035;color:var(--acc);font-size:11px}
.ai-res pre,.correct-pre{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:13px;line-height:1.7}
[contenteditable]:focus{border-color:#22c55e !important;background:#071510 !important}
[contenteditable]:empty:before{content:attr(placeholder);color:#374151;font-style:italic}
.mc-options{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mc-opt{text-align:left;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.mc-opt:hover{border-color:var(--acc);background:#162035}
.mc-opt.selected{border-color:var(--acc);background:#1a2d4f;color:#93c5fd;font-weight:600}
.zuord-wrap{margin:10px 0}
.zuord-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.zuord-term{font-weight:600;color:#fff;font-size:13px;min-width:140px;flex-shrink:0}
.zuord-opts{display:flex;gap:6px;flex-wrap:wrap}
.zuord-btn{background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.zuord-btn:hover{border-color:var(--acc)}
.zuord-btn.selected{background:#1a2d4f;border-color:var(--acc);color:#93c5fd;font-weight:600}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;font-weight:700;font-size:13px;padding:8px 22px;border-radius:20px;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.on{opacity:1}

/* VOCAB PAGE */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.vocab-card{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* HIGHLIGHT selectable */
.selectable{cursor:text}

@media(max-width:900px){.sidebar{display:none}.vocab-side{display:none}.layout{height:auto}.content{padding:14px}}

/* ===== VOICE TRAINER ===== */
.vt-wrap{max-width:600px;margin:0 auto;padding:20px 16px 100px}
.vt-day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.vt-day-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.vt-day-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.vt-day-btn.done{border-color:var(--green);color:var(--green)}
.vt-progress{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.vt-prog-bar{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.vt-prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.vt-prog-txt{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.vt-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;transition:border-color .3s}
.vt-card.correct{border-color:var(--green)}
.vt-card.wrong{border-color:var(--red)}
.vt-card-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.vt-qid{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:8px}
.vt-qtext{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:16px}
.vt-pts{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:16px}
.vt-mic-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.vt-mic-btn.recording{background:#dc2626;animation:vtPulse 1s infinite}
.vt-mic-btn:disabled{opacity:.5;cursor:not-allowed}
@keyframes vtPulse{0%,100%{opacity:1}50%{opacity:.7}}
.vt-transcript{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;font-size:13px;color:var(--dim);min-height:40px;line-height:1.6;font-style:italic}
.vt-transcript.active{border-color:var(--acc);color:var(--text)}
.vt-ai-result{margin-top:12px;padding:14px;border-radius:10px;font-size:13px;line-height:1.7}
.vt-ai-result.correct{background:#0a1a10;border:1px solid var(--green);color:#86efac}
.vt-ai-result.wrong{background:#1a0808;border:1px solid var(--red);color:#fca5a5}
.vt-ai-result.loading{background:var(--s2);border:1px solid var(--border);color:var(--muted)}
.vt-answer-box{background:#091708;border:1px solid #1a4a2a;border-radius:10px;padding:14px;margin-top:10px;font-size:13px;color:#86efac;white-space:pre-wrap;line-height:1.75;display:none}
.vt-answer-box.show{display:block}
.vt-btns{display:flex;gap:8px;margin-top:12px}
.vt-btn{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none}
.vt-btn-ans{background:#0d1829;border:2px solid var(--acc);color:#93c5fd}
.vt-btn-no{background:#1a0808;border:2px solid var(--red);color:var(--red)}
.vt-btn-ok{background:#0a1a10;border:2px solid var(--green);color:var(--green)}
.vt-dots{display:flex;gap:5px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.vt-dot{width:26px;height:26px;border-radius:6px;background:var(--s2);border:1px solid var(--border);font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.vt-dot.cur{border-color:var(--acc);color:#fff;background:#11192e;border-width:2px}
.vt-dot.ok{background:#0a1a10;border-color:var(--green);color:var(--green)}
.vt-dot.no{background:#1a0808;border-color:var(--red);color:var(--red)}
.vt-done{text-align:center;padding:40px 20px}
.vt-done-emoji{font-size:64px;margin-bottom:12px}
.vt-done-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}
.vt-done-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.vt-score-chips{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.vt-chip{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:12px 18px;text-align:center;min-width:80px}
.vt-chip .cn{font-size:22px;font-weight:800;color:#fff}
.vt-chip .cl{font-size:11px;color:var(--muted);margin-top:2px}
.vt-chip.g{border-color:var(--green)}.vt-chip.r{border-color:var(--red)}

const DATA = {"a1":{"label":"Завдання 1 — Приймання товару (30 балів, ~45 хв)","sit":"<p>Компанія <strong>Eltron GmbH</strong> надає логістичні послуги у Нюрнберзі. Сьогодні, 28.04.2026, ви отримуєте поставку спортивного одягу. Ви проводите приймання та перевірку товару. Частина поставленого одягу передається на контроль якості. Після цього ви готуєте товар до розміщення на складі. Додатково для збуту спортивних товарів комплектуються набори. Ви відповідаєте за приймання товару і отримуєте накладну від водія.</p>\n  <table><tr><th>№ накладної</th><td>55016-20</td><th>№ замовлення</th><td>13200</td></tr>\n  <tr><th>Відправник</th><td>Sommer GmbH, Neue Straße 17, 10326 Solberg</td><th>Дата замовлення</th><td>11.04.2026</td></tr>\n  <tr><th>Одержувач</th><td>Eltron GmbH, Luisenstraße 36, 90312 Nürnberg</td><th>Дата доставки</th><td>28.04.2026</td></tr>\n  <tr><th>Перевізник</th><td>Spurt-Logistik GmbH</td><th>Водій / Номерний знак</th><td>Hr. Müller / NG SL 258</td></tr></table>\n  <table style=\"margin-top:10px\"><tr><th>№</th><th>Товар</th><th>Арт. №</th><th>Кількість</th></tr>\n  <tr><td>1</td><td>Спортивні штани, довгі, червоні</td><td>240125</td><td>1.600</td></tr>\n  <tr><td>2</td><td>Спортивні штани, довгі, сірі</td><td>240150</td><td>1.500</td></tr>\n  <tr><td>3</td><td>Спортивні штани, короткі, сині</td><td>220140</td><td>1.600</td></tr>\n  <tr><td>4</td><td>Спортивні штани, короткі, зелені</td><td>220135</td><td>1.500</td></tr>\n  <tr><td>5</td><td>Футболка, біла</td><td>300120</td><td>1.600</td></tr>\n  <tr><td>6</td><td>Футболка, зелена</td><td>300135</td><td>1.000</td></tr>\n  <tr><td>7</td><td>Футболка, синя</td><td>300140</td><td>750</td></tr>\n  <tr><td>8</td><td>Кепка, зелена</td><td>450135</td><td>750</td></tr>\n  <tr><td>9</td><td>Кепка, бежева</td><td>450160</td><td>300</td></tr></table>","qs":[{"id":"1.1","pts":2,"text":"Назвіть <strong>2 дані</strong> з накладної, які ви перевіряєте <strong>перед розвантаженням</strong>!","exp":"🇺🇦 Питання: назви 2 речі на накладній, які перевіряєш ДО того як починаєш розвантажувати. Ти ще не торкнувся товару — що перевіряєш на папері?","hint":"💡 Хто одержувач? Правильна адреса? Хто везе? Коли мала бути доставка?","ans":"1. Empfänger: Eltron GmbH, Luisenstraße 36, 90312 Nürnberg\n2. Lieferdatum: 28.04.2026\n(Weitere mögliche Angaben: Absender, Kennzeichen des Fahrzeugs, Bestellnummer)"},{"id":"1.2","pts":2,"text":"Під час розвантаження ви не виявляєте <strong>пошкоджень при транспортуванні</strong>. Підтвердіть водієві належну доставку. Заповніть накладну!","exp":"🇺🇦 Пошкоджень немає — що робиш з накладною щоб підтвердити водієві приймання? Де і що заповнюєш?","hint":"💡 Дивись на накладну — є рядки \"Datum:\" та \"Ware erhalten:\". Що туди вписати?","ans":"Datum: 28.04.2026\nWare erhalten: [Unterschrift]"},{"id":"1.3","pts":3,"text":"Назвіть <strong>3 дефекти</strong> Europaletten, через які ви <strong>не можете їх обміняти</strong>!","exp":"🇺🇦 Europaletten можна обмінювати тільки якщо вони справні та сертифіковані (EPAL). Назви 3 причини, через які палету відмовлять у тавші.","hint":"💡 Думай: що на палеті може бути зламано, відсутнє або пошкоджено? Дошки, кубики, маркування...","ans":"1. Gebrochene oder fehlende Bodenbretter\n2. Fehlende oder beschädigte Klötze\n3. Fehlendes oder unlesbares EPAL-Brandzeichen\n(Weitere: herausstehende Nägel, Fäulnis, gebrochene Seitenbretter)"},{"id":"1.4","pts":4,"text":"Поясніть наступні <strong>4 види дефектів (Mangelarten)</strong> на прикладі «Спортивні штани, довгі, сірі» (арт. № 240150, 1.500 шт.):<br>• Identität &nbsp;• Quantität &nbsp;• Qualität &nbsp;• Beschaffenheit","exp":"🇺🇦 При прийманні товару перевіряють 4 види відповідності. Для кожного дай конкретний приклад — що саме могло піти не так з цими штанями.","hint":"💡 Identität=не той товар; Quantität=не та кількість; Qualität=погане виконання; Beschaffenheit=не той матеріал/розмір.","ans":"Identität: Es wurde ein anderes Produkt geliefert (z.B. andere Farbe oder Modell statt Spo :#60a5fa\">Rücksendung an...</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Lagerzone:</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:9px 10px;color:#fff;outline:none;background:#0d1a30;min-height:20px\"></td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Sperrfläche:</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:9px 10px;color:#fff;outline:none;background:#0d1a30;min-height:20px\"></td>\n    </tr>\n  </table>\n</div>","exp":"🇺🇦 Заповни внутрішній транспортний документ. Всі дані вже відомі з попередніх питань та накладної.","hint":"💡 Menge=225 Stück (з 1.5). Lieferschein-Nr.=55016-20. Рух: Lagerzone C → QS → назад Lagerzone C, Sperrfläche S20.","ans":"<div style=\"background:#0a1020;border:2px solid #22c55e;border-radius:10px;padding:14px\">\n  <div style=\"text-align:center;font-weight:700;font-size:14px;color:#22c55e;margin-bottom:12px;letter-spacing:1px\">Interner Transportbeleg ✓</div>\n  <table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8;width:50%\">an Lagerzone:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700;width:50%\">C</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Artikelnummer:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">240150</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">an Abteilung:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">Qualitätssicherung</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Menge in Stück:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">225</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Anzahl Europaletten:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">laut Anlage</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Lieferschein-Nr.:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">55016-20</td>\n    </tr>\n    <tr>\n      <td colspan=\"2\" style=\"border:1px solid #2d3a5a;padding:8px 10px;background:#0d1829;font-weight:700;color:#60a5fa\">Rücksendung an...</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Lagerzone:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">C</td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:9px 10px;color:#94a3b8\">Sperrfläche:</td>\n      <td style=\"border:1px solid #22c55e;padding:9px 10px;color:#fff;font-weight:700\">S 20</td>\n    </tr>\n  </table>\n</div>"},{"id":"1.8","pts":1,"text":"QS виявляє: шви спортивних штанів <strong>дефектно прошиті</strong>. Товар непридатний для продажу.<br>Назвіть <strong>один</strong> спосіб Nacherfüllung (усунення недоліків), який Eltron GmbH може вимагати першочергово!","exp":"🇺🇦 Товар бракований. За законом (BGB) є право на Nacherfüllung. Яке право \"vorrangig\" (першочергово) — ремонт чи заміна?","hint":"💡 Nacherfüllung = або Nachbesserung (усунення дефекту) або Ersatzlieferung (нова партія). Яке логічніше при поганих швах?","ans":"Nachbesserung: Der Verkäufer bessert die mangelhaften Nähte nach.\n(gleichwertig: Ersatzlieferung)"},{"id":"1.9.1","pts":2,"text":"Спортивна куртка: виробник оголошує підвищення ціни. Пропозиція: 6.000 шт. зараз за старою ціною. Можлива економія: <strong>7.800,00 €</strong>.<br>Товар потрібно тимчасово зберігати на <strong>12 Europaletten протягом 6 місяців</strong>. Витрати на зберігання: <strong>20,00 € за палету за місяць</strong>.<br>Розрахуйте суму додаткових витрат на зберігання!","exp":"🇺🇦 Якщо купуємо зараз — треба зберігати. Скільки коштує зберігання 12 палет протягом 6 місяців по 20€ за палету за місяць?","hint":"💡 12 × 6 × 20 = ?","ans":"12 Europaletten × 6 Monate × 20,00 €/Europalette = 1.440,00 €"},{"id":"1.9.2","pts":2,"text":"Розрахуйте <strong>фактичну економію</strong> з урахуванням витрат на зберігання з 1.9.1!<br>(Можлива економія: 7.800,00 €)","exp":"🇺🇦 Можна зекономити 7.800€ на ціні, але треба заплатити 1.440€ за зберігання. Яка реальна економія?","hint":"💡 7.800 € − 1.440 € = ?","ans":"7.800,00 € − 1.440,00 € = 6.360,00 €"},{"id":"1.10.1","pts":3,"text":"Кольорові м'ячі для кидання пакуються в набори. Один набір складається з <strong>120 м'ячів</strong>. Їх потрібно змішати за кольором пропорційно до часток. Розрахуйте частки за кожним кольором у штуках і вкажіть хід розрахунку!\n<div style=\"margin-top:14px;background:#0a1020;border:2px solid #2d3a5a;border-radius:10px;padding:16px\">\n  <div style=\"text-align:center;font-weight:700;font-size:14px;color:#fff;margin-bottom:12px\">Набір м'ячів для кидання</div>\n  <table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n    <tr>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Частка</th>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Колір</th>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Штук</th>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center;font-weight:600\">5</td>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center\">Червоний</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:10px 12px;text-align:center;color:#fff;outline:none;background:#0d1a30;min-width:60px\"></td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center;font-weight:600\">4</td>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center\">Жовтий</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:10px 12px;text-align:center;color:#fff;outline:none;background:#0d1a30\"></td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center;font-weight:600\">3</td>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center\">Синій</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:10px 12px;text-align:center;color:#fff;outline:none;background:#0d1a30\"></td>\n    </tr>\n    <tr>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center;font-weight:600\">3</td>\n      <td style=\"border:1px solid #2d3a5a;padding:10px 12px;text-align:center\">Зелений</td>\n      <td contenteditable=\"true\" style=\"border:1px solid #4f7fff;padding:10px 12px;text-align:center;color:#fff;outline:none;background:#0d1a30\"></td>\n    </tr>\n  </table>\n</div>","exp":"🇺🇦 120 м'ячів ділимо пропорційно 5:4:3:3. Спочатку знаходимо суму всіх часток, потім ділимо 120 на цю суму і множимо на кожну частку.","hint":"💡 Сума: 5+4+3+3=15. Rot: 120÷15×5=? Gelb: 120÷15×4=? Blau=Grün=?","ans":"Summe der Anteile: 5 + 4 + 3 + 3 = 15\nRot:  120 : 15 × 5 = 40 Stück\nGelb: 120 : 15 × 4 = 32 Stück\nBlau: 120 : 15 × 3 = 24 Stück\nGrün: 120 : 15 × 3 = 24 Stück\nProbe: 40 + 32 + 24 + 24 = 120 Stück ✓"},{"id":"1.10.2","pts":1,"text":"Назвіть <strong>функцію складського господарства</strong>, яку Eltron GmbH виконує, комплектуючи набори!","exp":"🇺🇦 Склад не тільки зберігає — він ще й виконує різні функції. Яку функцію виконує склад, коли збирає м'ячі різних кольорів в один сет?","hint":"💡 Склад \"перетворює\" окремі товари в готові набори для клієнтів — це яка функція?","ans":"Sortimentsfunktion (Zusammenstellungsfunktion)"},{"id":"1.10.3","pts":2,"text":"Поясніть, як ви можете захистити <strong>нижній шар наборів</strong> від забруднення або пошкодження через Europalette!","exp":"🇺🇦 Sets лежать прямо на дерев'яній палеті — дерево може пошкодити або забруднити нижній шар. Як захистити?","hint":"💡 Що кладуть між палетою і товаром? Картон? Плівка? Полістирол?","ans":"Zwischen die Europalette und die unterste Lage der Sets eine Zwischenlage aus Karton (Wellpappe) oder Folie legen."}]},"a2":{"label":"Завдання 2 — Комісіонування (33 бали, ~45 хв)","sit":"<p>Як співробітник <strong>Eltron GmbH</strong> ви працюєте в різних зонах складу і відповідаєте за складські операції та комісіонування. Ви також відповідаєте за організацію й оптимізацію процесів, а також за забезпечення робочими і допоміжними засобами.</p>","qs":[{"id":"2.1.1","pts":2,"text":"Ви забираєте спортивні товари в коробках з <strong>Fachbodenregal</strong> (полицевого стелажа).<br>Поясніть цей вид підготовки товару (Bereitstellung)!","exp":"🇺🇦 Fachbodenregal — полочний стелаж. \"Bereitstellung\" = спосіб надання товару для комісіонування. Що відбувається — хто до кого рухається: людина до товару чи товар до людини?","hint":"💡 \"Statische Bereitstellung\" = товар стоїть нерухомо, комісіонер іде до нього. Це принцип \"Mann-zur-Ware\".","ans":"Statische Bereitstellung: Die Ware steht an einem festen Lagerplatz im Fachbodenregal. Der Kommissionierer bewegt sich zur Ware (Prinzip: Mann-zur-Ware) und entnimmt die Artikel selbst."},{"id":"2.1.2","pts":2,"text":"Поясніть <strong>одну перевагу</strong> статичної підготовки (statische Bereitstellung) порівняно з <strong>динамічною підготовкою (dynamische Bereitstellung)</strong>!","exp":"🇺🇦 Динамічна = товар сам їде до людини (конвеєр, карусель, автоматика). Статична = людина йде до товару. В чому перевага статичної (простішої) системи?","hint":"💡 Динамічна потребує дороге обладнання. Статична — ні. Що ще? Гнучкість, простота змін...","ans":"Geringere Investitionskosten: Es wird keine aufwendige technische Anlage (z.B. Förderanlage) benötigt."},{"id":"2.2.2","pts":3,"text":"Fachbodenregale: наразі 4 рівні, розширюються ще на <strong>4 рівні</strong> = 8 рівнів загалом.<br>Відстань від полиці до верхнього краю наступного рівня: <strong>40 см</strong>. Найнижчий рівень: <strong>10 см</strong> від підлоги.<br>Розрахуйте відстань від підлоги до верхньої частини найвищого рівня після розширення в метрах!","exp":"🇺🇦 Зараз 4 полки + ще 4 = 8 полок. Перша полка починається на 10 см від підлоги. Кожна полка займає 40 см висоти. Знайди висоту верхнього краю 8-ї полки.","hint":"💡 Формула: 10 cm (до першої) + 8 × 40 cm (8 полок по 40 см) = ? см → перевести в метри.","ans":"10 cm + 8 × 40 cm = 10 cm + 320 cm = 330 cm = 3,30 m"},{"id":"2.2.3","pts":3,"text":"У зв'язку з новою висотою комісіонування потрібно придбати нове обладнання для комісіонування. Вимоги: <strong>висота підйому щонайменше 3,00 м</strong> і <strong>2 особи в кабіні водія</strong>.\n<div style=\"margin-top:14px;background:#0a1020;border:2px solid #2d3a5a;border-radius:10px;padding:16px\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n    <tr>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff\">Обладнання для комісіонування</th>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Макс. осіб у кабіні водія</th>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Вантажопідйомність, кг</th>\n      <th style=\"border:1px solid #2d3a5a;padding:8px 12px;background:#162035;color:#4f7fff;text-align:center\">Висота підйому, см</th>\n    </tr>\n    <tr><td style=\"border:1px solid #2d3a5a;padding:8px 12px\">KG 200/R</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">2</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">1.200</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">250</td></tr>\n    <tr><td style=\"border:1px solid #2d3a5a;padding:8px 12px\">KommFlex CR</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">1</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">2.000</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">290</td></tr>\n    <tr><td style=\"border:1px solid #2d3a5a;padding:8px 12px\">Bulder 1308</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">2</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">1.800</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">300</td></tr>\n    <tr><td style=\"border:1px solid #2d3a5a;padding:8px 12px\">HubKo 500</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">1</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">1.500</td><td style=\"border:1px solid #2d3a5a;padding:8px 12px;text-align:center\">300</td></tr>\n  </table>\n</div>\nОберіть відповідне обладнання з таблиці і обґрунтуйте своє рішення!","exp":"🇺🇦 Два обов'язкові критерії: 2 особи у кабіні І висота підйому ≥ 300 см. Знайди в таблиці те що відповідає ОБОМ умовам.","hint":"💡 KG200/R: 2 особи ✓ але 250 см ✗. KommFlex: 290 см ✗. Bulder: 2 особи ✓ і 300 см ✓. HubKo: 1 особа ✗.","ans":"Bulder 1308\nBegründung: Das Gerät erfüllt beide Anforderungen:\n– 2 Personen im Fahrerstand ✓\n– Hubhöhe 300 cm (≥ 3,00 m) ✓"},{"id":"2.3","pts":2,"text":"Комісіонування за методом <strong>Pick-Pack-Verfahren</strong>.<br>Опишіть Pick-Pack-Verfahren!","exp":"🇺🇦 Pick-Pack — один із методів комісіонування. Поясни принцип: що відбувається при кожному \"pick\"? Чи є окремий крок пакування?","hint":"💡 Pick = взяти товар. Pack = одразу покласти в упаковку для відправки. Два кроки → один!","ans":"Beim Pick-Pack-Verfahren wird der Artikel beim Entnehmen (Picken) direkt in den Versandbehälter (Karton) gelegt und verpackt. Kommissionierung und Verpackung erfolgen in einem Arbeitsgang."},{"id":"2.4.1","pts":2,"text":"Повітряно-бульбашкова плівка керується за <strong>методом точки замовлення (Bestellpunktverfahren)</strong>.<br>Поясніть завдання рівня повторного замовлення (Meldebestand)!","exp":"🇺🇦 Meldebestand (сигнальний запас/рівень сигналу) — ключове поняття у Bestellpunktverfahren. Що це таке і яка його функція?","hint":"💡 Meldebestand = той рівень запасу, при досягненні якого автоматично запускається нове замовлення. Він враховує час доставки.","ans":"Der Meldebestand ist die Lagermenge, bei deren Unterschreitung eine neue Bestellung ausgelöst wird. Er stellt sicher, dass während der Lieferzeit kein Fehlbestand entsteht."},{"id":"2.4.2","pts":2,"text":"Розрахуйте <strong>Meldebestand</strong> (рівень повторного замовлення) в метрах для повітряно-бульбашкової плівки!<br>Денна витрата: <strong>100 м</strong> | Термін поставки: <strong>5 днів</strong> | Мінімальний запас: <strong>300 м</strong>","exp":"🇺🇦 Формула Meldebestand: (Tagesverbrauch × Lieferzeit) + Mindestbestand. Підставляй значення!","hint":"💡 100 × 5 + 300 = ?","ans":"Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand\n= 100 m × 5 Tage + 300 m\n= 500 m + 300 m\n= 800 m"},{"id":"2.5.1","pts":3,"text":"Замовлення Schmidt AG: <strong>70 позицій</strong>, вага <strong>79 кг</strong>, об'єм <strong>400 л</strong>.<br>Базовий час: 1,5 хв/позиція. Базовий + час на переміщення: 5 хв. Надбавка (61-80 кг, 351-500 л) з таблиці = <strong>25 хв</strong>.<br>Розрахуйте загальний час у хвилинах!","exp":"🇺🇦 Загальний час = (кількість позицій × час на позицію) + Basiszeit + Zuschlag з таблиці. Zuschlag береш з перетину рядка ваги та стовпця обʼєму.","hint":"💡 70 × 1,5 = 105 хв основний час. + 5 хв Basiszeit. + 25 хв Zuschlag (79 кг → рядок 61-80 кг, 400 л → стовпець 351-500 л).","ans":"Grundzeit:    70 Positionen × 1,5 Min =  105 Min\nBasiszeit:                               +    5 Min\nZuschlag (61–80 kg / 351–500 l):         +   25 Min\nGesamtzeit:                              = 135 Min"},{"id":"2.5.2","pts":2,"text":"Поясніть поняття <strong>Basiszeit</strong> (базовий час)!","exp":"🇺🇦 У комісіонуванні час ділиться на кілька типів. Що таке Basiszeit (базовий час)? Коли він виникає і що включає?","hint":"💡 Basiszeit = час на початку і в кінці кожного замовлення. Не під час збору позицій.","ans":"Die Basiszeit ist die Zeit, die am Anfang und am Ende eines Auftrags anfällt (z.B. Auftragsübernahme, Abgabe der Ware). Sie fällt einmalig je Auftrag an, unabhängig von der Anzahl der Positionen."},{"id":"2.5.3","pts":1,"text":"Наведіть <strong>один приклад</strong> діяльності, що належить до <strong>Totzeit</strong> (мертвого часу)!","exp":"🇺🇦 Totzeit (мертвий час) = час коли комісіонер нічого корисного не робить — не рухається, не збирає товар. Зазвичай це час очікування.","hint":"💡 Що може змусити комісіонера стояти і чекати?","ans":"Warten auf den Aufzug"},{"id":"2.6.1","pts":5,"text":"Зона складу G: клас небезпечних вантажів 2 (гази).<br><em>Правило: небезпечні речовини можуть бути підготовлені у зоні відвантаження, якщо завантаження відбувається протягом 24 годин після підготовки або наступного робочого дня. Якщо цей робочий день — субота, термін закінчується наприкінці наступного робочого дня.</em><br><table class=\"qt\"><tr><th>Клієнт</th><th>Закінчення комісіонування</th><th>Підготовка у відвантаженні</th><th>Забір експедитором</th></tr><tr><td>Meier GmbH</td><td>Ср, 14:00</td><td>Ср, 14:30</td><td>Пт, 07:00</td></tr><tr><td>Müller KG</td><td>Сб, 10:00</td><td>Сб, 11:00</td><td>Пн, 06:30</td></tr></table>Чи можна підготувати товар до відвантаження?","exp":"🇺🇦 Перевір для кожного клієнта — чи допустимо виставити товар у зону відвантаження? Є два критерії: або 24 години, або наступний робочий день (якщо Samstag — то до кінця наступного робочого дня).","hint":"💡 Meier: Bereitstellung Mi 14:30 + 24h = Do 14:30. Abholung Fr 07:00 — чи є Do 14:30 чи раніше? Müller: Bereitstellung Sa → наступний Werktag=Mo. Abholung Mo 06:30.","ans":"Meier GmbH: NEIN\nBereitstellung: Mittwoch 14:30 Uhr\nFrist: innerhalb 24 Stunden → bis Donnerstag 14:30 Uhr\nAbholung: Freitag 07:00 Uhr → Frist überschritten → nicht zulässig\n\nMüller KG: JA\nBereitstellung: Samstag 11:00 Uhr\nNächster Werktag nach Samstag = Montag\nAbholung: Montag 06:30 Uhr → innerhalb des nächsten Werktages → zulässig"},{"id":"2.7.1","pts":2,"text":"Щорічно потрібно купувати <strong>2.000 Europaletten</strong>. Закупівельна ціна: <strong>12,50 €/шт.</strong><br>Розрахуйте річні витрати на закупівлю!","exp":"🇺🇦 Простий розрахунок: 2000 штук помножити на ціну. Завжди показуй формулу!","hint":"💡 2.000 × 12,50 € = ?","ans":"2.000 Europaletten × 12,50 € = 25.000,00 €"},{"id":"2.7.2.1","pts":2,"text":"Розглядається варіант: замість Europaletten використовувати <strong>пластикові палети (120 × 80 см)</strong>.<br>Назвіть по <strong>одній перевазі й одному недоліку</strong>!","exp":"🇺🇦 Порівняй дерев'яні Europaletten і пластикові Kunststoffpaletten. Один плюс і один мінус пластику.","hint":"💡 Vorteil пластику: довговічніші, не гниють, можна мити, рівна поверхня. Nachteil: дорожчі, немає EPAL-тавш-системи.","ans":"Vorteil: Längere Lebensdauer, hygienischer (leicht zu reinigen), keine Fäulnis.\nNachteil: Höhere Anschaffungskosten; kein EPAL-Tauschsystem möglich."},{"id":"2.7.2.2","pts":2,"text":"Розрахуйте <strong>термін окупності</strong> для пластикових палет!<br>Одноразові загальні витрати: <strong>78.000,00 €</strong>. Річна економія порівняно з Europaletten: <strong>26.000,00 €/рік</strong>.","exp":"🇺🇦 Amortisation = за скільки років окупиться інвестиція? Формула: Investitionskosten ÷ jährliche Einsparung = Amortisationszeit.","hint":"💡 78.000 € ÷ 26.000 €/Jahr = ? Jahre","ans":"78.000,00 € : 26.000,00 €/Jahr = 3 Jahre"}]},"a3":{"label":"Завдання 3 — Охорона праці (7 балів, ~10 хв)","sit":"<p>У сфері автоматичної <strong>Fördertechnik</strong> (транспортувальної техніки) часто виникають небезпечні ситуації, тому що використовувані <strong>Europaletten спричиняють збої</strong>, а працівники складу заходять у зону, щоб усунути невеликі несправності. Однак у ці зони можуть заходити лише працівники служби усунення несправностей. Після нещасного випадку на виробництві створюється <strong>проєктна група для мінімізації ризиків нещасних випадків</strong>. Ви є членом цієї проєктної групи.</p>","qs":[{"id":"3.1","pts":2,"text":"Поясніть <strong>2 причини</strong> для обходу робочого місця після нещасного випадку!","exp":"🇺🇦 \"Begehung\" = офіційний огляд місця роботи після нещасного випадку. Для чого це потрібно? Назви 2 конкретні причини.","hint":"💡 Думай: що потрібно з'ясувати після нещасного випадку? Причини? Документація? Запобігання?","ans":"1. Ursachen des Unfalls feststellen, um zukünftige Unfälle zu verhindern.\n2. Gefährdungen am Arbeitsplatz erkennen und dokumentieren."},{"id":"3.2","pts":2,"text":"Назвіть <strong>2 особи</strong>, які мають брати участь в обході робочого місця після нещасного випадку!","exp":"🇺🇦 При офіційному огляді після нещасного випадку хто повинен бути присутній? Хто відповідає за безпеку на підприємстві?","hint":"💡 Думай: Arbeitgeber чи його представник, Sicherheitsbeauftragter, Betriebsarzt, Betriebsrat...","ans":"1. Sicherheitsbeauftragter\n2. Vorgesetzter / Arbeitgeber\n(weitere: Betriebsarzt, Betriebsrat)"},{"id":"3.3","pts":1,"text":"Назвіть зображений знак безпеки!<br><br>📛 <em>[Круглий знак заборони: чорна рука в забороняючому колі — «Торкатися заборонено» / «Не торкатися»]</em>","exp":"🇺🇦 На малюнку — кругле червоне знак-заборона з рукою всередині. Як називається цей знак безпеки офіційно?","hint":"💡 Червоний круг з перекресленням = Verbotszeichen (знак заборони). Рука = не чіпати.","ans":"Berühren verboten (Verbotszeichen)"},{"id":"3.4","pts":2,"text":"Назвіть <strong>2 можливі заходи</strong> для зменшення схильності автоматичної Fördertechnik до збоїв!","exp":"🇺🇦 Автоматична конвеєрна система часто виходить з ладу через палети. Які конкретні заходи можна вжити щоб зменшити кількість збоїв?","hint":"💡 Що викликає збої? Погані палети, неправильно укладений товар, брак обслуговування... Що можна покращити?","ans":"1. Regelmäßige Inspektion und Wartung der Fördertechnik\n2. Nur einwandfreie Europaletten einsetzen (Qualitätskontrolle vor dem Einsatz)"}]},"a4":{"label":"Завдання 4 — Відвантаження та транспортування (30 балів, ~50 хв)","sit":"<p>Ви відповідаєте у відділі відвантаження за <strong>планування маршрутів (Tourenplanung)</strong>, маркування вантажних одиниць, оформлення транспортних документів і <strong>завантаження</strong>. Для клієнта в <strong>Канаді</strong> потрібно упакувати 600 коробок і організувати транспортування з Нюрнберга до завантаження на морське судно в порту <strong>Роттердам</strong>. Для місцевих перевезень ви складаєте план маршруту для <strong>маршруту доставки 17</strong>. Маршрут починається і закінчується на Eltron GmbH у Нюрнберзі.</p>","qs":[{"id":"4.1.1","pts":2,"text":"Контейнер (40'): довжина 12,00 м, ширина 2,33 м, висота 2,35 м.<br>Коробки: довжина 75 см, ширина 40 см, висота 50 см. Вага брутто: 13,59 кг.<br>На коробках нанесено символ ↑↑ (дві стрілки вгору).<br><strong>Що потрібно врахувати при завантаженні через цей символ?</strong>","exp":"🇺🇦 Символ ↑↑ (дві стрілки вгору) на упаковці — що він означає? Що потрібно враховувати при завантаженні контейнера?","hint":"💡 Дві стрілки вгору = \"Diese Seite oben\" — ящик можна ставити тільки в одному напрямку.","ans":"Die Schachteln müssen aufrecht gestapelt werden (Pfeile zeigen nach oben = \"Diese Seite oben\"). Ein Kippen oder Seitwärtslegen ist nicht zulässig."},{"id":"4.1.2","pts":3,"text":"Розрахуйте <strong>кількість шарів</strong> коробок, які максимально можна завантажити в контейнер!<br>Внутрішня висота контейнера: 2,35 м | Висота коробки: 50 см","exp":"🇺🇦 Скільки шарів ящиків вмістить контейнер по висоті? Ділимо висоту контейнера на висоту ящика і заокруглюємо ВНИЗ (цілі шари).","hint":"💡 2,35 m = 235 cm ÷ 50 cm = ? Завжди заокруглюй вниз — неповний шар не рахується!","ans":"235 cm : 50 cm = 4,7 → 4 Lagen (abrunden)"},{"id":"4.1.3","pts":4,"text":"При повторній перевірці: висота коробки лише <strong>30 см</strong> → максимально можливо <strong>7 шарів</strong>.<br>Розрахуйте максимальну кількість коробок, які можна завантажити в контейнер!<br>Контейнер: Д 12,00 м, Ш 2,33 м | Коробка: Д 75 см, Ш 40 см","exp":"🇺🇦 Тепер висота 30 см → 7 шарів. Порахуй скільки ящиків вміщується в одному шарі (довжина × ширина) і помнож на кількість шарів.","hint":"💡 По довжині: 1200 cm ÷ 75 cm = ? По ширині: 233 cm ÷ 40 cm = ? Шари: 7. Загальна кількість = ? × ? × 7","ans":"Länge: 1.200 cm : 75 cm = 16 Schachteln\nBreite:    233 cm : 40 cm = 5,8 → 5 Schachteln\nPro Lage: 16 × 5 = 80 Schachteln\nGesamt: 80 × 7 Lagen = 560 Schachteln"},{"id":"4.1.4","pts":3,"text":"Вагу брутто відправлення потрібно вказати у <strong>фунтах (lb)</strong>.<br>Розрахуйте вагу відправлення у фунтах!<br>600 коробок × 13,59 кг/коробку | 1 фунт = 0,453 кг","exp":"🇺🇦 Два кроки: спочатку знайди загальну вагу в кг, потім перевади в фунти. Формула: кг ÷ 0,453 = фунти.","hint":"💡 Крок 1: 600 × 13,59 = ? кг. Крок 2: ? кг ÷ 0,453 = ? lb","ans":"600 Schachteln × 13,59 kg = 8.154,00 kg\n8.154,00 kg : 0,453 kg/lb = 18.000,00 lb"},{"id":"4.1.5","pts":2,"text":"Назвіть <strong>2 критерії</strong>, які ви перевіряєте під час <strong>Container-Check</strong> перед завантаженням!","exp":"🇺🇦 Перед тим як починати завантажувати контейнер — що потрібно перевірити? Яким має бути контейнер?","hint":"💡 Думай про безпеку та стан контейнера: дах, підлога, двері, запах, вологість, шкідники...","ans":"1. Unversehrtheit: Wände, Boden, Dach und Türen auf Beschädigungen prüfen.\n2. Sauberkeit und Trockenheit: kein Schmutz, keine Feuchtigkeit, kein Fremdgeruch."},{"id":"4.1.6.1","pts":2,"text":"Контейнер перевозять з Нюрнберга до порту Роттердам (696 км).<br>Поясніть, чому для цього перевезення обов'язковий <strong>CMR-Frachtbrief</strong> (накладна CMR)!","exp":"🇺🇦 CMR-Frachtbrief — міжнародна вантажна накладна для автомобільного транспорту. Чому вона потрібна для цього маршруту?","hint":"💡 Nürnberg (Німеччина) → Rotterdam (Нідерланди). Це якийсь особливий вид перевезення?","ans":"Der Transport verläuft grenzüberschreitend von Deutschland (Nürnberg) in die Niederlande (Rotterdam). Bei grenzüberschreitenden Straßengütertransporten ist der CMR-Frachtbrief gemäß CMR-Übereinkommen vorgeschrieben."},{"id":"4.1.6.2","pts":2,"text":"Розрахуйте час у дорозі: відстань <strong>696 км + 19 км</strong> подовження через затор. Середня швидкість: <strong>65 км/год</strong>.<br>Розрахуйте чистий час у дорозі в годинах!","exp":"🇺🇦 Формула: Zeit = Strecke ÷ Geschwindigkeit. Спочатку знайди загальну відстань, потім ділиш на швидкість.","hint":"💡 Gesamtstrecke: 696 + 19 = 715 km. Zeit: 715 ÷ 65 = ? Stunden","ans":"696 km + 19 km = 715 km\n715 km : 65 km/h = 11 Stunden"},{"id":"4.1.7","pts":2,"text":"Поясніть, що таке <strong>Incoterms</strong>, які використовуються у зовнішньоторговельних перевезеннях!","exp":"🇺🇦 Incoterms — що це таке? Для чого вони використовуються в міжнародній торгівлі?","hint":"💡 Incoterms = International Commercial Terms. Вони визначають хто несе відповідальність і витрати на якому етапі перевезення.","ans":"Incoterms (International Commercial Terms) sind international einheitliche Handelsklauseln, die regeln, wer die Transportkosten trägt, wann das Risiko übergeht und wer Versicherung sowie Zollabwicklung organisiert."},{"id":"4.1.8","pts":2,"text":"Погоджений Incoterm: <strong>CIF Halifax</strong> (Incoterms® 2020).<br>Вкажіть, що означає «CIF Halifax»!","exp":"🇺🇦 CIF = один з Incoterms. Що означає кожна літера? І що означає \"Halifax\" в цьому контексті?","hint":"💡 C=Cost, I=Insurance, F=Freight. Halifax = місто призначення (порт).","ans":"CIF = Cost, Insurance, Freight\nHalifax = Bestimmungshafen\nDer Verkäufer trägt Kosten und Risiko (einschließlich Versicherung) bis zur Ankunft im Hafen Halifax."},{"id":"4.2.1","pts":3,"text":"Маршрут 17 (новий): Müller GmbH → Lauf (20 км), Moritz & Winter OHG → Amberg (49 км), Sellbacher KG → Neumarkt (42 км).<br>Далі: Erwin Sommer e.K. постачається ПЕРЕД Windröder GmbH.<br>Складіть повний план маршруту за допомогою таблиці відстаней (з додатка)!","exp":"🇺🇦 Потрібно скласти повний маршрут Tour 17 з усіма зупинками по порядку і вказати відстані між ними. Перші 3 зупинки вже дані. Додай Erwin Sommer e.K. та Windröder GmbH.","hint":"💡 Маршрут: Nürnberg → Lauf → Amberg → Neumarkt → Erwin Sommer → Windröder → Nürnberg. Відстані з Anlage (таблиця відстаней).","ans":"1. Müller GmbH, Lauf (20 km)\n2. Moritz & Winter OHG, Amberg (49 km)\n3. Sellbacher KG, Neumarkt (42 km)\n4. Erwin Sommer e.K. (laut Entfernungstabelle)\n5. Windröder GmbH (laut Entfernungstabelle)\n6. Rückfahrt Nürnberg"},{"id":"4.2.2","pts":3,"text":"Europalette: вага брутто 650 кг. Підлога вантажівки: дерево, суха, чиста.<br>Опишіть, як <strong>сила маси (сила інерції)</strong> впливає на вантаж під час гальмування!","exp":"🇺🇦 Що відбувається з вантажем при різкому гальмуванні вантажівки? Яка фізична сила діє і в якому напрямку?","hint":"💡 При гальмуванні вантажівка уповільнюється, але вантаж \"хоче\" продовжувати рухатись вперед — це інерція (Trägheit).","ans":"Beim Bremsvorgang wirkt die Trägheitskraft auf das Ladegut in Fahrtrichtung nach vorne. Das Ladegut versucht, seine Bewegung beizubehalten, und schiebt sich in Richtung Fahrerhaus. Es besteht die Gefahr des Verrutschens oder Kippens."},{"id":"4.2.3","pts":2,"text":"Поясніть поняття <strong>сили тертя (Reibungskraft)</strong> у контексті кріплення вантажу!","exp":"🇺🇦 Reibungskraft (сила тертя) — ключове поняття в закріпленні вантажу. Що це таке і як вона допомагає утримати вантаж?","hint":"💡 Тертя виникає між двома поверхнями. Чим більше тертя між палетою і підлогою кузова — тим важче вантажу зсунутися.","ans":"Die Reibungskraft ist die Kraft, die zwischen zwei Oberflächen entsteht und einer Bewegung entgegenwirkt. Sie hält das Ladegut auf der Ladefläche in Position. Je höher der Reibungskoeffizient (μ), desto größer die Haltekraft."},{"id":"4.2.4","pts":2,"text":"Визначте найнижчий <strong>коефіцієнт ковзного тертя (μ)</strong> для Europalette на вантажівці!<br>Підлога вантажівки: дерево, суха, чиста.<br><table class=\"qt\"><tr><th>Пара матеріалів</th><th>сухо</th><th>мокро</th><th>жирно</th></tr><tr><td>Дерево/дерево</td><td>0,20 – 0,50</td><td>0,20 – 0,25</td><td>0,05 – 0,15</td></tr><tr><td>Метал/дерево</td><td>0,20 – 0,50</td><td>0,20 – 0,25</td><td>0,02 – 0,10</td></tr><tr><td>Метал/метал</td><td>0,10 – 0,25</td><td>0,10 – 0,20</td><td>0,01 – 0,10</td></tr><tr><td>Бетон/дерево</td><td>0,30 – 0,60</td><td>0,30 – 0,50</td><td>0,10 – 0,20</td></tr></table>","exp":"🇺🇦 Europalette = Holz. Lkw-Boden = Holz. Умова: trocken und sauber. Знайди правильний рядок і стовпець у таблиці. Для розрахунку береш НАЙМЕНШЕ значення з діапазону.","hint":"💡 Materialpaarung = Holz/Holz. Zustand = trocken. З таблиці: 0,20 – 0,50 → найменше = ?","ans":"Materialpaarung: Holz / Holz, trocken\nNiedrigster Gleitreibbeiwert: μ = 0,20"},{"id":"4.2.5","pts":3,"text":"Після комплектації: вага брутто <strong>700 кг</strong>. Найнижчий коефіцієнт ковзного тертя μ = 0,20.<br>Розрахуйте силу тертя в <strong>дека-ньютонах (daN)</strong>!<br>Формула: F_R = μ × F_G | F_G = m × g | g = 10 м/с² | 1 daN = 10 N","exp":"🇺🇦 Розрахунок сили тертя. Спочатку знайди силу тяжіння (Gewichtskraft) в Ньютонах, потім помножи на коефіцієнт тертя, потім перевади в daN.","hint":"💡 F_G = 700 kg × 10 m/s² = 7.000 N. F_R = 0,20 × 7.000 N = ? N → ? daN","ans":"F_G = 700 kg × 10 m/s² = 7.000 N\nF_R = 0,20 × 7.000 N = 1.400 N\n1.400 N : 10 = 140 daN"},{"id":"4.3","pts":2,"text":"Для кріплення вантажу використовуються <strong>Zurrgurte</strong> (кріпильні ремені).<br>Назвіть <strong>2 критерії</strong>, які ви перевіряєте перед використанням Zurrgurte!","exp":"🇺🇦 Zurrgurte (стяжні ремені) — засіб кріплення вантажу. Перед використанням потрібно перевірити їх стан. Що саме перевіряють?","hint":"💡ремені можуть бути пошкоджені, застарілі або занадто слабкі. Що конкретно перевіряєш?","ans":"1. Zustand: keine Risse, Scheuerstellen oder Beschädigungen am Gurt\n2. LC-Wert (Lashing Capacity): ausreichende Zurrkraft für das Ladegut"}]},"a5":{"label":"Завдання 3 — Раціональний та якісний вантажообіг (36 завдань, 90 хв, тестові)","isMC":true,"sit":"<p>Це завдання складається з <strong>36 окремих завдань</strong> у форматі тестових питань, зіставлення та впорядкування. У тестових питаннях ви обираєте ОДНУ правильну відповідь. У завданнях на зіставлення ви розподіляєте терміни по категоріях. У завданнях на впорядкування ви розставляєте кроки у правильному порядку.</p>","qs":[{"id":"MC-1","pts":3,"type":"mc","text":"У виробничому потоці матеріалів розрізняють неперервні (stetige) та переривчасті (unstetige) транспортні засоби. Розподіліть:<br><br><strong>Hebebühne</strong> — <strong>Kettenförderer</strong> — <strong>Rollenbahn</strong> — <strong>Lastenaufzug</strong> — <strong>Regalbediengerät</strong>","options":["1. Неперервні транспортні засоби (stetige Fördermittel)","2. Переривчасті транспортні засоби (unstetige Fördermittel)"],"correctMulti":{"Hebebühne":"2","Kettenförderer":"1","Rollenbahn":"1","Lastenaufzug":"2","Regalbediengerät":"1"},"exp":"🇺🇦 Stetige Fördermittel = безперервний рух (конвеєр, стрічка). Unstetige = окремі цикли підйому/опускання (ліфт, підйомник).","hint":"💡 Kettenförderer, Rollenbahn, Regalbediengerät рухаються безперервно. Hebebühne і Lastenaufzug роблять окремі підйоми.","ans":"Hebebühne → 2 (unstetig)\nKettenförderer → 1 (stetig)\nRollenbahn → 1 (stetig)\nLastenaufzug → 2 (unstetig)\nRegalbediengerät → 1 (stetig)"},{"id":"MC-2","pts":3,"type":"mc","text":"На складі одиниць зберігання потрібно виміряти висоту складських одиниць (від 50 см до 1,80 м). Який вимірювальний інструмент підходить (максимально компактний)?","options":["1. Лінійка","2. Лазерний далекомір","3. Штангенциркуль","4. Складана рулетка (Zollstock)","5. Ультразвуковий далекомір"],"correct":"4","exp":"🇺🇦 Потрібен компактний інструмент для висот до 1,80 м, який можна носити з собою.","hint":"💡 Lineal закороткий. Messschieber для дрібних деталей. Лазер/ультразвук завеликі і дорогі для цього. Що складається і легко носити?","ans":"4. Gliedermaßstab/Zollstock"},{"id":"MC-3","pts":3,"type":"open","text":"На коробках ви бачите позначення довжини <strong>25 дюймів (Inch)</strong>. Розрахуйте довжину в сантиметрах! (1 дюйм = 2,54 см)","exp":"🇺🇦 Просте переведення одиниць — дюйми в сантиметри.","hint":"💡 25 × 2,54 = ?","ans":"25 × 2,54 cm = 63,50 cm"},{"id":"MC-4","pts":3,"type":"mc","text":"Які технічні вимоги ставляться до конвеєрної стрічки (для комісіонування коробок) з екологічної та економічної точки зору?","options":["1. Конвеєрна стрічка працює постійно, крім випадків натискання аварійної кнопки.","2. При холостому ході стрічка вимикається і може бути увімкнена лише після повного перезапуску установки.","3. При холостому ході стрічка автоматично вимикається і вмикається знову лише за потреби транспортування.","4. Вимкнення стрічки відбувається автоматично за фіксованим тактом.","5. Стрічку можна вмикати лише тоді, коли немає доступного unstetiger Förderer (переривчастого транспортного засобу)."],"correct":"3","exp":"🇺🇦 З економічної та екологічної точки зору — конвеєр не повинен працювати марно (Leerlauf = холостий хід). Який варіант економить енергію без втрати функціональності?","hint":"💡 Автоматичне вимкнення при простої та автоматичне ввімкнення при появі роботи — найекономічніше та найзручніше рішення.","ans":"3. Bei Leerlauf des Förderbands schaltet sich dieses automatisch ab und schaltet sich erst bei erneutem Förderbedarf ein."},{"id":"MC-5","pts":3,"type":"mc","text":"Під час роботи конвеєрних стрічок ви чуєте скрипучі звуки з двигуна. Як правильно діяти?","options":["1. Ви негайно вимикаєте стрічку і повідомляєте техніка.","2. Ви не вимикаєте стрічку, але негайно повідомляєте техніка.","3. Ви вимикаєте стрічку і одразу вмикаєте знову, щоб звук не було чутно.","4. Ви вимикаєте стрічку і негайно самі ремонтуєте двигун.","5. Ви не вимикаєте стрічку, а просто наносите мастило на двигун."],"correct":"1","exp":"🇺🇦 Дивний шум у моторі = можлива поломка, небезпека. Правильна реакція працівника без технічної кваліфікації?","hint":"💡 Безпека перш за все: зупинити техніку + покликати фахівця. Самому ремонтувати не можна (немає кваліфікації)!","ans":"1. Sie schalten das Förderband sofort ab und informieren einen Techniker."},{"id":"MC-6","pts":3,"type":"mc","text":"Через нову лінію комісіонування замовлення потрібно комплектувати одночасно на різних поверхах і в різних цехах, а потім об'єднувати в зоні відвантаження. Назвіть цей метод комісіонування!","options":["1. Auftragsorientierte, serielle Kommissionierung (орієнтована на замовлення, послідовна)","2. Serienorientierte, parallele Kommissionierung (орієнтована на серію, паралельна)","3. Auftragsorientierte, manuelle Kommissionierung (орієнтована на замовлення, ручна)","4. Auftragsorientierte, parallele Kommissionierung (орієнтована на замовлення, паралельна)","5. Auftragsorientierte, zentrale Kommissionierung (орієнтована на замовлення, централізована)"],"correct":"4","exp":"🇺🇦 Одне замовлення (Auftrag) комплектується ОДНОЧАСНО (gleichzeitig) в різних місцях — це паралельна обробка одного замовлення.","hint":"💡 \"gleichzeitig in verschiedenen Hallen\" = паралельно (parallel), і це стосується одного Auftrags (замовлення-орієнтована).","ans":"4. Auftragsorientierte, parallele Kommissionierung"},{"id":"MC-7","pts":3,"type":"mc","text":"На автоматичній лінії пакування використовуються двошарові (2-wellige) складні коробки. Що розуміють під двошаровим пакувальним матеріалом?","options":["1. Двошаровий пакувальний матеріал утворюється склеюванням пластику та гофрокартону в одну пакувальну одиницю.","2. Двошаровий пакувальний матеріал — це з'єднання пластику та гофрокартону на Europalette.","3. Двошаровий пакувальний матеріал означає максимум дворазове штабелювання на Europalette.","4. Двошаровий пакувальний матеріал означає подвійне навантаження об'єму в см³ на кожну картонну упаковку.","5. Двошаровий пакувальний матеріал утворюється склеюванням 3 гладких і 2 гофрованих шарів картону."],"correct":"5","exp":"🇺🇦 \"2-wellig\" стосується структури самого картону (скільки шарів гофри), а не упаковки чи палети.","hint":"💡 Структура картону: glatte Pappe (гладкий) + wellige Pappe (гофрований). 2-wellig = 2 шари гофри між гладкими шарами.","ans":"5. 2-welliges Verpackungsmaterial wird durch das Verkleben von 3 glatten und 2 welligen Pappen erreicht."},{"id":"MC-8","pts":3,"type":"mc","text":"Eltron GmbH постачає роздрібним торговцям жіночий одяг. Коробки мають вагу брутто 8-18 кг. Для відправлення потрібно визначити вагу брутто кожної коробки. Яку вагу ви обираєте?","options":["1. Настільні ваги (0 кг до 15 кг)","2. Настільні ваги (5 кг до 30 кг)","3. Палетні ваги (20 кг до 250 кг)","4. Платформні ваги (10 кг до 50 кг)","5. Палетні ваги (15 кг до 400 кг)"],"correct":"2","exp":"🇺🇦 Вага коробок: 8-18 кг. Потрібні ваги, що ПОВНІСТЮ покривають цей діапазон і не завеликі для звичайних коробок (не палетна вага).","hint":"💡 Палетні ваги для важких вантажів на палетах. Для коробок 8-18 кг потрібна Tischwaage з підходящим діапазоном.","ans":"2. Tischwaage (Wiegebereich: 5 kg bis 30 kg)"},{"id":"MC-9","pts":5,"type":"open","text":"Пакувальну станцію потрібно чистити щомісяця та обслуговувати раз на півроку. Розрахуйте загальний робочий час на чищення і обслуговування за наступні 6 місяців у годинах!<br><br><table class=\"qt\"><tr><th></th><th>Час чищення</th><th>Інтервал</th><th>Час обслуговування</th><th>Інтервал</th></tr><tr><td>Umreifer 1</td><td>10 хв</td><td>щомісяця</td><td>15 хв</td><td>раз на півроку</td></tr><tr><td>Umreifer 2</td><td>10 хв</td><td>щомісяця</td><td>15 хв</td><td>раз на півроку</td></tr><tr><td>Rollenbahnen</td><td>30 хв</td><td>щомісяця</td><td>30 хв</td><td>раз на півроку</td></tr></table>","exp":"🇺🇦 За 6 місяців: Reinigung (monatlich) відбувається 6 разів, Wartung (halbjährlich) відбувається 1 раз. Підсумуй всі хвилини окремо для кожної машини, потім за 6 місяців.","hint":"💡 Reinigung за місяць: 10+10+30=50 Min × 6 Monate = ? Wartung (1 раз за 6 міс): 15+15+30 = ? Сума всього в хвилинах → переведи в години.","ans":"Reinigung pro Monat: 10+10+30 = 50 Min × 6 Monate = 300 Min\nWartung (halbjährlich, 1×): 15+15+30 = 60 Min\nGesamt: 300 + 60 = 360 Min : 60 = 6 Stunden"},{"id":"MC-10","pts":5,"type":"mc","text":"На Umreifungsautomat (автомат обв'язки) закінчилась стрічка обв'язки. Розставте дії у правильній послідовності:<br><br><strong>Strom einschalten</strong> — <strong>Test durchführen, ob der Automat wieder korrekt gurtet</strong> — <strong>Neue Rolle einlegen</strong> — <strong>Anlage stromlos schalten</strong> — <strong>Leere Rolle entfernen</strong>","options":["1","2","3","4","5"],"correctMulti":{"Anlage stromlos schalten":"1","Leere Rolle entfernen":"2","Neue Rolle einlegen":"3","Strom einschalten":"4","Test durchführen, ob der Automat wieder korrekt gurtet":"5"},"exp":"🇺🇦 Безпека перш за все: спочатку вимкнути живлення, потім фізична заміна, потім ввімкнути і перевірити.","hint":"💡 Логічний порядок: вимкнути струм → прибрати стару рулону → вставити нову → ввімкнути струм → протестувати.","ans":"1. Anlage stromlos schalten\n2. Leere Rolle entfernen\n3. Neue Rolle einlegen\n4. Strom einschalten\n5. Test durchführen, ob der Automat wieder korrekt gurtet"},{"id":"MC-11","pts":3,"type":"mc","text":"Через господарську діяльність Eltron GmbH також завдається шкода навколишньому середовищу. Назвіть захід, який може зменшити цю шкоду!","options":["1. Як службові автомобілі купуються лише дизельні транспортні засоби.","2. Виконується більше замовлень з меншим обсягом кожне.","3. Оптимізоване за маршрутом планування турів (Tourenplanung) для зменшення витрати палива.","4. Збільшується закупівля електроенергії з викопних джерел.","5. Вантажні одиниці більше не обв'язуються стрічкою, а тришарово обмотуються плівкою."],"correct":"3","exp":"🇺🇦 Лише один варіант реально зменшує екологічне навантаження — всі інші або нейтральні, або шкідливі.","hint":"💡 Diesel, fossile Energie, більше плівки — все погіршує екологію. Що реально економить паливо?","ans":"3. Wegeoptimierte Tourenplanung, um die Treibstoffmenge zu reduzieren"},{"id":"MC-12","pts":3,"type":"mc","text":"Ви пояснюєте новому співробітнику, чому підприємства згідно з Gewerbeabfallverordnung (постановою про промислові відходи) повинні роздільно збирати та утилізувати відходи. Яке обґрунтування ви обираєте?","options":["1. Так досягається, що всі відходи потрапляють на правильний полігон.","2. Так уникають утворення відходів на підприємстві.","3. Так зменшується обсяг переробки.","4. Так уможливлюється матеріальна та енергетична переробка відходів.","5. Так зменшується кількість відходів."],"correct":"4","exp":"🇺🇦 Gewerbeabfallverordnung вимагає роздільний збір сміття саме для того, щоб ЦЕ сміття можна було переробити (Verwertung).","hint":"💡 Мета роздільного збору — не зменшення кількості сміття, а можливість його ПЕРЕРОБИТИ.","ans":"4. So soll eine stoffliche und energetische Verwertung der Abfälle ermöglicht werden."},{"id":"MC-13","pts":4,"type":"open","text":"Складського запасу «Federbein Y31A» при денній витраті 180 шт. вистачає на 25 днів. Розрахуйте, на скільки днів вистачить запасу, якщо денна витрата зросте на 25%!","exp":"🇺🇦 Спочатку знайди загальний запас (Vorrat), потім новий денний розхід (+25%), потім скільки днів вистачить нового розходу.","hint":"💡 Vorrat = 180 × 25 = ? Stück. Neuer Verbrauch = 180 × 1,25 = ? Stück/Tag. Neue Tage = Vorrat / neuer Verbrauch.","ans":"Vorrat: 180 Stück × 25 Tage = 4.500 Stück\nNeuer Verbrauch: 180 × 1,25 = 225 Stück/Tag\nNeue Reichweite: 4.500 : 225 = 20 Tage"},{"id":"MC-14","pts":3,"type":"mc","text":"Складовані товари піддаються певним умовам зберігання. Вкажіть, що розуміють під умовами зберігання!","options":["1. Термін придатності, вид матеріалу, вентиляція","2. Кількість, частота вилучення, температура","3. Температура, вентиляція, вологість","4. Об'єм, вологість, вартість","5. Вага, об'єм, температура"],"correct":"3","exp":"🇺🇦 Lagerbedingungen — це фізичні умови зберігання в приміщенні складу (клімат), а не властивості самого товару чи логістичні показники.","hint":"💡 Шукай варіант де всі три параметри — це УМОВИ ПРИМІЩЕННЯ (клімат), а не характеристики товару.","ans":"3. Temperatur, Belüftung, Feuchtigkeit"},{"id":"MC-15","pts":3,"type":"mc","text":"На складі щодня утворюється 25 т картону, який пресується в тюки. Картон потрібно повернути у вторинний обіг сировини. Який захід підходить?","options":["1. Утилізація через дозволений полігон","2. Передача загальнонаціональному сертифікованому підприємству з переробки","3. Спалювання тюків картону","4. Утилізація через органічні відходи","5. Передача до змішаних відходів"],"correct":"2","exp":"🇺🇦 \"In den Wertstoffkreislauf zurückführen\" = переробка, а не утилізація. Лише один варіант означає переробку.","hint":"💡 Deponie, verbrennen, Bio-Müll, Restmüll — все це НЕ переробка. Що залишається?","ans":"2. Abgabe an bundesweit zugelassenen Recycling-Betrieb"},{"id":"MC-16","pts":4,"type":"open","text":"Щодня утворюється 25 т картону, пресується в тюки по 200 кг. За таблицею визначте, скільки повних тюків максимально можна завантажити на транспортний засіб з найбільшою загальною вантажною площею!<br><br><table class=\"qt\"><tr><th>Транспортний засіб</th><th>Вантажна площа, м²</th><th>Об'єм, м³</th><th>Вантажопідйомність, кг</th></tr><tr><td>№1 3-осьовий напівпричіп</td><td>33,45</td><td>85,31</td><td>24.000</td></tr><tr><td>№2 Автофургон</td><td>14,64</td><td>36,60</td><td>9.000</td></tr><tr><td>№3 Автофургон/причіп</td><td>17,08+19,52</td><td>42,70+48,80</td><td>9.000+16.000</td></tr><tr><td>№4 Mega-Trailer</td><td>33,73</td><td>101,18</td><td>24.000</td></tr><tr><td>№5 Jumbo-автопоїзд</td><td>19,00</td><td>57,00</td><td>6.000</td></tr></table>","exp":"🇺🇦 Спочатку знайди транспорт з найбільшою ЗАГАЛЬНОЮ площею завантаження (Ladefläche), потім врахуй обмеження по вантажопідйомності (Nutzlast).","hint":"💡 Найбільша Ladefläche = Nr.4 Mega-Trailer (33,73 m²). Але перевір чи не обмежує Nutzlast: 24.000 kg ÷ 200 kg = скільки балів?","ans":"Größte Gesamtladefläche: Nr. 4 Mega-Trailer (33,73 m²)\nNutzlast-Grenze: 24.000 kg : 200 kg/Ballen = 120 Ballen\n(Ladefläche/Volumen reichen aus → Nutzlast ist die Grenze)\nAntwort: 120 Ballen"},{"id":"MC-17","pts":3,"type":"mc","text":"Одержувач вимагає транспортний документ для перевезення тюків картону вантажівкою. Який це документ?","options":["1. CIM-Frachtbrief","2. TIR-Carnet","3. Air Waybill","4. Паспорт безпеки (Sicherheitsdatenblatt)","5. CMR-Frachtbrief"],"correct":"5","exp":"🇺🇦 CIM = залізниця. TIR = міжнародні авто перевезення поза ЄС (карнет, не основний документ). Air Waybill = авіа. Який документ для звичайного автоперевезення?","hint":"💡 Стандартний документ для перевезення вантажу вантажівкою (LKW) в Європі.","ans":"5. CMR-Frachtbrief"},{"id":"MC-18","pts":3,"type":"mc","text":"Логістичні дії: планування, виконання, контроль. Розподіліть:<br><br><strong>Lieferschein mit Ware vergleichen</strong> — <strong>Lagerstruktur festlegen</strong> — <strong>Güter einlagern</strong>","options":["1. Планування","2. Виконання","3. Контроль"],"correctMulti":{"Lieferschein mit Ware vergleichen":"3","Lagerstruktur festlegen":"1","Güter einlagern":"2"},"exp":"🇺🇦 Planung = заздалегідь продумати. Durchführung = виконати дію. Kontrolle = перевірити результат.","hint":"💡 Порівняння накладної з товаром — це перевірка. Структура складу — заздалегідь спланована. Einlagern — фізична дія.","ans":"Lieferschein mit Ware vergleichen → 3 (Kontrolle)\nLagerstruktur festlegen → 1 (Planung)\nGüter einlagern → 2 (Durchführung)"},{"id":"MC-19","pts":3,"type":"mc","text":"Під час щорічної інвентаризації часто виявляються розбіжності запасів. Який захід зменшує розбіжності інвентаризації?","options":["1. Скорочення кількості клієнтів","2. Комісіонування на Europaletten","3. Маркування готових вантажних одиниць","4. Навчання співробітників","5. Скорочення кількості артикулів на клієнта"],"correct":"4","exp":"🇺🇦 Inventurdifferenzen виникають через помилки людей (неправильний підрахунок, переплутані артикули). Що найкраще зменшує людські помилки?","hint":"💡 Думай: причина різниць — людський фактор. Що допомагає зменшити помилки персоналу?","ans":"4. Schulung der Mitarbeiter"},{"id":"MC-20","pts":3,"type":"mc","text":"ABC-аналіз: 10% кількості = 60% вартості товару, 40% кількості = 30% вартості товару, 50% кількості = 10% вартості товару. Яка діаграма (1-5) правильно відображає ці значення?","options":["1","2","3","4","5"],"correct":"1","exp":"🇺🇦 Класична Lorenzkurve ABC-аналізу: А-товари (мало штук, багато вартості) спочатку круто йдуть вгору, потім крива стає пологішою для B і C.","hint":"💡 Кумулятивно: 10% Menge → 60% Wert; 10+40=50% Menge → 60+30=90% Wert; 50+50=100% Menge → 90+10=100% Wert. Шукай графік з точками (10,60), (50,90), (100,100).","ans":"Diagramm 1 — zeigt die typische ABC-Lorenzkurve mit den Punkten (10%/60%), (50%/90%), (100%/100%)"},{"id":"MC-21","pts":3,"type":"mc","text":"Товари не вилучалися зі складу вже 8 місяців. Вони більше не виробляються і замінені новими розробками. Керівництво вирішує утилізувати товари. Про що йдеться?","options":["1. Про очищення асортименту (Sortimentsbereinigung)","2. Про перевірку асортименту (Sortimentsüberprüfung)","3. Про вибір асортименту (Sortimentsauswahl)","4. Про аналіз асортименту (Sortimentsanalyse)","5. Про розширення асортименту (Sortimentserweiterung)"],"correct":"1","exp":"🇺🇦 Видалення застарілих, непотрібних товарів з асортименту — як це називається?","hint":"💡 \"Bereinigung\" = очищення/прибирання. Товари прибирають з асортименту.","ans":"1. Um eine Sortimentsbereinigung"},{"id":"MC-22","pts":4,"type":"open","text":"Meldebestand (рівень повторного замовлення) = 600 шт., мінімальний запас = 180 шт. Сьогодні (29.04.2026) на початок роботи: 340 шт. у складській комірці. Щодня вилучається 60 шт. Сьогодні додатково вилучено 40 шт.<br><br>Визначте дату (ДД.ММ.РРРР), коли мінімальний запас буде досягнуто на кінець робочого дня!","exp":"🇺🇦 Складна задача з датами! Спочатку врахуй сьогоднішнє додаткове вилучення 40 шт, потім рахуй скільки днів треба щоб дійти до 180 шт при щоденному споживанні 60 шт.","hint":"💡 Сьогодні кінець дня: 340 - 40 (додаткове) - 60 (звичайне) = 240 Stück. Потім: (240-180)/60 = скільки ще днів?","ans":"Bestand heute Arbeitsende: 340 - 40 - 60 = 240 Stück\nNoch zu verbrauchen bis Mindestbestand: 240 - 180 = 60 Stück\nTage bis dahin: 60 : 60 = 1 Tag\nDatum: 30.04.2026"},{"id":"MC-23","pts":3,"type":"mc","text":"Вам потрібно розмістити на складі отриманий токсичний товар. Який склад підходить?","options":["1. Verschlusslager (закритий/замкнений склад)","2. Холодильний склад","3. Відкритий склад","4. Склад небезпечних речовин (Gefahrstofflager)","5. Склад дрібних деталей"],"correct":"4","exp":"🇺🇦 Отруйні (giftige) речовини — це Gefahrstoff (небезпечна речовина). Яке сховище призначене саме для цього?","hint":"💡 Думай напряму: для небезпечних речовин існує спеціальне сховище з відповідною назвою.","ans":"4. Gefahrstofflager"},{"id":"MC-24","pts":3,"type":"mc","text":"Які товари особливо підходять для зберігання в блоковому складі (Blocklager, підлогове зберігання)?","options":["1. Товари, у яких минув термін придатності (MHD)","2. Товари, що зберігаються за принципом Lifo","3. Товари, які переміщуються лише невеликими партіями","4. Товари, що зберігаються за принципом Fifo","5. Товари з високим ризиком крадіжки"],"correct":"2","exp":"🇺🇦 Blocklager = штабелювання рядами одне на одному. Через структуру штабелів неможливо легко дістати товар знизу — тому підходить тільки для певного принципу обігу.","hint":"💡 У штабелі (Block) можна брати тільки зверху — це означає останній покладений йде першим. Який принцип це?","ans":"2. Güter, die nach dem Lifo-Prinzip gelagert werden"},{"id":"MC-25","pts":3,"type":"mc","text":"Місце зберігання 04 06 02 B. План складу: цифри 1-2 = зона складу, 3-4 = стелаж, 5-6 = поле, 7 = полиця (A=нижня, B=середня, C=верхня). Куди ви розміщуєте товар?","options":["1. Зона складу 4, стелаж 2, поле 6, верхня полиця","2. Зона складу 1, стелаж 6, поле 3, середня полиця","3. Зона складу 4, стелаж 6, поле 2, нижня полиця","4. Зона складу 4, стелаж 6, поле 2, середня полиця","5. Зона складу 2, стелаж 4, поле 6, верхня полиця"],"correct":"4","exp":"🇺🇦 Розбери код по групах цифр: 04 | 06 | 02 | B. Перші дві цифри = зона, наступні дві = регал, наступні дві = поле, остання літера = полиця.","hint":"💡 04=Lagerzone, 06=Regal, 02=Feld, B=mittleres Fach. Зіставляй з варіантами.","ans":"4. Lagerzone 4, Regal 6, Feld 2, mittleres Fach"},{"id":"MC-26","pts":3,"type":"mc","text":"Eltron GmbH планує децентралізований склад поблизу локації клієнта для надійного постачання матеріалів. Яке твердження правильне?","options":["1. Кількість необхідних Flurförderzeuge (навантажувачів) зменшується.","2. Потрібно менше персоналу.","3. Терміни доставки клієнту скорочуються.","4. Менше артикулів доставляється.","5. Витрати на зберігання зменшуються."],"correct":"3","exp":"🇺🇦 Dezentrales Lager = склад ближче до клієнта. Яка головна перевага близькості до клієнта?","hint":"💡 Менша відстань = менший час доставки. Логічний прямий наслідок.","ans":"3. Die Lieferzeiten zum Kunden verringern sich."},{"id":"MC-27","pts":3,"type":"mc","text":"Eltron GmbH поділена на відділи (організаційна структура). Розподіліть:<br><br><strong>Zusammenbau von Maschinenteilen</strong> — <strong>Einkauf von Maschinenkomponenten</strong> — <strong>Darstellung des Unternehmens auf der Website</strong> — <strong>Ein- und Auslagerung von Maschinenteilen</strong> — <strong>Weiterentwicklung von Maschinensystemen</strong>","options":["1. Логістика","2. Монтаж","3. Дослідження та розробка","4. Постачання","5. Маркетинг"],"correctMulti":{"Zusammenbau von Maschinenteilen":"2","Einkauf von Maschinenkomponenten":"4","Darstellung des Unternehmens auf der Website":"5","Ein- und Auslagerung von Maschinenteilen":"1","Weiterentwicklung von Maschinensystemen":"3"},"exp":"🇺🇦 Кожна дія належить конкретному відділу підприємства. Логічно зіставляй дію з назвою відділу.","hint":"💡 Zusammenbau=складання=Montage. Einkauf=закупівля=Beschaffung. Website=Marketing. Ein-/Auslagerung=Logistik. Weiterentwicklung=Forschung.","ans":"Zusammenbau → 2 (Montage)\nEinkauf → 4 (Beschaffung)\nWebsite → 5 (Marketing)\nEin-/Auslagerung → 1 (Logistik)\nWeiterentwicklung → 3 (Forschung und Entwicklung)"},{"id":"MC-28","pts":3,"type":"mc","text":"Керівник складу хоче зрозуміло описати логістичні процеси для кожного співробітника. Який тип документа підходить?","options":["1. Інструкція з постачання (Lieferanweisung)","2. Виробнича угода (Betriebsvereinbarung)","3. Тарифна угода (Tarifvereinbarung)","4. Клієнтська інструкція (Kundenanweisung)","5. Робоча інструкція (Arbeitsanweisung)"],"correct":"5","exp":"🇺🇦 Документ, що описує КОНКРЕТНИЙ робочий процес для співробітників — як це називається?","hint":"💡 \"Arbeit\" = робота. Документ описує як виконувати роботу.","ans":"5. Arbeitsanweisung, um die Prozesse darzustellen und zu beschreiben"},{"id":"MC-29","pts":3,"type":"mc","text":"Eltron GmbH планує роботів для комісіонування. Потік інформації має бути повністю автоматизований. Який варіант ви обираєте?","options":["1. Співробітник вводить дані замовлення в систему керування складом, яка передає їх роботу безпаперово.","2. Співробітник отримує дані замовлення у вигляді штрих-коду і вводить їх сканером.","3. Співробітник забирає дані замовлення і вводить їх з клавіатури.","4. Співробітник викликає дані замовлення і вводить їх голосом.","5. Співробітник отримує дані замовлення чер
