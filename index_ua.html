<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHK Exam Trainer 2026 — UA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0b0d13;--s1:#13161f;--s2:#1a1e2b;--s3:#222639;--border:#252a3a;--acc:#4f7fff;--gold:#f5c842;--green:#22c55e;--red:#ef4444;--purple:#a78bfa;--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.65;min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-size:15px;font-weight:700;color:#fff}.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-txt{font-size:12px;color:var(--dim);white-space:nowrap}
.prog-bar{width:120px;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}

/* TABS */
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stats-bar{display:flex;gap:0;background:#0d0f17;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:10px 14px;gap:10px}
.stats-bar::-webkit-scrollbar{display:none}
.stat-chip{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:8px 13px;min-width:128px;flex-shrink:0}
.stat-chip .sc-title{font-size:10px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.stat-chip .sc-main{font-size:15px;font-weight:700;color:#fff}
.stat-chip .sc-sub{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.5}
.stat-chip.active{border-color:var(--acc);background:#11192e}

/* EXAM LAUNCH BOX */
.exam-launch-box{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#2a0a0a,#1a0505);border:1px solid #7f1d1d;border-radius:12px;padding:14px 18px;margin-bottom:18px;flex-wrap:wrap}
.exam-launch-box .elb-title{font-size:14px;font-weight:700;color:#fca5a5}
.exam-launch-box .elb-sub{font-size:11px;color:#9ca3af;margin-top:2px}

/* EXAM MODE OVERLAY */
#examOverlay{position:fixed;inset:0;background:var(--bg);z-index:5000;display:none;flex-direction:column}
#examOverlay.show{display:flex}
.exam-hdr{background:linear-gradient(135deg,#1a0505,#2a0a0a);border-bottom:2px solid #dc2626;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.exam-hdr-title{font-size:14px;font-weight:700;color:#fff}
.exam-timer{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:#fca5a5;background:#1a0505;border:1px solid #7f1d1d;border-radius:8px;padding:6px 14px}
.exam-timer.warn{color:var(--gold);border-color:var(--gold);animation:examPulse 1s infinite}
.exam-timer.danger{color:#fca5a5;border-color:#dc2626;animation:examPulse .5s infinite}
@keyframes examPulse{0%,100%{opacity:1}50%{opacity:.5}}
.exam-progress{font-size:12px;color:var(--muted)}
.exam-body{flex:1;overflow-y:auto;padding:20px 16px 100px;max-width:760px;margin:0 auto;width:100%}
.exam-q-num{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.exam-q-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:0}
.exam-q-text{font-size:15px;color:#fff;line-height:1.7;margin-bottom:18px}
.exam-opt{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:13px 16px;margin-bottom:9px;color:var(--text);font-size:14px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.exam-opt:hover{border-color:var(--acc)}
.exam-opt.selected{border-color:var(--acc);background:#1a2d4f;color:#93c5fd;font-weight:600}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0f17;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;justify-content:center;align-items:center}
.exam-nav button{padding:11px 22px;border-radius:9px;font-weight:600;font-size:14px;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.exam-btn-prev{background:var(--s2);color:var(--text)}
.exam-btn-next{background:var(--acc);color:#fff}
.exam-btn-finish{background:#dc2626;color:#fff}
.exam-dots{display:flex;flex-wrap:wrap;gap:5px;padding:14px 16px;max-width:760px;margin:0 auto}
.exam-dot{width:26px;height:26px;border-radius:6px;background:var(--s2);border:1px solid var(--border);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-family:'JetBrains Mono',monospace}
.exam-dot.answered{background:#1a3a2a;border-color:var(--green);color:var(--green)}
.exam-dot.current{border-color:var(--acc);border-width:2px;color:#fff}

/* EXAM RESULT SCREEN */
.exam-result{max-width:480px;margin:40px auto;text-align:center;padding:0 16px}
.exam-result-badge{font-size:64px;margin-bottom:10px}
.exam-result-title{font-size:24px;font-weight:700;margin-bottom:8px}
.exam-result-title.pass{color:var(--green)}
.exam-result-title.fail{color:#fca5a5}
.exam-result-score{font-size:46px;font-weight:800;color:#fff;margin:18px 0 4px}
.exam-result-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.exam-result-bar{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin-bottom:24px}
.exam-result-fill{height:100%;border-radius:5px}
.exam-result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.exam-result-stat{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:12px}
.exam-result-stat .ers-num{font-size:20px;font-weight:700;color:#fff}
.exam-result-stat .ers-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-family:'Inter',sans-serif}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
#subTabs{background:#0d0f17;padding-left:8px}
.nav-group{background:var(--s1);border-bottom:1px solid var(--border)}
.nav-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:6px 14px 0;font-weight:600}
.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-size:13px;font-weight:700;color:#fff}
#subTabs .tab{font-size:12px;padding:8px 14px;color:#7c8aa5}
#subTabs .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.on){color:var(--text)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 160px)}
.sidebar{width:210px;min-width:210px;background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
.content{flex:1;overflow-y:auto;padding:22px 24px 60px}
.vocab-side{width:230px;min-width:230px;background:var(--s1);border-left:1px solid var(--border);overflow-y:auto}

/* SIDEBAR ITEMS */
.sb-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:6px;cursor:pointer;margin:1px 4px;transition:background .15s}
.sb-item:hover{background:var(--s2)}
.sb-item.act{background:#1a2d4f}
.sb-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc);font-weight:700;min-width:30px}
.sb-name{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:115px}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;margin-left:auto}
.sb-item.done .sb-dot{background:var(--green)}
.sb-pts{font-size:10px;color:var(--muted);margin-left:2px;flex-shrink:0}

/* SITUATION */
.sit-box{background:#0d1829;border:1px solid #1d3a60;border-radius:12px;padding:18px 20px;margin-bottom:22px}
.sit-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.sit-box p{color:#94a3b8;font-size:13px;line-height:1.75}
.sit-box table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.sit-box th{background:#162035;color:var(--acc);padding:7px 10px;text-align:left;font-size:11px;font-weight:600}
.sit-box td{padding:6px 10px;border-bottom:1px solid #1a2535;color:var(--dim)}
.sit-box tr:last-child td{border:none}

/* QUESTION CARD */
.qcard{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:border-color .2s}
.qcard:hover{border-color:var(--s3)}
.qcard-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.qbadge{background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;font-family:'JetBrains Mono',monospace;white-space:nowrap;flex-shrink:0}
.qpts{background:var(--s2);color:var(--gold);font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.qtext{font-size:13.5px;color:var(--text);line-height:1.75;flex:1}
.qtext strong{color:#fff}

/* BTNS */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s}
.btn-exp{background:#152238;color:#60a5fa;border:1px solid #1e3a5f}.btn-exp:hover{background:#1a2f4f}
.btn-hint{background:#1e1500;color:var(--gold);border:1px solid #2d2000}.btn-hint:hover{background:#2a1e00}
.btn-check{background:var(--acc);color:#fff}.btn-check:hover{background:#3a6bef}
.btn-clr{background:var(--s2);color:var(--muted);border:1px solid var(--border)}.btn-clr:hover{color:var(--red)}

/* BOXES */
.exp-box{background:#0c1e38;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:12px 15px;margin:8px 0;font-size:13px;color:#93c5fd;display:none;line-height:1.7}
.hint-box{background:#1a1200;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 15px;margin:8px 0;font-size:13px;color:#fcd34d;display:none;line-height:1.7}
.exp-box.on,.hint-box.on{display:block}

/* TEXTAREA */
.ans-area{margin-top:8px}
.ans-area textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:11px 13px;resize:vertical;min-height:80px;outline:none;transition:border-color .2s}
.ans-area textarea:focus{border-color:var(--acc)}

/* AI RESULT */
.ai-res{margin-top:10px;padding:14px 16px;border-radius:9px;font-size:13px;display:none;line-height:1.7}
.ai-res.on{display:block}
.ai-res.ok{background:#0a2015;border:1px solid #166534;color:#86efac}
.ai-res.bad{background:#200a0a;border:1px solid #991b1b;color:#fca5a5}
.ai-res.part{background:#1a1300;border:1px solid #854d0e;color:#fde68a}
.ai-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;opacity:.8}
.ai-loading{color:var(--muted);font-size:13px;padding:8px 0;display:none}
.ai-loading.on{display:block}

/* VOCAB SIDE */
.vs-hdr{padding:14px 15px;border-bottom:1px solid var(--border)}
.vs-hdr h3{font-size:13px;font-weight:700;color:var(--text)}
.vs-hdr p{font-size:11px;color:var(--muted);margin-top:2px}
.vs-body{padding:8px}
.vs-item{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.vs-word{color:var(--gold);font-weight:600;font-size:12px;word-break:break-all}
.vs-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0;line-height:1;flex-shrink:0}
.vs-del:hover{color:var(--red)}
.vs-empty{padding:20px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}

/* TABLES in questions */
.qt{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.qt th{background:var(--s2);color:var(--acc);padding:7px 10px;text-align:left;font-size:11px;border-bottom:1px solid var(--border)}
.qt td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--dim)}
.qt tr:last-child td{border:none}
.qtext table, .sit-box table{max-width:100%;overflow-x:auto;display:block}
.ai-res table{max-width:100%;overflow-x:auto;display:block}
.ans-table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.ans-table td,.ans-table th{padding:6px 10px;border:1px solid #2d3a5a;color:#e2e8f0}
.ans-table th{background:#162035;color:var(--acc);font-size:11px}
.ai-res pre,.correct-pre{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:13px;line-height:1.7}
[contenteditable]:focus{border-color:#22c55e !important;background:#071510 !important}
[contenteditable]:empty:before{content:attr(placeholder);color:#374151;font-style:italic}
.mc-options{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mc-opt{text-align:left;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.wtok{cursor:pointer;border-radius:3px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wtok-lp{border-radius:3px;-webkit-user-select:none;user-select:none}
.wtok-lp:active{background:rgba(245,196,66,.35)}
.wtok:active,.wtok:hover{background:rgba(245,196,66,.25)}
.mc-opt:hover{border-color:var(--acc);background:#162035}
.mc-opt.selected{border-color:var(--acc);background:#1a2d4f;color:#93c5fd;font-weight:600}
.zuord-wrap{margin:10px 0}
.zuord-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.zuord-term{font-weight:600;color:#fff;font-size:13px;min-width:140px;flex-shrink:0}
.zuord-opts{display:flex;gap:6px;flex-wrap:wrap}
.zuord-btn{background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.zuord-btn:hover{border-color:var(--acc)}
.zuord-btn.selected{background:#1a2d4f;border-color:var(--acc);color:#93c5fd;font-weight:600}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;font-weight:700;font-size:13px;padding:8px 22px;border-radius:20px;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.on{opacity:1}

/* VOCAB PAGE */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.vocab-card{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* HIGHLIGHT selectable */
.selectable{cursor:text}

@media(max-width:900px){.sidebar{display:none}.vocab-side{display:none}.layout{height:auto}.content{padding:14px}}

/* ===== VOICE TRAINER ===== */
.vt-wrap{max-width:600px;margin:0 auto;padding:20px 16px 100px}
.vt-day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.vt-day-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.vt-day-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.vt-day-btn.done{border-color:var(--green);color:var(--green)}
.vt-progress{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.vt-prog-bar{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.vt-prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.vt-prog-txt{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.vt-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;transition:border-color .3s}
.vt-card.correct{border-color:var(--green)}
.vt-card.wrong{border-color:var(--red)}
.vt-card-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.vt-qid{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:8px}
.vt-qtext{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:16px}
.vt-pts{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:16px}
.vt-mic-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.vt-mic-btn.recording{background:#dc2626;animation:vtPulse 1s infinite}
.vt-mic-btn:disabled{opacity:.5;cursor:not-allowed}
@keyframes vtPulse{0%,100%{opacity:1}50%{opacity:.7}}
.vt-transcript{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;font-size:13px;color:var(--dim);min-height:40px;line-height:1.6;font-style:italic}
.vt-transcript.active{border-color:var(--acc);color:var(--text)}
.vt-ai-result{margin-top:12px;padding:14px;border-radius:10px;font-size:13px;line-height:1.7}
.vt-ai-result.correct{background:#0a1a10;border:1px solid var(--green);color:#86efac}
.vt-ai-result.wrong{background:#1a0808;border:1px solid var(--red);color:#fca5a5}
.vt-ai-result.loading{background:var(--s2);border:1px solid var(--border);color:var(--muted)}
.vt-answer-box{background:#091708;border:1px solid #1a4a2a;border-radius:10px;padding:14px;margin-top:10px;font-size:13px;color:#86efac;white-space:pre-wrap;line-height:1.75;display:none}
.vt-answer-box.show{display:block}
.vt-btns{display:flex;gap:8px;margin-top:12px}
.vt-btn{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none}
.vt-btn-ans{background:#0d1829;border:2px solid var(--acc);color:#93c5fd}
.vt-btn-no{background:#1a0808;border:2px solid var(--red);color:var(--red)}
.vt-btn-ok{background:#0a1a10;border:2px solid var(--green);color:var(--green)}
.vt-dots{display:flex;gap:5px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.vt-dot{width:26px;height:26px;border-radius:6px;background:var(--s2);border:1px solid var(--border);font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.vt-dot.cur{border-color:var(--acc);color:#fff;background:#11192e;border-width:2px}
.vt-dot.ok{background:#0a1a10;border-color:var(--green);color:var(--green)}
.vt-dot.no{background:#1a0808;border-color:var(--red);color:var(--red)}
.vt-done{text-align:center;padding:40px 20px}
.vt-done-emoji{font-size:64px;margin-bottom:12px}
.vt-done-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}
.vt-done-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.vt-score-chips{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.vt-chip{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:12px 18px;text-align:center;min-width:80px}

<body>

  <div class="hdr-title">📦 IHK Trainer — Sommer 2026</div>
  <div class="prog-wrap">

<div class="nav-block">

      <button class="nav-btn" onclick="goTab('a3',this)">🦺 Охорона праці</button>
      <button class="nav-btn" onclick="goTab('a4',this)">🚚 Відвантаження</button>

      <button class="nav-btn" id="nb_voice" onclick="goGroup('voice',this)">🎤 Голосовий тренажер</button>

<div class="layout">

  <div class="exam-nav" id="examNav"></div>

<script src="/data.ua.js"></script>
<script>
// псевдонім: код сторінки працює з DATA, дані лежать у спільному файлі
const DATA = DATA_UA;
const KEY_DONE = 'ihk26_done';
const KEY_VOC = 'ihk26_vocab';

let done = new Set(JSON.parse(localStorage.getItem(KEY_DONE)||'[]'));
let vocab = JSON.parse(localStorage.getItem(KEY_VOC)||'[]');
let curTab = 'a1';

const saveDone = () => localStorage.setItem(KEY_DONE, JSON.stringify([...done]));
const saveVoc = () => localStorage.setItem(KEY_VOC, JSON.stringify(vocab));

// ====== DATA ======

// ===== RENDER =====
function goGroup(group, btn){
  // Скидаємо всі nav-btn
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));

  const subSection = document.getElementById('subSection');

  if(group === 'lagerlogistik'){
    document.getElementById('nb_lager').classList.add('on');
    if(subSection) subSection.style.display = '';
    // Активуємо першу підвкладку
    const firstSub = document.querySelector('#subTabs .nav-btn');
    if(firstSub){
      document.querySelectorAll('#subTabs .nav-btn').forEach(b=>b.classList.remove('on'));
      firstSub.classList.add('on');
    }
    goTab('a1', null);

  } else if(group === 'guterumschlag'){
    document.getElementById('nb_guter').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('a5', null);

  } else if(group === 'wiso'){
    document.getElementById('nb_wiso').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('a6', null);

  } else if(group === 'voice'){
    document.getElementById('nb_voice').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    renderVoiceTrainer();
    return;

  } else if(group === 'vocab'){
    document.getElementById('nb_vocab').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('vocab', null);
  }
}

function goTab(tab, btn){
  curTab=tab;
  if(btn){
    document.querySelectorAll('#subTabs .nav-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
  if(tab==='vocab'){ renderVocabPage(); return; }
  renderAufgabe(DATA[tab]);
  updateProgress();
}

function renderAufgabe(auf){
  renderSidebar(auf);
  const el=document.getElementById('content');
  const examBtn = (curTab==='a5' || curTab==='a6')
    ? `<div class="exam-launch-box">
        <div class="elb-text">
          <div class="elb-title">🎯 Режим реального екзамену</div>
          <div class="elb-sub">Таймер · без підказок · без пояснень · результат в кінці</div>
        </div>
        <button class="btn" style="background:#dc2626;color:#fff;font-weight:700;white-space:nowrap" onclick="startExamMode('${curTab}')">▶ Почати екзамен</button>
      </div>`
    : '';
  el.innerHTML=`<div class="sit-box"><div class="sit-lbl">📋 Situation — ${auf.label}</div>${auf.sit}</div>`
    + examBtn
    +auf.qs.map(q=>renderCard(q)).join('');
  el.scrollTop=0;
  setTimeout(function(){ makeWordsClickable(el); makeOptionWordsTranslatable(el); }, 100);
}


function renderSidebar(auf){
  const el=document.getElementById('sidebar');
  el.innerHTML=`<div class="sb-label">${auf.label.split('—')[0].trim()}</div>`
    +auf.qs.map(q=>`
    <div class="sb-item ${done.has(q.id)?'done':''}" onclick="scrollQ('qc_${q.id.replace(/\./g,'_')}')">
      <span class="sb-num">${q.id}</span>
      <span class="sb-name">${q.text.replace(/<[^>]+>/g,'').substring(0,28)}…</span>
      <span class="sb-dot"></span>
      <span class="sb-pts">${q.pts}P</span>
    </div>`).join('');
}

function renderCard(q){
  const id=q.id.replace(/\./g,'_');
  const isMC = q.type === 'mc';
  const isMultiselect = q.type === 'multiselect';
  const isZuordnung = !!q.correctMulti;

  let answerInput;
  if(isZuordnung){
    const terms = Object.keys(q.correctMulti);
    answerInput = `<div class="zuord-wrap" id="zwrap_${id}">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">👉 Обери категорію для кожного терміна:</div>
      ${terms.map((term,ti)=>`
        <div class="zuord-row">
          <div class="zuord-term">${term}</div>
          <div class="zuord-opts" data-term="${term}">
            ${q.options.map(opt=>{
              const val = opt.split('.')[0].trim();
              return `<button type="button" class="zuord-btn" data-val="${val}" onclick="selectZuord('${id}','${term.replace(/'/g,"\'")}','${val}',this)">${opt}</button>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  } else if(isMultiselect){
    answerInput = `<div class="mc-options" id="mswrap_${id}">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">👉 Обери ВСІ правильні варіанти (можна кілька):</div>
      ${q.options.map((opt,i)=>`<button type="button" class="mc-opt" data-val="${opt.split('.')[0].trim()}" onclick="toggleMultiselect('${id}', this)">${opt}</button>`).join('')}
    </div>`;
  } else if(isMC){
    answerInput = `<div class="mc-options" id="mcwrap_${id}">
      ${q.options.map((opt,i)=>`<button type="button" class="mc-opt" data-val="${opt.split('.')[0].trim()}" onclick="selectMC('${id}', this)">${opt}</button>`).join('')}
    </div>`;
  } else {
    answerInput = `<div class="ans-area"><textarea id="ta_${id}" placeholder="Schreibe hier deine Antwort... / Пиши тут..."></textarea></div>`;
  }

  return `<div class="qcard" id="qc_${id}">
    <div class="qcard-top">
      <div>
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <span class="qbadge">${q.id}</span>
          <span class="qpts">⭐ ${q.pts} бал${q.pts>1?'ів':''}</span>
          ${isZuordnung ? '<span class="qpts" style="color:#a78bfa">🔗 Зіставлення</span>' : (isMultiselect ? '<span class="qpts" style="color:#a78bfa">☑️ Множинний вибір</span>' : (isMC ? '<span class="qpts" style="color:#a78bfa">🔘 Тестове питання</span>' : ''))}
        </div>
        <div class="qtext selectable">${q.text}</div>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-exp" onclick="tog('eb_${id}')">💡 Пояснення</button>
      <button class="btn btn-hint" onclick="tog('hb_${id}')">🔍 Підказка</button>
    </div>
    <div class="exp-box" id="eb_${id}">${q.exp}</div>
    <div class="hint-box" id="hb_${id}">${q.hint}</div>
    ${answerInput}
    <div class="btns" style="margin-top:8px">
      <button class="btn btn-check" onclick="check('${q.id}','${id}',${q.pts})">🤖 AI перевіряє</button>
      <button class="btn" style="background:#1a0d2e;color:#a78bfa;border:1px solid #2d1a4a" onclick="showAnswer('${id}','${q.id}')">📖 Правильна відповідь</button>
      <button class="btn btn-clr" onclick="clearQ('${id}')">✕ Очистити</button>
    </div>
    <div class="ai-res" id="correct_${id}" style="display:none;background:#0f0f2e;border:1px solid #3730a3;color:#c4b5fd"></div>
    <div class="ai-loading" id="ld_${id}">⏳ AI аналізує...</div>
    <div class="ai-res" id="ar_${id}"></div>
  </div>`;
}

function selectMC(id, btn){
  const wrap = document.getElementById('mcwrap_'+id);
  wrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  wrap.dataset.selected = btn.dataset.val;
}

function selectZuord(id, term, val, btn){
  const row = btn.closest('.zuord-opts');
  row.querySelectorAll('.zuord-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  row.dataset.selectedVal = val;
}

function toggleMultiselect(id, btn){
  btn.classList.toggle('selected');
}

function tog(id){document.getElementById(id).classList.toggle('on')}

function showAnswer(id, qid){
  const el = document.getElementById('correct_'+id);
  if(el.style.display === 'block'){
    el.style.display = 'none';
    return;
  }
  // знаходимо питання
  let q = null;
  for(const key of Object.keys(DATA)){
    if(DATA[key].qs){
      const found = DATA[key].qs.find(x=>x.id===qid);
      if(found){ q=found; break; }
    }
  }
  if(!q) return;
  const ansHtml = q.ans.includes('<table') ? q.ans : q.ans.replace(/\n/g,'<br>'); el.innerHTML = '<div class="ai-lbl">📖 Правильна відповідь</div>' + ansHtml;
  el.style.display = 'block';
}
function scrollQ(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function clearQ(id){
  const ta = document.getElementById('ta_'+id);
  if(ta) ta.value='';
  const mcWrap = document.getElementById('mcwrap_'+id);
  if(mcWrap){
    mcWrap.dataset.selected = '';
    mcWrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  }
  const msWrap = document.getElementById('mswrap_'+id);
  if(msWrap){
    msWrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  }
  const zWrap = document.getElementById('zwrap_'+id);
  if(zWrap){
    zWrap.querySelectorAll('.zuord-opts').forEach(o=>{ o.dataset.selectedVal=''; });
    zWrap.querySelectorAll('.zuord-btn').forEach(b=>b.classList.remove('selected'));
  }
  const ar=document.getElementById('ar_'+id);
  ar.className='ai-res';ar.innerHTML='';
  const correctBox = document.getElementById('correct_'+id);
  if(correctBox){ correctBox.style.display='none'; }
}

async function check(qid,id,pts){
  const aufgabe=DATA[curTab];
  const q=aufgabe.qs.find(x=>x.id===qid);
  const zWrap = document.getElementById('zwrap_'+id);
  const msWrap = document.getElementById('mswrap_'+id);
  const mcWrap = document.getElementById('mcwrap_'+id);
  const ld=document.getElementById('ld_'+id);
  const ar=document.getElementById('ar_'+id);

  // ===== 1) Zuordnung — локальна перевірка, без AI =====
  if(zWrap && q.correctMulti){
    const rows = [];
    let allCorrect = true;
    zWrap.querySelectorAll('.zuord-opts').forEach(o=>{
      const term = o.dataset.term;
      const val = o.dataset.selectedVal || '';
      const correct = q.correctMulti[term];
      const ok = val === correct;
      if(!ok) allCorrect = false;
      rows.push(`${ok?'✅':'❌'} ${term} → ти: ${val||'(не обрано)'}${ok?'':` · правильно: ${correct}`}`);
    });
    ar.className = 'ai-res on '+(allCorrect?'ok':'bad');
    ar.innerHTML = `<div class="ai-lbl">${allCorrect?'✅ Правильно':'❌ Є помилки'}</div>${rows.join('<br>')}`;
    if(allCorrect){done.add(qid);saveDone();renderSidebar(DATA[curTab]);updateProgress();}
    return;
  }

  // ===== 2) Одиночний вибір (mc) з відомою правильною відповіддю — локально =====
  if(mcWrap && q.correct){
    const selected = mcWrap.dataset.selected || '';
    if(!selected){alert('Вибери відповідь!');return;}
    const ok = selected === q.correct;
    const correctOpt = (q.options||[]).find(o=>o.split('.')[0].trim()===q.correct) || q.correct;
    ar.className = 'ai-res on '+(ok?'ok':'bad');
    ar.innerHTML = `<div class="ai-lbl">${ok?'✅ Правильно':'❌ Неправильно'}</div>`
      + (ok?'':`Правильна відповідь: <strong>${correctOpt}</strong><br>`)
      + (q.exp?`<div style="margin-top:6px;color:var(--muted)">${q.exp}</div>`:'');
    if(ok){done.add(qid);saveDone();renderSidebar(DATA[curTab]);updateProgress();}
    return;
  }

  // ===== 3) Multiselect — локально, якщо вдається розпарсити правильні варіанти з q.ans =====
  if(msWrap){
    const selected = Array.from(msWrap.querySelectorAll('.mc-opt.selected')).map(b=>b.dataset.val).sort();
    if(!selected.length){alert('Вибери хоча б один варіант!');return;}
    const parsedCorrect = (q.ans||'').split('\n').map(l=>{
      const m = l.trim().match(/^(\d+)\./);
      return m ? m[1] : null;
    }).filter(Boolean).sort();
    if(parsedCorrect.length){
      const ok = selected.length===parsedCorrect.length && selected.every((v,i)=>v===parsedCorrect[i]);
      ar.className = 'ai-res on '+(ok?'ok':'bad');
      ar.innerHTML = `<div class="ai-lbl">${ok?'✅ Правильно':'❌ Неправильно'}</div>`
        + (ok?'':`Правильні варіанти: <strong>${parsedCorrect.join(', ')}</strong><br>`)
        + (q.exp?`<div style="margin-top:6px;color:var(--muted)">${q.exp}</div>`:'');
      if(ok){done.add(qid);saveDone();renderSidebar(DATA[curTab]);updateProgress();}
      return;
    }
    // якщо з ans не вдалось розпарсити правильні варіанти — падаємо в AI-режим нижче
  }

  // ===== 4) Відкрита відповідь (textarea/таблиця) — тут і лише тут AI =====
  let userAns = '';
  if(msWrap){
    const selected = Array.from(msWrap.querySelectorAll('.mc-opt.selected')).map(b=>b.dataset.val);
    userAns = selected.length ? selected.join(', ') : '';
  } else {
    const taEl = document.getElementById('ta_'+id);
    if(taEl) userAns = taEl.value.trim();
  }
  const qcard = document.getElementById('qc_'+id);
  if(qcard){
    const editCells = qcard.querySelectorAll('[contenteditable]');
    if(editCells.length > 0){
      const tableAns = [];
      qcard.querySelectorAll('tr').forEach(row => {
        const label = row.querySelector('td:not([contenteditable])');
        const val = row.querySelector('[contenteditable]');
        if(label && val && val.textContent.trim()){
          tableAns.push(label.textContent.trim() + ' ' + val.textContent.trim());
        }
      });
      if(tableAns.length > 0) userAns = tableAns.join('\n') + (userAns ? '\n' + userAns : '');
    }
  }
  if(!userAns){alert('Вибери відповідь або заповни поле!');return;}
  ld.classList.add('on'); ar.className='ai-res';
  const prompt=`Du bist ein strenger aber fairer IHK-Prüfer für Fachkraft für Lagerlogistik.

Dies ist eine OFFENE Prüfungsfrage (freie Textantwort), KEINE Multiple-Choice-Frage.

Frage ${qid} (${pts} Punkte): ${q.text.replace(/<[^>]+>/g,'')}
Musterlösung: ${q.ans}
Antwort des Prüflings: ${userAns}

Antworte auf Ukrainisch kurz und klar:
1. Beginne mit ✅ Richtig / ⚠️ Teilweise richtig / ❌ Falsch
2. Was war gut (1-2 Sätze)
3. Was fehlt oder ist falsch (1-2 Sätze)
4. Zeige die korrekte Musterantwort auf Deutsch (IHK-Stil, knapp)`;
  try{
    const r=await fetch('/api/gemini',
      {method:'POST',headers:{'Content-Type':'application/json','x-api-key':window.ANTHROPIC_KEY||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
       body:JSON.stringify({prompt})});
    const d=await r.json();
    const txt=d.text||d.error||'Помилка AI';
    ld.classList.remove('on');
    const cls=txt.includes('✅')?'ok':txt.includes('⚠️')?'part':'bad';
    ar.className='ai-res on '+cls;
    ar.innerHTML=`<div class="ai-lbl">🤖 AI Перевірка</div>${txt.replace(/\n/g,'<br>')}`;
    if(cls==='ok'||cls==='part'){done.add(qid);saveDone();renderSidebar(DATA[curTab]);updateProgress();}
  }catch(e){
    ld.classList.remove('on');ar.className='ai-res on bad';
    ar.innerHTML='Помилка зʼєднання. Перевір інтернет.';
  }
}

// ===== PROGRESS =====
function updateProgress(){
  const total=Object.values(DATA).reduce((s,a)=>s+a.qs.length,0);
  const d=done.size;
  document.getElementById('progTxt').textContent=`${d} / ${total}`;
  document.getElementById('progFill').style.width=(d/total*100)+'%';
}

function examStats(qs){
  let pts=0, mc=0, open=0, zuord=0;
  qs.forEach(q=>{
    pts += q.pts || 0;
    if(q.correctMulti) zuord++;
    else if(q.type==='mc' || q.type==='multiselect') mc++;
    else open++;
  });
  return { count: qs.length, pts, mc, open, zuord };
}

function renderStatsBar(activeGroup){
  const sl = examStats(DATA.a1.qs.concat(DATA.a2.qs, DATA.a3.qs, DATA.a4.qs));
  const sg = examStats(DATA.a5.qs);
  const sw = examStats(DATA.a6.qs);

  const chips = [
    { key:'lagerlogistik', icon:'📦', title:'Lagerlogistik', main:'100 балів', sub:`${sl.count} завдань · 150 хв<br>${sl.mc} тест · ${sl.open} відкр.` },
    { key:'guterumschlag', icon:'🚛', title:'Güterumschlag', main: sg.pts+' балів', sub:`${sg.count} завдань · 90 хв<br>${sg.mc+sg.zuord} тест/зіставлення · ${sg.open} відкр.` },
    { key:'wiso', icon:'⚖️', title:'WiSo', main: sw.pts+' балів', sub:`${sw.count} завдань · 60 хв<br>${sw.mc+sw.zuord} тест/зіставлення · ${sw.open} відкр.` },
  ];

  const el = document.getElementById('statsBar');
  el.innerHTML = chips.map(c => `
    <div class="stat-chip ${c.key===activeGroup?'active':''}">
      <div class="sc-title">${c.icon} ${c.title}</div>
      <div class="sc-main">${c.main}</div>
      <div class="sc-sub">${c.sub}</div>
    </div>`).join('')
    + `<div class="stat-chip" style="border-color:#3d2f00">
      <div class="sc-title">🏆 Загалом</div>
      <div class="sc-main">300 балів</div>
      <div class="sc-sub">3 частини екзамену<br>300 хв загалом</div>
    </div>`;

  // Динамічний підзаголовок
  const sub = document.getElementById('hdrSub');
  if(activeGroup==='lagerlogistik') sub.textContent = `Lagerlogistik · ${sl.count} завдань · 100 балів · 150 хв`;
  else if(activeGroup==='guterumschlag') sub.textContent = `Güterumschlag · ${sg.count} завдань · ${sg.pts} балів · 90 хв`;
  else if(activeGroup==='wiso') sub.textContent = `WiSo · ${sw.count} завдань · ${sw.pts} балів · 60 хв`;
  else sub.textContent = `3 частини екзамену · ${sl.count+sg.count+sw.count} завдань · 300 балів загалом`;
}

function makeWordsClickable(container){

// Обгортає кожне слово в окремий <span>, щоб клік завжди попадав
// точно в те слово, на яке натиснули — без вгадування координат.
function tokenizeWords(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let n;
  while(n = walker.nextNode()){
    if(n.parentElement && n.parentElement.classList.contains('wtok')) continue;
    if(n.nodeValue.trim()) textNodes.push(n);
  }
  const wordRe = /[A-Za-zÀ-ÖØ-öø-ÿА-Яа-яІіЇїЄєҐґ'-]{2,}/g;
  textNodes.forEach(node=>{
    const text = node.nodeValue;
    if(!wordRe.test(text)) return;
    wordRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while(m = wordRe.exec(text)){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'wtok';
      span.textContent = m[0];
      span.addEventListener('click', function(e){
        e.stopPropagation();
        showWordPopup(m[0], e.clientX, e.clientY);
      });
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

// ===== Переклад слів усередині варіантів відповіді (.mc-opt / .exam-opt) =====
// Короткий тап на кнопці — вибирає відповідь (як завжди).
// Довге утримання (≈450мс) на слові — відкриває переклад цього слова,
// не вибираючи відповідь.
function makeOptionWordsTranslatable(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('.mc-opt, .exam-opt, .zuord-btn').forEach(btn=>{
    if(btn.dataset.lp) return;
    btn.dataset.lp = '1';
    tokenizeWordsLongPress(btn);
    // Якщо щойно спрацював long-press — гасимо клік, що вибрав би відповідь
    btn.addEventListener('click', function(e){
      if(btn.dataset.lpFired === '1'){
        btn.dataset.lpFired = '';
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  });
}

function tokenizeWordsLongPress(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let n;
  while(n = walker.nextNode()){
    if(n.parentElement && n.parentElement.classList.contains('wtok-lp')) continue;
    if(n.nodeValue.trim()) textNodes.push(n);
  }
  const wordRe = /[A-Za-zÀ-ÖØ-öø-ÿА-Яа-яІіЇїЄєҐґ'-]{2,}/g;
  textNodes.forEach(node=>{
    const text = node.nodeValue;
    if(!wordRe.test(text)) return;
    wordRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while(m = wordRe.exec(text)){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'wtok-lp';
      span.textContent = m[0];
      attachLongPress(span, m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function attachLongPress(span, word){
  let timer = null;
  const btn = span.closest('.mc-opt, .exam-opt, .zuord-btn');
  const start = (e)=>{
    const pt = e.touches ? e.touches[0] : e;
    const x = pt.clientX, y = pt.clientY;
    timer = setTimeout(()=>{
      timer = null;
      if(btn) btn.dataset.lpFired = '1';
      if(navigator.vibrate) navigator.vibrate(15);
      showWordPopup(word, x, y);
    }, 450);
  };
  const cancel = ()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  span.addEventListener('touchstart', start, {passive:true});
  span.addEventListener('touchend', cancel);
  span.addEventListener('touchmove', cancel);
  span.addEventListener('touchcancel', cancel);
  span.addEventListener('mousedown', start);
  span.addEventListener('mouseup', cancel);
  span.addEventListener('mouseleave', cancel);
}

function showWordPopup(word, x, y){
  // Видаляємо старий попап
  const old = document.getElementById('word-popup');
  if(old) old.remove();

  const popup = document.createElement('div');
  popup.id = 'word-popup';
  popup.style.cssText = `
    position:fixed;z-index:9999;
    background:#1a1d2e;border:2px solid var(--gold);border-radius:12px;
    padding:14px 16px;min-width:200px;max-width:280px;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
    left:${Math.min(x, window.innerWidth-300)}px;
    top:${Math.min(y+10, window.innerHeight-150)}px;
  `;

  popup.innerHTML = `
    <div style="color:var(--gold);font-weight:700;font-size:15px;margin-bottom:4px">${word}</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px" id="popup-trans">🔄 Перекладаємо...</div>
    <div style="display:flex;gap:8px">
      <button onclick="addWordFromPopup('${word.replace(/'/g,"\'")}')" style="flex:1;background:var(--green);color:#000;border:none;border-radius:7px;padding:7px;font-weight:700;cursor:pointer;font-size:13px">+ Словник</button>
      <button onclick="document.getElementById('word-popup').remove()" style="background:var(--s3);color:var(--muted);border:none;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:16px">✕</button>
    </div>
  `;

  document.body.appendChild(popup);

  // Закриваємо при кліку поза попапом
  setTimeout(()=>{
    document.addEventListener('click', function handler(e){
      if(!popup.contains(e.target)){ popup.remove(); document.removeEventListener('click',handler); }
    });
  }, 100);

  // Переклад через Gemini API
  fetch('/api/gemini', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':window.ANTHROPIC_KEY||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({prompt:`Перекладай одне слово або фразу з німецької на українську. Відповідай ТІЛЬКИ перекладом, без пояснень, без лапок. Слово: "${word}"`})
  }).then(r=>r.json()).then(d=>{
    const el = document.getElementById('popup-trans');
    if(el) el.textContent = d.text || '—';
  }).catch(()=>{
    const el = document.getElementById('popup-trans');
    if(el) el.textContent = '(переклад недоступний)';
  });
}

// ===== EXAM MODE (ізольований модуль, не зачіпає звичайний режим) =====
let examState = null; // {tab, qs, answers:{}, idx, timeLeft, timerInterval, durationSec}

function startExamMode(tab){
  const auf = DATA[tab];
  if(!auf) return;
  const durationSec = tab === 'a5' ? 90*60 : 60*60; // Güterumschlag 90 Min, WiSo 60 Min
  examState = {
    tab,
    qs: auf.qs,
    answers: {},
    idx: 0,
    timeLeft: durationSec,
    durationSec,
    timerInterval: null,
    finished: false
  };
  document.getElementById('examHdrTitle').textContent = tab === 'a5' ? '🎯 Екзамен: Güterumschlag' : '🎯 Екзамен: WiSo';
  document.getElementById('examOverlay').classList.add('show');
  renderExamDots();
  renderExamQuestion();
  startExamTimer();
}

function startExamTimer(){
  updateExamTimerDisplay();
  examState.timerInterval = setInterval(()=>{
    examState.timeLeft--;
    updateExamTimerDisplay();
    if(examState.timeLeft <= 0){
      clearInterval(examState.timerInterval);
      finishExam(true);
    }
  }, 1000);
}

function updateExamTimerDisplay(){
  const t = document.getElementById('examTimer');
  const m = Math.floor(examState.timeLeft/60);
  const s = examState.timeLeft%60;
  t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  t.className = 'exam-timer';
  if(examState.timeLeft <= 300) t.classList.add('danger');
  else if(examState.timeLeft <= 600) t.classList.add('warn');
}

function renderExamDots(){
  const el = document.getElementById('examDots');
  el.innerHTML = examState.qs.map((q,i)=>{
    const answered = examState.answers[q.id] !== undefined;
    const isCurrent = i === examState.idx;
    return `<div class="exam-dot ${answered?'answered':''} ${isCurrent?'current':''}" onclick="goToExamQuestion(${i})">${i+1}</div>`;
  }).join('');
}

function goToExamQuestion(i){
  examState.idx = i;
  renderExamQuestion();
  renderExamDots();
}

function renderExamQuestion(){
  const q = examState.qs[examState.idx];
  const id = q.id;
  document.getElementById('examProgress').textContent = `Питання ${examState.idx+1} / ${examState.qs.length}`;

  let bodyHtml = `<div class="exam-q-card">
    <div class="exam-q-num">${q.id} · ${q.pts} бал${q.pts>1?'ів':''}</div>
    <div class="exam-q-text">${q.text}</div>`;

  const savedAns = examState.answers[id];

  if(q.correctMulti){
    // Zuordnung/Reihenfolge - кожен термін окремо
    const terms = Object.keys(q.correctMulti);
    bodyHtml += terms.map(term => {
      const savedForTerm = savedAns && savedAns[term];
      return `<div style="margin-bottom:14px">
        <div style="font-weight:600;color:#fff;margin-bottom:8px;font-size:13px">${term}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${q.options.map(opt=>{
            const val = opt.split('.')[0].trim();
            const sel = savedForTerm === val ? 'selected' : '';
            return `<button type="button" class="exam-opt ${sel}" style="width:auto;flex:1;min-width:120px" onclick="examSelectZuord('${term.replace(/'/g,"\\'")}','${val}')">${opt}</button>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  } else if(q.type === 'multiselect'){
    const savedArr = savedAns || [];
    bodyHtml += q.options.map(opt=>{
      const val = opt.split('.')[0].trim();
      const sel = savedArr.includes(val) ? 'selected' : '';
      return `<button type="button" class="exam-opt ${sel}" onclick="examToggleMultiselect('${val}')">${opt}</button>`;
    }).join('');
  } else if(q.type === 'mc'){
    bodyHtml += q.options.map(opt=>{
      const val = opt.split('.')[0].trim();
      const sel = savedAns === val ? 'selected' : '';
      return `<button type="button" class="exam-opt ${sel}" onclick="examSelectMC('${val}')">${opt}</button>`;
    }).join('');
  } else {
    // open question
    bodyHtml += `<textarea id="examOpenAnswer" style="width:100%;min-height:100px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:12px;font-family:'Inter',sans-serif;font-size:14px" placeholder="Schreibe deine Antwort..." oninput="examSaveOpenAnswer(this.value)">${savedAns||''}</textarea>`;
  }

  bodyHtml += `</div>`;
  document.getElementById('examBody').innerHTML = bodyHtml;

  const nav = document.getElementById('examNav');
  const isLast = examState.idx === examState.qs.length - 1;
  nav.innerHTML = `
    <button class="exam-btn-prev" onclick="examPrev()" ${examState.idx===0?'disabled style="opacity:.4"':''}>← Назад</button>
    ${isLast
      ? `<button class="exam-btn-finish" onclick="confirmFinishExam()">✓ Здати екзамен</button>`
      : `<button class="exam-btn-next" onclick="examNext()">Далі →</button>`}
  `;
}

function examSelectMC(val){
  const q = examState.qs[examState.idx];
  examState.answers[q.id] = val;
  renderExamQuestion();
  renderExamDots();
}

function examToggleMultiselect(val){
  const q = examState.qs[examState.idx];
  if(!examState.answers[q.id]) examState.answers[q.id] = [];
  const arr = examState.answers[q.id];
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  renderExamQuestion();
  renderExamDots();
}

function examSelectZuord(term, val){
  const q = examState.qs[examState.idx];
  if(!examState.answers[q.id]) examState.answers[q.id] = {};
  examState.answers[q.id][term] = val;
  renderExamQuestion();
  renderExamDots();
}

function examSaveOpenAnswer(val){
  const q = examState.qs[examState.idx];
  examState.answers[q.id] = val;
  // не перерендерюємо щоб не втратити фокус/курсор
  renderExamDots();
}

function examPrev(){
  if(examState.idx > 0){ examState.idx--; renderExamQuestion(); renderExamDots(); }
}
function examNext(){
  if(examState.idx < examState.qs.length-1){ examState.idx++; renderExamQuestion(); renderExamDots(); }
}

function confirmFinishExam(){
  const answered = Object.keys(examState.answers).length;
  const total = examState.qs.length;
  if(answered < total){
    const ok = confirm(`Ти відповів на ${answered} з ${total} питань. Точно завершити екзамен?`);
    if(!ok) return;
  }
  finishExam(false);
}

function finishExam(timeUp){
  if(examState.timerInterval) clearInterval(examState.timerInterval);
  examState.finished = true;

  // Підрахунок балів + детальний розбір по кожному питанню (для перегляду)
  let earnedPts = 0;
  let totalPts = 0;
  let correctCount = 0;
  let answeredCount = 0;
  const review = [];

  examState.qs.forEach(q=>{
    totalPts += q.pts;
    const ans = examState.answers[q.id];
    const isEmpty = ans === undefined || (Array.isArray(ans) && ans.length===0) || (typeof ans==='object' && !Array.isArray(ans) && Object.keys(ans).length===0) || (typeof ans==='string' && !ans.trim());
    if(!isEmpty) answeredCount++;

    let earned = 0, status = 'unanswered', userAnsText = '(не відповів)', correctText = q.ans || '';

    if(q.correctMulti){
      const terms = Object.keys(q.correctMulti);
      const rows = terms.map(term=>{
        const userVal = ans && ans[term];
        const okTerm = userVal === q.correctMulti[term];
        return `${term}: ти — ${userVal||'—'}${okTerm?'':` (правильно: ${q.correctMulti[term]})`}`;
      });
      userAnsText = isEmpty ? '(не відповів)' : rows.join('; ');
      if(!isEmpty){
        const allCorrect = terms.every(term => ans[term] === q.correctMulti[term]);
        if(allCorrect){ earned = q.pts; correctCount++; status='correct'; } else status='wrong';
      }
    } else if(q.type === 'multiselect'){
      const parsedCorrect = (q.ans||'').split('\n').map(l=>{
        const m = l.trim().match(/^(\d+)\./); return m?m[1]:null;
      }).filter(Boolean).sort();
      const userArr = (ans||[]).slice().sort();
      userAnsText = isEmpty ? '(не відповів)' : userArr.map(v=>(q.options.find(o=>o.split('.')[0].trim()===v)||v)).join('; ');
      if(!isEmpty && parsedCorrect.length){
        const ok = userArr.length===parsedCorrect.length && userArr.every((v,i)=>v===parsedCorrect[i]);
        if(ok){ earned = q.pts; correctCount++; status='correct'; } else status='wrong';
      } else if(!isEmpty){
        earned = q.pts * 0.5; status = 'partial';
      }
    } else if(q.type === 'mc'){
      const opt = q.options.find(o=>o.split('.')[0].trim()===ans);
      userAnsText = isEmpty ? '(не відповів)' : (opt||ans);
      if(!isEmpty){
        if(ans === q.correct){ earned = q.pts; correctCount++; status='correct'; } else status='wrong';
      }
    } else {
      // open питання — не перевіряється автоматично
      userAnsText = isEmpty ? '(не відповів)' : ans;
      status = isEmpty ? 'unanswered' : 'ungraded';
    }

    earnedPts += earned;
    review.push({ id:q.id, pts:q.pts, earned, status, text:q.text, userAnsText, correctText, isOpen: !q.correctMulti && q.type!=='mc' && q.type!=='multiselect' });
  });

  examState.review = review;

  const pct = totalPts > 0 ? (earnedPts/totalPts*100) : 0;
  const passed = pct >= 50;

  const examName = examState.tab === 'a5' ? 'Güterumschlag' : 'WiSo';
  const timeUsed = examState.durationSec - examState.timeLeft;
  const minUsed = Math.floor(timeUsed/60);

  document.getElementById('examHdrTitle').textContent = `🏁 Результат: ${examName}`;
  document.getElementById('examProgress').textContent = '';
  document.getElementById('examTimer').style.display = 'none';
  document.getElementById('examDots').innerHTML = '';
  document.getElementById('examNav').innerHTML = `<button class="exam-btn-next" onclick="closeExamMode()">Закрити</button>`;

  document.getElementById('examBody').innerHTML = `
    <div class="exam-result">
      <div class="exam-result-badge">${passed ? '✅' : '❌'}</div>
      <div class="exam-result-title ${passed?'pass':'fail'}">${passed ? 'ЗДАВ!' : 'НЕ ЗДАВ'}</div>
      <div class="exam-result-score">${pct.toFixed(1)}%</div>
      <div class="exam-result-sub">${earnedPts.toFixed(1)} з ${totalPts} балів ${timeUp ? '· ⏰ час вийшов' : ''}</div>
      <div class="exam-result-bar"><div class="exam-result-fill" style="width:${Math.min(pct,100)}%;background:${passed?'var(--green)':'#dc2626'}"></div></div>
      <div class="exam-result-stats">
        <div class="exam-result-stat"><div class="ers-num">${correctCount}</div><div class="ers-lbl">Правильних (MC/Zuordnung)</div></div>
        <div class="exam-result-stat"><div class="ers-num">${answeredCount}/${examState.qs.length}</div><div class="ers-lbl">Дано відповідей</div></div>
        <div class="exam-result-stat"><div class="ers-num">${minUsed} хв</div><div class="ers-lbl">Витрачено часу</div></div>
        <div class="exam-result-stat"><div class="ers-num">${pct>=50?'≥50%':'<50%'}</div><div class="ers-lbl">Прохідний бал</div></div>
      </div>
      <button class="btn" style="background:var(--acc);color:#fff;font-weight:700;width:100%;margin-top:14px;padding:12px" onclick="renderExamReview()">📋 Переглянути відповіді</button>

function getVtQuestions(dayIdx){
  const allQs=[];
  ['a1','a2','a3','a4'].forEach(tab=>{if(DATA[tab])DATA[tab].qs.forEach(q=>allQs.push({...q,tab}));});
  return allQs.slice(dayIdx*5,(dayIdx+1)*5);
}
function getTotalVtDays(){
  let t=0;['a1','a2','a3','a4'].forEach(tab=>{if(DATA[tab])t+=DATA[tab].qs.length;});
  return Math.ceil(t/5);
}

function vtHandleInput(val){
  const btn = document.getElementById('vtCheckBtn');
  if(btn) btn.style.opacity = val.trim() ? '1' : '0.5';
  if(btn) btn.disabled = !val.trim();
}

function vtCheckFromInput(){
  const ta = document.getElementById('vtTextInput');
  if(!ta || !ta.value.trim()) return;
  vtCheck(ta.value.trim());
}

function vtToggle(){vtRecording?vtStop():vtStart();}
function vtStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Потрібен Chrome!');return;}
  vtRecognition=new SR();vtRecognition.lang='de-DE';
  vtRecognition.continuous=true;vtRecognition.interimResults=true;
  const btn=document.getElementById('vtMicBtn'),tr=document.getElementById('vtTr');
  btn.className='vt-mic-btn recording';btn.innerHTML='⏹ Зупинити';vtRecording=true;
  vtRecognition.onresult=e=>{
    let fin='',int='';
    for(let i=e.resultIndex;i<e.results.length;i++)
      e.results[i].isFinal?fin+=e.results[i][0].transcript:int+=e.results[i][0].transcript;
    tr.textContent=fin||int;tr.className='vt-transcript active';vtTranscript=fin||int;
  };
  vtRecognition.onerror=()=>vtStop();
  vtRecognition.onend=()=>{if(vtRecording)vtStop();};
  vtRecognition.start();
}
function vtStop(){
  vtRecording=false;if(vtRecognition)vtRecognition.stop();
  const btn=document.getElementById('vtMicBtn');
  btn.className='vt-mic-btn';btn.innerHTML='🎤 Говорити знову';
  if(vtTranscript&&vtTranscript.trim())vtCheck(vtTranscript);
}
async function vtCheck(ans){
  const qs=getVtQuestions(vtDay),q=qs[vtIdx];
  const ai=document.getElementById('vtAi'),btns=document.getElementById('vtBtns');
  ai.style.display='block';ai.className='vt-ai-result loading';ai.textContent='⏳ AI перевіряє...';
  const prompt=`Du bist ein IHK-Prüfer für Lagerlogistik.
Frage: ${q.text}
Musterlösung: ${q.ans||q.a||''}
Antwort des Lernenden: ${ans}
Bewerte kurz auf Ukrainisch (2-3 Sätze): beginne mit ✅ Richtig! oder ❌ Nicht vollständig. Was war gut? Was fehlte?`;
  try{
    const r=await fetch('/api/gemini',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const d=await r.json();
    const t=d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    if(!t) throw new Error('empty');
    ai.className='vt-ai-result '+(t.includes('✅')?'correct':'wrong');
    ai.innerHTML=t+'<div id="vtDialogArea" style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px"></div>';
    vtShowDialogInput(q, ans, t);
  }catch(e){
    ai.className='vt-ai-result wrong';
    ai.textContent='Помилка AI. Перевір відповідь вручну.';
  }
  btns.style.display='flex';
}

async function vtAskFollowup(btn, text){
  document.getElementById('vtFollowupInput').value = text;
  vtSendFollowup();
}

async function vtSendFollowup(){
  const input = document.getElementById('vtFollowupInput');
  const resp = document.getElementById('vtFollowupResp');
  if(!input||!resp) return;
  const question = input.value.trim();
  if(!question) return;

  const ctx = window.vtDialogCtx||{};
  resp.textContent = '⏳ AI думає...';
  resp.style.color = '#64748b';

  const prompt = `Контекст: Учень вивчає IHK Lagerlogistik.
Питання екзамену: ${ctx.question}
Правильна відповідь: ${ctx.correctAnswer}
Відповідь учня: ${ctx.userAnswer}
Попередня оцінка AI: ${ctx.lastResponse}

Запит учня: ${question}

Відповідай коротко і чітко українською мовою. Якщо питають "як правильно" — дай конкретну відповідь в форматі екзамену.`;

  try{
    const r = await fetch('/api/gemini',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const d = await r.json();
    const t = d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    resp.textContent = t;
    resp.style.color = '#86efac';
    input.value = '';
  }catch(e){
    resp.textContent = 'Помилка. Спробуй ще раз.';
    resp.style.color = '#ef4444';
  }
}
