ез гарнітуру і вводить їх з клавіатури."],"correct":"1","exp":"🇺🇦 \"Voll automatisiert\" (повністю автоматизовано) і \"beleglos\" (без паперу) — який варіант НЕ потребує жодної ручної дії людини в передачі даних роботу?","hint":"💡 Всі інші варіанти мають крок де людина щось вручну вводить/сканує/говорить. Шукай варіант БЕЗ ручного втручання.","ans":"1. Ein Mitarbeiter im Auftragseingang gibt die Auftragsdaten in den Lagerverwaltungsrechner ein, der diese an den Kommissionierroboter beleglos übermittelt."},{"id":"MC-30","pts":3,"type":"open","text":"Ручний співробітник: 120 секунд на позицію. Робот-комісіонер: 60 позицій на годину. Розрахуйте, на скільки позицій робот може обробити БІЛЬШЕ за робочий день (8 годин), ніж співробітник!","exp":"🇺🇦 Спочатку знайди продуктивність людини за годину, потім за 8 годин для обох, потім різницю.","hint":"💡 Mitarbeiter: 3600 Sek / 120 Sek = позицій/год. × 8 год. Roboter: 60 × 8 = позицій. Знайди різницю.","ans":"Mitarbeiter: 3.600 Sek : 120 Sek = 30 Positionen/Stunde × 8 Std = 240 Positionen/Tag\nRoboter: 60 Positionen/Stunde × 8 Std = 480 Positionen/Tag\nDifferenz: 480 - 240 = 240 Positionen mehr"},{"id":"MC-31","pts":3,"type":"open","text":"Розрахуйте, на скільки відсотків зростає продуктивність комісіонування при використанні робота! (Співробітник: 30 поз./год, робот: 60 поз./год)","exp":"🇺🇦 Розрахунок процентного зростання. Формула: (новий - старий) / старий × 100%","hint":"💡 (60 - 30) / 30 × 100 = ?","ans":"(60 - 30) : 30 × 100 = 100% Steigerung"},{"id":"MC-32","pts":3,"type":"open","text":"Витрати на ручне комісіонування: 150,00 €/год. При використанні робота витрати на 40% вищі. Розрахуйте витрати на комісіонування роботом за годину!","exp":"🇺🇦 Розрахунок збільшення на відсоток.","hint":"💡 150 € × 1,40 = ? або 150 + (150 × 0,40)","ans":"150,00 € × 1,40 = 210,00 €/Stunde"},{"id":"MC-33","pts":5,"type":"mc","text":"Eltron GmbH планує метод термоусадкової плівки. Оцінка ризиків для придбання термопістолета та балонів з пропаном. Розставте кроки у правильному порядку (починаючи з «Arbeitsbereiche und Tätigkeiten erfassen»):<br><br><strong>Maßnahmen durchführen</strong> — <strong>Gefährdungen ermitteln</strong> — <strong>Wirksamkeit überprüfen</strong> — <strong>Gefährdungen beurteilen</strong> — <strong>Schutzmaßnahmen festlegen</strong>","options":["1","2","3","4","5","6"],"correctMulti":{"Arbeitsbereiche und Tätigkeiten erfassen":"1","Gefährdungen ermitteln":"2","Gefährdungen beurteilen":"3","Schutzmaßnahmen festlegen":"4","Maßnahmen durchführen":"5","Wirksamkeit überprüfen":"6"},"exp":"🇺🇦 Стандартний процес Gefährdungsbeurteilung (оцінки ризиків) за німецьким законодавством — завжди в одному порядку.","hint":"💡 Логіка: спочатку зрозуміти ЩО роблять (Arbeitsbereiche), потім знайти небезпеки (ermitteln), оцінити їх (beurteilen), вирішити що робити (festlegen), зробити (durchführen), перевірити чи спрацювало (überprüfen).","ans":"1. Arbeitsbereiche und Tätigkeiten erfassen\n2. Gefährdungen ermitteln\n3. Gefährdungen beurteilen\n4. Schutzmaßnahmen festlegen\n5. Maßnahmen durchführen\n6. Wirksamkeit überprüfen"},{"id":"MC-34","pts":3,"type":"mc","text":"Ви пояснюєте учню роботу пакувальної машини, включно з небезпеками та захисними заходами. Яку основу ви використовуєте?","options":["1. Паспорт безпеки (Sicherheitsdatenblatt) пакувальної машини","2. Виробнича інструкція (Betriebsanweisung) пакувальної машини","3. Рекламний проспект пакувальної машини","4. Декларація відповідності (Konformitätserklärung) пакувальної машини","5. Коносамент (Konnossement) пакувальної машини"],"correct":"2","exp":"🇺🇦 Документ з правилами безпечної роботи на КОНКРЕТНІЙ машині — як називається?","hint":"💡 Sicherheitsdatenblatt — для хімічних речовин. Konnossement — морський транспорт. Що залишається для безпеки роботи з машиною?","ans":"2. Betriebsanweisung der Verpackungsmaschine"},{"id":"MC-35","pts":3,"type":"mc","text":"Упаковка у складні коробки з гофрокартону. З економічних/екологічних причин потрібно заощадити пакувальні допоміжні матеріали. Який захід економить пакувальні матеріали?","options":["1. Використовувати максимально велику складну коробку","2. Пакувати кілька замовлень клієнтів разом в одну складну коробку","3. Принципово відмовитися від пакувальних допоміжних матеріалів","4. Використовувати багаторазову транспортну тару для пакування","5. Використовувати мінімально можливу складну коробку"],"correct":"5","exp":"🇺🇦 Менша упаковка = менше матеріалу для заповнення пустот = економія Packhilfsmittel (наповнювач, плівка тощо).","hint":"💡 Чим менша коробка точно під розмір товару, тим менше треба додаткового заповнювача.","ans":"5. Sie nutzen zum Verpacken die kleinstmögliche Faltschachtel."},{"id":"MC-36","pts":3,"type":"mc","text":"Ви створюєте файл постачальника в базі даних. Яка інформація для цього необхідна?","options":["1. Складський запас постачальника","2. Заробітна плата брутто співробітників постачальника","3. Точна адреса постачальника","4. Огляд сплачених податків постачальника","5. База клієнтів постачальника"],"correct":"3","exp":"🇺🇦 Lieferantendatei (картка постачальника) — яка інформація реально потрібна для зв'язку та замовлень?","hint":"💡 Зарплата співробітників, податки, клієнти постачальника — це не твоя справа і не потрібно для замовлень. Що потрібно щоб з ним зв'язатись?","ans":"3. Genaue Anschrift des Lieferanten"}]},"a6":{"label":"Економіка та суспільствознавство (WiSo) — 30 завдань, 60 хв, 100 балів","isMC":true,"sit":"<p>Це завдання складається з <strong>30 окремих завдань</strong> у форматі тестових питань, зіставлення та впорядкування. Завдання стосуються різних співробітників і учнів Eltron GmbH.</p>","qs":[{"id":"WI-1","pts":3,"type":"mc","text":"Пані Sarah Hamer, повнолітня, уклала з Eltron GmbH учнівський договір на навчання за фахом Fachkraft für Lagerlogistik. Пані Hamer дізнається, що в Німеччині професійне навчання зазвичай проводиться в рамках дуальної системи. Поясніть, що розуміють під дуальною системою професійного навчання!","options":["1. Практичне навчання відбувається лише в школі, теоретичне — лише на підприємстві.","2. Учні повинні щодня відвідувати і школу, і підприємство.","3. Школа і навчальне підприємство разом складають рамковий навчальний план.","4. Під час навчання потрібно пройти щонайменше два стажування на інших підприємствах.","5. Професійне навчання відбувається у двох місцях навчання — школі та навчальному підприємстві."],"correct":"5","exp":"🇺🇦 \"Duales System\" — подвійна система. Питання: де саме навчається учень? Скільки місць навчання задіяно?","hint":"💡 \"Dual\" = подвійний = два місця. Школа (теорія) + підприємство (практика) = два Lernorte.","ans":"5. Die Berufsausbildung erfolgt an zwei Lernorten, der Schule und dem Ausbildungsbetrieb."},{"id":"WI-2","pts":3,"type":"mc","text":"Хто має право проводити професійне навчання на Eltron GmbH?","options":["1. Лише особи, які склали випускний іспит Fachoberschule","2. Лише особи, які склали Meisterprüfung","3. Лише особи, які працюють на Eltron GmbH щонайменше шість місяців","4. Лише особи, які мають особисту й фахову придатність до навчання","5. Лише дипломовані педагоги з професійної освіти"],"correct":"4","exp":"🇺🇦 За BBiG (Berufsbildungsgesetz) — хто має право навчати учнів на підприємстві? Які умови потрібні для Ausbilder/Ausbildungsbetrieb?","hint":"💡 Закон вимагає 2 типи придатності: persönliche (особиста, напр. не засуджений) і fachliche (фахова кваліфікація).","ans":"4. Nur Personen, die die persönliche und fachliche Eignung für die Berufsausbildung nachweisen"},{"id":"WI-3","pts":3,"type":"mc","text":"Пані Hamer, уклавши учнівський договір, бере на себе низку зобов'язань. Визначте, яке зобов'язання є для неї особливо важливим!","options":["1. Обов'язок пропрацювати рік на Eltron GmbH після завершення навчання","2. Обов'язок докладати зусиль для здобуття професійної компетентності","3. Обов'язок самостійно оплачувати всі збитки, завдані на місці навчання","4. Обов'язок бути доступною по телефону в будь-який час під час навчання","5. Обов'язок брати участь у позавиробничих заходах підвищення кваліфікації під час відпустки"],"correct":"2","exp":"🇺🇦 За BBiG § 13 — основні обов'язки учня (Auszubildender). Яка з них є справжньою юридичною Pflicht (а не вигадкою)?","hint":"💡 Учень зобов'язаний СТАРАТИСЯ навчитися (Bemühenspflicht), а не нести фінансову чи телефонну відповідальність.","ans":"2. Die Pflicht, sich darum zu bemühen, die berufliche Handlungsfähigkeit zu erwerben"},{"id":"WI-4","pts":3,"type":"mc","text":"Визначте, яка правова основа є ключовою при оформленні учнівського договору пані Hamer!","options":["1. Betriebsverfassungsgesetz","2. Handelsgesetzbuch","3. Berufsbildungsgesetz","4. Jugendarbeitsschutzgesetz","5. Mutterschutzgesetz"],"correct":"3","exp":"🇺🇦 Який закон РЕГУЛЮЄ зміст Berufsausbildungsvertrag (договір про навчання)?","hint":"💡 Назва закону прямо містить \"Berufsbildung\" (професійне навчання) — це найочевидніша підказка.","ans":"3. Berufsbildungsgesetz (BBiG)"},{"id":"WI-5","pts":2,"type":"open","text":"Скільки місяців випробувального терміну максимально могли погодити в учнівському договорі пані Hamer? Впишіть кількість місяців!","exp":"🇺🇦 За BBiG є чітко визначений максимальний термін Probezeit (випробувального терміну) для учнівського договору.","hint":"💡 За законом максимум — від 1 до 4 місяців.","ans":"4 Monate (gemäß § 20 BBiG: Probezeit mindestens 1 Monat, höchstens 4 Monate)"},{"id":"WI-6","pts":3,"type":"mc","text":"Для пані Hamer виникають витрати на персонал. Eltron GmbH як роботодавець сплачує обов'язкові та добровільні соціальні виплати. Вкажіть позицію, яка належить до групи обов'язкових соціальних виплат!","options":["1. Частка роботодавця в обов'язковому соціальному страхуванні","2. Відпускні","3. Частка роботодавця у виплатах, що формують майно (vermögenswirksame Leistungen)","4. Виплати на корпоративне пенсійне забезпечення","5. Оплачувані простої через переїзд"],"correct":"1","exp":"🇺🇦 Gesetzliche Sozialleistungen = обов'язкові за законом. Freiwillige = добровільні бонуси роботодавця. Яка з 5 опцій ОБОВ'ЯЗКОВА за законом?","hint":"💡 Urlaubsgeld, vermögenswirksame Leistungen, Altersversorgung, Umzugskosten — все це ДОБРОВІЛЬНІ виплати. Що залишається обов'язковим?","ans":"1. Arbeitgeberanteil zur gesetzlichen Sozialversicherung"},{"id":"WI-7","pts":5,"type":"mc","text":"Пані Hamer має обов'язкове соціальне страхування, а також уклала приватні страхові поліси. Зіставте, які 2 з 5 видів страхування відповідають наведеним виплатам:<br><br><strong>Übernahme der Kosten einer notwendigen Operation</strong> — <strong>Altersruhegeld</strong>","options":["1. Обов'язкове страхування на випадок необхідності догляду (Pflegeversicherung)","2. Приватне страхування цивільної відповідальності","3. Обов'язкове пенсійне страхування (Rentenversicherung)","4. Обов'язкове медичне страхування (Krankenversicherung)","5. Приватне страхування правового захисту"],"correctMulti":{"Übernahme der Kosten einer notwendigen Operation":"4","Altersruhegeld":"3"},"exp":"🇺🇦 Зіставлення страховок з виплатами. Операція = яка страховка покриває лікування? Altersruhegeld (пенсія по старості) = яка страховка?","hint":"💡 Krankenversicherung = хвороба/лікування. Rentenversicherung = пенсія/старість.","ans":"Übernahme der Kosten einer notwendigen Operation → 4 (Gesetzliche Krankenversicherung)\\nAltersruhegeld → 3 (Gesetzliche Rentenversicherung)"},{"id":"WI-8","pts":3,"type":"mc","text":"Пані Hamer потрапила в аварію з навантажувачем на території Eltron GmbH і отримала легкі травми. Визначте, хто в цьому випадку покриває витрати на її лікування!","options":["1. Відповідна професійна спілка страхування (Berufsgenossenschaft)","2. Приватне страхування цивільної відповідальності учениці","3. Медичне страхування учениці","4. Страхування цивільної відповідальності навчального підприємства","5. Лише приватне страхування від нещасних випадків учениці"],"correct":"1","exp":"🇺🇦 Нещасний випадок СТАВСЯ НА РОБОТІ (Arbeitsunfall). Хто покриває витрати на лікування виробничих травм?","hint":"💡 Berufsgenossenschaft = страховка від нещасних випадків на виробництві (Unfallversicherung), а не приватна чи звичайна медична страховка.","ans":"1. Die zuständige Berufsgenossenschaft"},{"id":"WI-9","pts":3,"type":"mc","text":"Пані Hamer змушена виконувати роботи, які, на її думку, не передбачені виробничим планом навчання. Вона хоче поскаржитися до інстанції, відповідальної за професійне навчання. До якої інстанції може звернутися пані Hamer у цьому випадку?","options":["1. До адвокатської контори","2. До відповідної Торгово-промислової палати (IHK)","3. До профспілки","4. До професійного училища","5. До Служби зайнятості (Agentur für Arbeit)"],"correct":"2","exp":"🇺🇦 Хто контролює дотримання Ausbildungsplan і вирішує спори про учнівство? Яка офіційна установа відповідає за Berufsausbildung?","hint":"💡 IHK (Industrie- und Handelskammer) — офіційний наглядовий орган для всіх питань Ausbildung, включно зі спорами.","ans":"2. An die zuständige Industrie- und Handelskammer"},{"id":"WI-10","pts":3,"type":"mc","text":"Визначте, яка подія призводить до негайного припинення навчальних відносин пані Hamer!","options":["1. Допуск до дострокового випускного іспиту","2. Оголошення результату про складання випускного іспиту","3. Останній день навчання в професійному училищі","4. Початок літніх канікул","5. Незскладання письмового випускного іспиту з першої спроби"],"correct":"2","exp":"🇺🇦 Коли ЮРИДИЧНО закінчується учнівський договір? Яка саме подія — миттєвий тригер закінчення?","hint":"💡 За § 21 BBiG — учнівство закінчується в момент ОГОЛОШЕННЯ результату (Bekanntgabe), що іспит складено, а не в інший день.","ans":"2. Die Bekanntgabe des Bestehens der Abschlussprüfung"},{"id":"WI-11","pts":4,"type":"mc","text":"Пані Lara Kösters успішно завершила навчання за фахом Fachkraft für Lagerlogistik на Müller GmbH. З 01.05.2026 вона укладає з Eltron GmbH трудовий договір про безстрокові трудові відносини. Існують законодавчі норми, які стосуються лише навчальних відносин, і норми, які стосуються лише трудових відносин. Зіставте:<br><br><strong>Die Probezeit beträgt maximal 6 Monate.</strong> — <strong>Die Höhe der Vergütung muss von Jahr zu Jahr steigen.</strong> — <strong>Eine ordentliche Kündigung nach der Probezeit von Seiten des Betriebs ist nicht möglich.</strong> — <strong>Es ist ein Ausbildungsnachweis zu führen.</strong>","options":["1. Норми для навчальних відносин","2. Норми для трудових відносин"],"correctMulti":{"Die Probezeit beträgt maximal 6 Monate.":"2","Die Höhe der Vergütung muss von Jahr zu Jahr steigen.":"1","Eine ordentliche Kündigung nach der Probezeit von Seiten des Betriebs ist nicht möglich.":"1","Es ist ein Ausbildungsnachweis zu führen.":"1"},"exp":"🇺🇦 Порівняй правила Ausbildungsverhältnis (учнівство, BBiG) і Arbeitsverhältnis (звичайна робота, після навчання). Які правила належать до якого типу?","hint":"💡 Probezeit 6 місяців = типово для звичайної РОБОТИ. Зростаюча зарплата щороку, заборона звільнення, Ausbildungsnachweis (звіт учня) — все це особливості УЧНІВСТВА.","ans":"Probezeit max. 6 Monate → 2 (Arbeitsverhältnis)\\nVergütung steigt jährlich → 1 (Ausbildungsverhältnis)\\nKündigungsschutz nach Probezeit → 1 (Ausbildungsverhältnis)\\nAusbildungsnachweis führen → 1 (Ausbildungsverhältnis)"},{"id":"WI-12","pts":3,"type":"mc","text":"У трудовому договорі, укладеному з Eltron GmbH, серед іншого погоджено: місячна оплата 2.700,00 € — це на 200,00 € більше тарифної ставки, 18 робочих днів річної відпустки — при 5-денному робочому тижні. Оцініть правову ситуацію!","options":["1. Договір дійсний у всіх пунктах.","2. Договір повністю дійсний, доки не буде успішно оскаржений однією зі сторін.","3. Недійсним є лише право на відпустку.","4. Недійсна лише надтарифна оплата, в іншому договір дійсний.","5. Договір повністю недійсний, оскільки порушено законодавчий мінімум відпустки."],"correct":"3","exp":"🇺🇦 Gesetzlicher Mindesturlaub (Bundesurlaubsgesetz) при 5-денному тижні = 20 робочих днів мінімум. 18 днів менше за мінімум — що з цим пунктом договору?","hint":"💡 Зарплата вища за тариф — це нормально (Günstigkeitsprinzip). Але відпустка нижча за законний мінімум — ця частина недійсна (nichtig), решта договору залишається чинною.","ans":"3. Nur der Urlaubsanspruch ist nichtig. (Der gesetzliche Mindesturlaub bei 5-Tage-Woche beträgt 20 Arbeitstage — 18 Tage unterschreiten diesen Mindestanspruch und sind daher nichtig; der restliche Vertrag bleibt gültig.)"},{"id":"WI-13","pts":5,"type":"open","text":"Пані Kösters отримує щомісячний розрахунковий лист, який серед іншого містить: заробітна плата брутто 2.700,00 € | податок на зарплату 233,50 € | церковний податок 18,68 € | частка працівника в обов'язковому соціальному страхуванні загалом 21,1 %. Визначте суму до виплати в €!","exp":"🇺🇦 Розрахунок Netto з Brutto. Спочатку знайди суму соціального страхування у € (21,1% від брутто), потім відніми всі відрахування від брутто.","hint":"💡 Sozialversicherung: 2.700 € × 21,1% = ? €. Auszahlung = Brutto − Lohnsteuer − Kirchensteuer − Sozialversicherung.","ans":"Sozialversicherung: 2.700,00 € × 21,1% = 569,70 €\\nAuszahlungsbetrag = 2.700,00 − 233,50 − 18,68 − 569,70 = 1.878,12 €"},{"id":"WI-14","pts":3,"type":"mc","text":"У червні 2026 року на Eltron GmbH відбудуться вибори до виробничої ради (Betriebsrat). Визначте, чи може пані Kösters балотуватися до виробничої ради!","options":["1. Так, тому що вона повнолітня.","2. Так, тому що вона має завершене професійне навчання.","3. Ні, тому що вона ще недостатньо довго працює на Eltron GmbH.","4. Ні, тому що вона не є членом профспілки.","5. Ні, тому що спочатку вона має балотуватися до Ради молоді та учнів (JAV)."],"correct":"3","exp":"🇺🇦 За BetrVG (Betriebsverfassungsgesetz) — щоб БУТИ ОБРАНИМ у Betriebsrat, потрібен мінімальний стаж роботи на підприємстві. Frau Kösters щойно почала (01.05.2026).","hint":"💡 Wahlrecht (право голосувати) ≠ Wählbarkeit (право бути обраним). Для обрання потрібно 6 місяців стажу на підприємстві (§ 8 BetrVG).","ans":"3. Nein, weil sie noch nicht lange genug bei der Eltron GmbH beschäftigt ist. (Wählbar ist gem. § 8 BetrVG erst nach 6 Monaten Betriebszugehörigkeit.)"},{"id":"WI-15","pts":3,"type":"mc","text":"Пані Kösters хоче підвищити кваліфікацію. У фаховому журналі вона знаходить таке оголошення: «Завдяки підвищенню кваліфікації до Geprüfter Logistikmeister відкриваються багато дверей у логістичній галузі... Витрати на це підвищення кваліфікації становлять близько 4.000,00 €.» Вкажіть, яку перевагу отримала б пані Kösters завдяки цьому підвищенню кваліфікації!","options":["1. Завдяки підвищенню кваліфікації вона може бути впевнена, що ніколи не втратить робоче місце на Eltron GmbH.","2. Вона не отримує жодної переваги від підвищення кваліфікації, оскільки має сама сплатити 4.000,00 €.","3. Вона може відкрити власну справу лише після відповідного підвищення кваліфікації.","4. Завдяки підвищенню кваліфікації вона отримує право сама навчати учнів на Eltron GmbH.","5. Завдяки підвищенню кваліфікації вона досягає вищої кваліфікації і має можливість кар'єрного зростання."],"correct":"5","exp":"🇺🇦 Який РЕАЛЬНИЙ та загальний переваг має Fortbildung (підвищення кваліфікації) до рівня Meister?","hint":"💡 Думай широко: Meistertitel дає вищу кваліфікацію, не лише одну конкретну можливість (як самозайнятість чи навчання учнів — це лише ПОБІЧНІ ефекти, не головна перевага).","ans":"5. Sie erreicht durch die Fortbildung eine höhere Qualifizierung und hat die Möglichkeit beruflich aufzusteigen."},{"id":"WI-16","pts":3,"type":"mc","text":"Кілька співробітників Eltron GmbH хочуть вирішити спори в суді. Визначте, у якому випадку компетентний Sozialgericht (соціальний суд)!","options":["1. Співробітник спорить з обов'язковою медичною страховою касою щодо покриття витрат на зубні протези.","2. Співробітник вважає своє звільнення необґрунтованим.","3. Співробітник спорить з роботодавцем щодо оплати понаднормових.","4. Співробітник звинувачує іншого співробітника в крадіжці під час роботи.","5. Співробітник постійно відчуває себе несправедливо обділеним при розподілі змін."],"correct":"1","exp":"🇺🇦 Sozialgericht — спеціалізований суд для спорів з касами соціального страхування (Krankenkasse, Rentenversicherung, тощо). Яка ситуація стосується саме цього?","hint":"💡 Kündigung та Überstunden → Arbeitsgericht. Крадіжка → кримінальний суд. Krankenkasse спір → саме Sozialgericht.","ans":"1. Ein Mitarbeiter streitet mit der gesetzlichen Krankenkasse um die Übernahme von Kosten für Zahnersatz."},{"id":"WI-17","pts":4,"type":"mc","text":"4 основні свободи для громадян і підприємств Європейського внутрішнього ринку набули чинності з 01.01.1993. Зіставте:<br><br><strong>Import und Export von Lebensmitteln</strong> — <strong>Wegfall von Grenzkontrollen für Urlauber</strong> — <strong>Öffnung der Telekommunikationsmärkte</strong> — <strong>Geldanlage in anderen EU-Ländern</strong>","options":["1. Вільний рух осіб","2. Вільний рух товарів","3. Вільний рух послуг","4. Вільний рух капіталу"],"correctMulti":{"Import und Export von Lebensmitteln":"2","Wegfall von Grenzkontrollen für Urlauber":"1","Öffnung der Telekommunikationsmärkte":"3","Geldanlage in anderen EU-Ländern":"4"},"exp":"🇺🇦 4 основні свободи ЄС. Зіставляй приклад до правильної свободи: товари, люди, послуги, чи капітал/гроші?","hint":"💡 Lebensmittel = товар (Ware). Grenzkontrollen für Urlauber = люди (Personen). Telekommunikationsmärkte = послуги (Dienstleistung). Geldanlage = капітал (Kapital).","ans":"Import/Export von Lebensmitteln → 2 (Freier Warenverkehr)\\nWegfall von Grenzkontrollen → 1 (Freier Personenverkehr)\\nÖffnung Telekommunikationsmärkte → 3 (Freier Dienstleistungsverkehr)\\nGeldanlage in EU-Ländern → 4 (Freier Kapitalverkehr)"},{"id":"WI-18","pts":5,"type":"mc","text":"Після кількох років роботи на Eltron GmbH Lenny Woll хоче зробити крок до самостійної підприємницької діяльності. Він хоче заснувати невелике транспортно-логістичне підприємство. Розставте наступні кроки заснування бізнесу у правильному порядку:<br><br><strong>Mit den geschätzten Zahlen zu Umsatzerlösen und Kosten die Finanzierung mit der Bank klären</strong> — <strong>Investition des Darlehens in einen Transporter</strong> — <strong>Entwicklung einer Geschäftsidee</strong> — <strong>Geschäftskonto eröffnen und dort das Darlehen der Bank gutschreiben lassen</strong> — <strong>Businessplan erstellen</strong>","options":["1","2","3","4","5"],"correctMulti":{"Entwicklung einer Geschäftsidee":"1","Businessplan erstellen":"2","Mit den geschätzten Zahlen zu Umsatzerlösen und Kosten die Finanzierung mit der Bank klären":"3","Geschäftskonto eröffnen und dort das Darlehen der Bank gutschreiben lassen":"4","Investition des Darlehens in einen Transporter":"5"},"exp":"🇺🇦 Логічна послідовність заснування бізнесу: спочатку ідея, потім план, потім фінансування, потім рахунок, потім інвестиція.","hint":"💡 Ідея → План (Businessplan включає цифри) → Переговори з банком → Відкриття рахунку → Витрата грошей на транспорт.","ans":"1. Entwicklung einer Geschäftsidee\\n2. Businessplan erstellen\\n3. Mit den geschätzten Zahlen die Finanzierung mit der Bank klären\\n4. Geschäftskonto eröffnen und Darlehen gutschreiben lassen\\n5. Investition des Darlehens in einen Transporter"},{"id":"WI-19","pts":2,"type":"multiselect","text":"Під час процесу заснування пан Woll має також визначитися з оптимальним місцем розташування. Визначте 2 фактори, які потрібно враховувати при виборі місця розташування!","options":["1. Культурна дозвіллєва пропозиція в цій місцевості","2. Стиль керівництва на підприємстві","3. Ставка ПДВ (Umsatzsteuersatz)","4. Транспортна доступність","5. Присутність підприємства в соціальних мережах","6. Конкуренція в околиці"],"correctMulti":null,"exp":"🇺🇦 Standortfaktoren (фактори вибору місця) для логістичного бізнесу — що реально важливо при виборі локації?","hint":"💡 Думай про логістику: транспортна доступність і конкуренти поблизу — це класичні Standortfaktoren. Інші опції не стосуються місця розташування.","ans":"4. Verkehrsanbindung\\n6. Konkurrenz in der Umgebung"},{"id":"WI-20","pts":3,"type":"mc","text":"Окрім внесення до торгового реєстру, існують обов'язки щодо реєстрації нового підприємства. Назвіть інстанцію, у якій підприємство серед іншого має бути зареєстроване!","options":["1. Служба зайнятості (Arbeitsamt)","2. Управління з питань підприємництва (Gewerbeamt)","3. Поліція","4. Управління містобудування (Bauamt)","5. Управління громадського порядку (Ordnungsamt)"],"correct":"2","exp":"🇺🇦 Кожен новий бізнес (Gewerbe) в Німеччині потрібно зареєструвати в одній конкретній установі.","hint":"💡 Назва установи прямо містить слово \"Gewerbe\" (підприємницька діяльність).","ans":"2. Gewerbeamt"},{"id":"WI-21","pts":3,"type":"mc","text":"У минулому фінансовому році Eltron GmbH отримала менший прибуток, ніж очікувалося. Визначте, яка причина може бути релевантною!","options":["1. Попит на логістичні послуги був більшим, ніж очікувалося.","2. Економічний розвиток у галузі відповідав позитивному прогнозу.","3. Заплановане підвищення цін не вдалося реалізувати відповідно до плану.","4. Прострочені кредити було замінено кредитами з нижчими відсотками.","5. Заходи з раціоналізації привели до зниження витрат у комерційному складському господарстві."],"correct":"3","exp":"🇺🇦 Шукай ЄДИНУ опцію, яка пояснює МЕНШИЙ прибуток. Решта варіантів означають покращення чи нейтральність.","hint":"💡 Більший попит, позитивний прогноз, нижчі відсотки, зниження витрат — все це ПОЗИТИВНО для прибутку. Що єдине негативне?","ans":"3. Angestrebte Preiserhöhungen konnten nicht wie geplant umgesetzt werden."},{"id":"WI-22","pts":3,"type":"mc","text":"Eltron GmbH з екологічних причин розглядає відповідні заходи для зменшення споживання матеріалів. Визначте, який захід підходить для Eltron GmbH!","options":["1. Парковки Eltron GmbH надалі повністю освітлюватимуться і вночі.","2. Eltron GmbH переходить на дешевшого постачальника електроенергії.","3. У всіх відділах запроваджується обов'язкове сортування сміття.","4. Для прибирання побутових приміщень надалі додатково використовуватимуться біорозкладні засоби.","5. Циркуляри надалі не друкуватимуться, а надсилатимуться електронною поштою."],"correct":"5","exp":"🇺🇦 Питання саме про зменшення СПОЖИВАННЯ МАТЕРІАЛІВ (Materialverbrauch), а не енергії чи екології в цілому. Яка опція безпосередньо економить матеріал?","hint":"💡 Освітлення, постачальник струму, миючі засоби — не про матеріал. Mülltrennung — про сортування, не зменшення. Що конкретно ЗМЕНШУЄ використання паперу?","ans":"5. Rundschreiben werden künftig nicht mehr ausgedruckt, sondern per E-Mail verschickt."},{"id":"WI-23","pts":3,"type":"mc","text":"Учениця Melissa Kamp купує холодильник «Eisbär XL» за акційною ціною 595,00 €. Розпаковуючи, пані Kamp виявляє на правій зовнішній стороні глибоку подряпину довжиною 1,50 м. Визначте, який тут дефект!","options":["1. Дефект кількості (Quantität)","2. Дефект ідентичності (Identität)","3. Дефект надійності","4. Дефект якості виконання (Beschaffenheit)","5. Дефект якості (Qualität)"],"correct":"4","exp":"🇺🇦 Подряпина — це дефект ЯКОЇ категорії? Це не про кількість, не про \"не той товар\" — це про фізичний СТАН (Beschaffenheit) самого продукту.","hint":"💡 Beschaffenheit = фізичні властивості/стан товару (зовнішній вигляд, цілісність поверхні).","ans":"4. Ein Mangel in der Beschaffenheit"},{"id":"WI-24","pts":3,"type":"mc","text":"Пані Kamp дуже незадоволена пошкодженим холодильником і хоче скористатися правами через цей дефект. Визначте право, яким пані Kamp може скористатися НЕГАЙНО!","options":["1. Вимагати повернення грошей за товар","2. Право на Nacherfüllung (усунення недоліків)","3. Вимагати відшкодування збитків через навмисне пошкодження холодильника","4. Відмовитися від договору купівлі-продажу (Rücktritt)","5. Відкликати договір купівлі-продажу, оскільки це дистанційний договір (Fernabsatzvertrag)"],"correct":"2","exp":"🇺🇦 При дефекті товару покупець спочатку має право на Nacherfüllung (усунення дефекту) — це ПЕРШИЙ крок за законом, перш ніж можна вимагати інше.","hint":"💡 Rücktritt, Kaufpreis zurückfordern, Schadenersatz — всі ці права доступні лише ПІСЛЯ невдалої Nacherfüllung. Яке право можна вимагати одразу?","ans":"2. Das Recht auf Nacherfüllung"},{"id":"WI-25","pts":4,"type":"open","text":"Пані Kamp і продавець електротоварів домовляються про зниження ціни на 20 %. Визначте нову ціну продажу брутто, яку продавець вкаже в новому рахунку для пані Kamp! (Початкова ціна: 595,00 € з ПДВ)","exp":"🇺🇦 Простий розрахунок зниження ціни на 20%. Знайди новий брутто-ціну (з ПДВ).","hint":"💡 595,00 € × (100% − 20%) = 595,00 € × 0,80 = ?","ans":"595,00 € × 0,80 = 476,00 € (neuer Bruttoverkaufspreis)"},{"id":"WI-26","pts":3,"type":"mc","text":"Держава в соціальній ринковій економіці впливає на господарське життя численними заходами. Визначте, у якому державному заході є порушення закону!","options":["1. Держава спрощує можливості податкової амортизації для підприємств.","2. Держава підвищує неоподатковуваний мінімум для прибуткового податку.","3. Держава надає субсидії підприємствам у структурно слабких регіонах.","4. Держава втручається в тарифні переговори профспілок і роботодавців.","5. Держава розміщує державні замовлення."],"correct":"4","exp":"🇺🇦 У соціальній ринковій економіці є принцип Tarifautonomie (автономії переговорів про зарплату) — держава НЕ МАЄ ПРАВА втручатись у ці переговори.","hint":"💡 Subventionen, Steuererleichterungen, öffentliche Aufträge — нормальні державні інструменти. Втручання в Tarifverhandlungen порушує конституційний принцип Tarifautonomie.","ans":"4. Der Staat greift in die Tarifverhandlungen der Gewerkschaften und Arbeitgeber ein. (Verstößt gegen die grundgesetzlich geschützte Tarifautonomie.)"},{"id":"WI-27","pts":3,"type":"mc","text":"Приватні домогосподарства отримують трансфертні виплати від держави. Наведіть приклад цього!","options":["1. Земля Гессен частково фінансує будівництво громадського спортивного об'єкта.","2. Пенсіонер дарує онуку 50,00 € на день народження.","3. Співробітник Eltron GmbH сплачує транспортний податок за свій приватний автомобіль.","4. Ви безкоштовно допомагаєте три години на тиждень у будинку для літніх людей.","5. Співробітниця Eltron GmbH отримує допомогу на дітей (Kindergeld) на своїх двох дітей."],"correct":"5","exp":"🇺🇦 Transferzahlung = виплата ВІД держави ДО приватної особи без зустрічної послуги (не зарплата за роботу). Яка з опцій — саме така виплата?","hint":"💡 Sportanlage = державні витрати, не трансфер особі. Кfz-Steuer = податок (протилежний напрямок). Kindergeld — класичний приклад трансферу від держави сім'ї.","ans":"5. Eine Mitarbeiterin der Eltron GmbH erhält Kindergeld für ihre zwei Kinder."},{"id":"WI-28","pts":3,"type":"mc","text":"Наведене зображення частково інформує про фази економічного циклу (піднесення/експансія → пік → спад/рецесія → найнижча точка/депресія → нове піднесення). Яке твердження можна зробити на основі зображення?","options":["1. У фазі експансії продажі знижуються.","2. У фазі рецесії виробництво зростає.","3. У фазі піку робоча сила затребувана.","4. У фазі рецесії завантаженість потужностей зростає.","5. У фазі депресії безробіття перебуває на найнижчому рівні."],"correct":"3","exp":"🇺🇦 Конʼюнктурний цикл: Hochkonjunktur (пік) — характеризується високим попитом на робочу силу. Перевір логіку кожного твердження проти діаграми.","hint":"💡 Expansionsphase: продажі РОСТУТЬ (не падають). Rezession: виробництво ЗМЕНШУЄТЬСЯ. Hochkonjunktur: \"Arbeitskräfte gesucht\" — прямо на діаграмі.","ans":"3. In der Hochkonjunktur sind Arbeitskräfte gesucht."},{"id":"WI-29","pts":3,"type":"mc","text":"Держава може проводити різні заходи кон'юнктурної політики. Перевірте, у якому випадку захід і мета відповідають одне одному!","options":["1. Підвищенням державних видатків прагнуть стримати кон'юнктуру.","2. Підвищенням субсидій прагнуть стимулювати інвестиційну активність підприємств.","3. Підвищенням прибуткового податку прагнуть стимулювати приватний попит.","4. Заощадженнями в державних бюджетах прагнуть підтримати економічне піднесення.","5. Підвищенням стандартної ставки ПДВ прагнуть пожвавити кон'юнктуру."],"correct":"2","exp":"🇺🇦 Конʼюнктурна політика: яка комбінація \"захід → мета\" логічно правильна (захід РЕАЛЬНО досягає заявленої мети)?","hint":"💡 Вищі держвидатки СТИМУЛЮЮТЬ (не гальмують) кон'юнктуру. Вищий податок ЗМЕНШУЄ попит (не сприяє). Субсидії дійсно стимулюють інвестиції — правильна пара.","ans":"2. Durch Erhöhung der Subventionen wird beabsichtigt, die Investitionstätigkeit der Unternehmen anzuregen."},{"id":"WI-30","pts":3,"type":"mc","text":"Грошову масу в зоні євро потрібно збільшити. Хто може практично реалізувати цей захід?","options":["1. Всесвітній банк","2. Deutsche Bundesbank","3. Європейський центральний банк","4. Міністри фінансів зони євро","5. Глави урядів країн зони євро"],"correct":"3","exp":"🇺🇦 Хто контролює грошову масу в зоні Євро? Яка інституція має повноваження для монетарної політики?","hint":"💡 EZB (Europäische Zentralbank) — єдина установа з повноваженнями монетарної політики в Eurozone, не національні центробанки чи уряди.","ans":"3. Die Europäische Zentralbank (EZB)"}]}};

// ===== RENDER =====
function goGroup(group, btn){
  // Скидаємо всі nav-btn
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));

  const subSection = document.getElementById('subSection');

  if(group === 'lagerlogistik'){
    document.getElementById('nb_lager').classList.add('on');
    if(subSection) subSection.style.display = '';
    // Активуємо першу підвкладку
    const firstSub = document.querySelector('#subTabs .nav-btn');
    if(firstSub){
      document.querySelectorAll('#subTabs .nav-btn').forEach(b=>b.classList.remove('on'));
      firstSub.classList.add('on');
    }
    goTab('a1', null);

  } else if(group === 'guterumschlag'){
    document.getElementById('nb_guter').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('a5', null);

  } else if(group === 'wiso'){
    document.getElementById('nb_wiso').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('a6', null);

  } else if(group === 'voice'){
    document.getElementById('nb_voice').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    renderVoiceTrainer();
    return;

  } else if(group === 'vocab'){
    document.getElementById('nb_vocab').classList.add('on');
    if(subSection) subSection.style.display = 'none';
    goTab('vocab', null);
  }
}

function goTab(tab, btn){
  curTab=tab;
  if(btn){
    document.querySelectorAll('#subTabs .nav-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
  if(tab==='vocab'){ renderVocabPage(); return; }
  renderAufgabe(DATA[tab]);
  updateProgress();
}

function renderAufgabe(auf){
  renderSidebar(auf);
  const el=document.getElementById('content');
  const examBtn = (curTab==='a5' || curTab==='a6')
    ? `<div class="exam-launch-box">
        <div class="elb-text">
          <div class="elb-title">🎯 Режим реального екзамену</div>
          <div class="elb-sub">Таймер · без підказок · без пояснень · результат в кінці</div>
        </div>
        <button class="btn" style="background:#dc2626;color:#fff;font-weight:700;white-space:nowrap" onclick="startExamMode('${curTab}')">▶ Почати екзамен</button>
      </div>`
    : '';
  el.innerHTML=`<div class="sit-box"><div class="sit-lbl">📋 Situation — ${auf.label}</div>${auf.sit}</div>`
    + examBtn
    +auf.qs.map(q=>renderCard(q)).join('');
  el.scrollTop=0;
  setTimeout(function(){ makeWordsClickable(el); }, 100);
}


function renderSidebar(auf){
  const el=document.getElementById('sidebar');
  el.innerHTML=`<div class="sb-label">${auf.label.split('—')[0].trim()}</div>`
    +auf.qs.map(q=>`
    <div class="sb-item ${done.has(q.id)?'done':''}" onclick="scrollQ('qc_${q.id.replace(/\./g,'_')}')">
      <span class="sb-num">${q.id}</span>
      <span class="sb-name">${q.text.replace(/<[^>]+>/g,'').substring(0,28)}…</span>
      <span class="sb-dot"></span>
      <span class="sb-pts">${q.pts}P</span>
    </div>`).join('');
}

function renderCard(q){
  const id=q.id.replace(/\./g,'_');
  const isMC = q.type === 'mc';
  const isMultiselect = q.type === 'multiselect';
  const isZuordnung = !!q.correctMulti;

  let answerInput;
  if(isZuordnung){
    const terms = Object.keys(q.correctMulti);
    answerInput = `<div class="zuord-wrap" id="zwrap_${id}">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">👉 Обери категорію для кожного терміна:</div>
      ${terms.map((term,ti)=>`
        <div class="zuord-row">
          <div class="zuord-term">${term}</div>
          <div class="zuord-opts" data-term="${term}">
            ${q.options.map(opt=>{
              const val = opt.split('.')[0].trim();
              return `<button type="button" class="zuord-btn" data-val="${val}" onclick="selectZuord('${id}','${term.replace(/'/g,"\'")}','${val}',this)">${opt}</button>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  } else if(isMultiselect){
    answerInput = `<div class="mc-options" id="mswrap_${id}">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">👉 Обери ВСІ правильні варіанти (можна кілька):</div>
      ${q.options.map((opt,i)=>`<button type="button" class="mc-opt" data-val="${opt.split('.')[0].trim()}" onclick="toggleMultiselect('${id}', this)">${opt}</button>`).join('')}
    </div>`;
  } else if(isMC){
    answerInput = `<div class="mc-options" id="mcwrap_${id}">
      ${q.options.map((opt,i)=>`<button type="button" class="mc-opt" data-val="${opt.split('.')[0].trim()}" onclick="selectMC('${id}', this)">${opt}</button>`).join('')}
    </div>`;
  } else {
    answerInput = `<div class="ans-area"><textarea id="ta_${id}" placeholder="Schreibe hier deine Antwort... / Пиши тут..."></textarea></div>`;
  }

  return `<div class="qcard" id="qc_${id}">
    <div class="qcard-top">
      <div>
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <span class="qbadge">${q.id}</span>
          <span class="qpts">⭐ ${q.pts} бал${q.pts>1?'ів':''}</span>
          ${isZuordnung ? '<span class="qpts" style="color:#a78bfa">🔗 Зіставлення</span>' : (isMultiselect ? '<span class="qpts" style="color:#a78bfa">☑️ Множинний вибір</span>' : (isMC ? '<span class="qpts" style="color:#a78bfa">🔘 Тестове питання</span>' : ''))}
        </div>
        <div class="qtext selectable">${q.text}</div>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-exp" onclick="tog('eb_${id}')">💡 Пояснення</button>
      <button class="btn btn-hint" onclick="tog('hb_${id}')">🔍 Підказка</button>
    </div>
    <div class="exp-box" id="eb_${id}">${q.exp}</div>
    <div class="hint-box" id="hb_${id}">${q.hint}</div>
    ${answerInput}
    <div class="btns" style="margin-top:8px">
      <button class="btn btn-check" onclick="check('${q.id}','${id}',${q.pts})">🤖 AI перевіряє</button>
      <button class="btn" style="background:#1a0d2e;color:#a78bfa;border:1px solid #2d1a4a" onclick="showAnswer('${id}','${q.id}')">📖 Правильна відповідь</button>
      <button class="btn btn-clr" onclick="clearQ('${id}')">✕ Очистити</button>
    </div>
    <div class="ai-res" id="correct_${id}" style="display:none;background:#0f0f2e;border:1px solid #3730a3;color:#c4b5fd"></div>
    <div class="ai-loading" id="ld_${id}">⏳ AI аналізує...</div>
    <div class="ai-res" id="ar_${id}"></div>
  </div>`;
}

function selectMC(id, btn){
  const wrap = document.getElementById('mcwrap_'+id);
  wrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  wrap.dataset.selected = btn.dataset.val;
}

function selectZuord(id, term, val, btn){
  const row = btn.closest('.zuord-opts');
  row.querySelectorAll('.zuord-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  row.dataset.selectedVal = val;
}

function toggleMultiselect(id, btn){
  btn.classList.toggle('selected');
}

function tog(id){document.getElementById(id).classList.toggle('on')}

function showAnswer(id, qid){
  const el = document.getElementById('correct_'+id);
  if(el.style.display === 'block'){
    el.style.display = 'none';
    return;
  }
  // знаходимо питання
  let q = null;
  for(const key of Object.keys(DATA)){
    if(DATA[key].qs){
      const found = DATA[key].qs.find(x=>x.id===qid);
      if(found){ q=found; break; }
    }
  }
  if(!q) return;
  const ansHtml = q.ans.includes('<table') ? q.ans : q.ans.replace(/\n/g,'<br>'); el.innerHTML = '<div class="ai-lbl">📖 Правильна відповідь</div>' + ansHtml;
  el.style.display = 'block';
}
function scrollQ(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function clearQ(id){
  const ta = document.getElementById('ta_'+id);
  if(ta) ta.value='';
  const mcWrap = document.getElementById('mcwrap_'+id);
  if(mcWrap){
    mcWrap.dataset.selected = '';
    mcWrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  }
  const msWrap = document.getElementById('mswrap_'+id);
  if(msWrap){
    msWrap.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
  }
  const zWrap = document.getElementById('zwrap_'+id);
  if(zWrap){
    zWrap.querySelectorAll('.zuord-opts').forEach(o=>{ o.dataset.selectedVal=''; });
    zWrap.querySelectorAll('.zuord-btn').forEach(b=>b.classList.remove('selected'));
  }
  const ar=document.getElementById('ar_'+id);
  ar.className='ai-res';ar.innerHTML='';
  const correctBox = document.getElementById('correct_'+id);
  if(correctBox){ correctBox.style.display='none'; }
}

async function check(qid,id,pts){
  const aufgabe=DATA[curTab];
  const q=aufgabe.qs.find(x=>x.id===qid);
  // Збираємо відповідь: Zuordnung, Multiselect, MC вибір, textarea, або contenteditable таблиця
  let userAns = '';
  const zWrap = document.getElementById('zwrap_'+id);
  const msWrap = document.getElementById('mswrap_'+id);
  const mcWrap = document.getElementById('mcwrap_'+id);
  if(zWrap){
    const pairs = [];
    zWrap.querySelectorAll('.zuord-opts').forEach(o=>{
      const term = o.dataset.term;
      const val = o.dataset.selectedVal || '(не обрано)';
      pairs.push(`${term} → ${val}`);
    });
    userAns = pairs.join('\n');
  } else if(msWrap){
    const selected = Array.from(msWrap.querySelectorAll('.mc-opt.selected')).map(b=>b.dataset.val);
    userAns = selected.length ? selected.join(', ') : '';
  } else if(mcWrap){
    userAns = mcWrap.dataset.selected || '';
  } else {
    const taEl = document.getElementById('ta_'+id);
    if(taEl) userAns = taEl.value.trim();
  }
  // Якщо є contenteditable поля в картці — збираємо їх теж
  const qcard = document.getElementById('qc_'+id);
  if(qcard){
    const editCells = qcard.querySelectorAll('[contenteditable]');
    if(editCells.length > 0){
      const tableAns = [];
      qcard.querySelectorAll('tr').forEach(row => {
        const label = row.querySelector('td:not([contenteditable])');
        const val = row.querySelector('[contenteditable]');
        if(label && val && val.textContent.trim()){
          tableAns.push(label.textContent.trim() + ' ' + val.textContent.trim());
        }
      });
      if(tableAns.length > 0) userAns = tableAns.join('\n') + (userAns ? '\n' + userAns : '');
    }
  }
  if(!userAns){alert('Вибери відповідь або заповни поле!');return;}
  const ld=document.getElementById('ld_'+id);
  const ar=document.getElementById('ar_'+id);
  ld.classList.add('on'); ar.className='ai-res';
  const prompt=`Du bist ein strenger aber fairer IHK-Prüfer für Fachkraft für Lagerlogistik.

Frage ${qid} (${pts} Punkte): ${q.text.replace(/<[^>]+>/g,'')}
Musterlösung: ${q.ans}
Antwort des Prüflings: ${userAns}

Antworte auf Ukrainisch kurz und klar:
1. Beginne mit ✅ Richtig / ⚠️ Teilweise richtig / ❌ Falsch
2. Was war gut (1-2 Sätze)
3. Was fehlt oder ist falsch (1-2 Sätze)

function examStats(qs){
  let pts=0, mc=0, open=0, zuord=0;
  qs.forEach(q=>{
    pts += q.pts || 0;
    if(q.correctMulti) zuord++;
    else if(q.type==='mc' || q.type==='multiselect') mc++;
    else open++;
  });
  return { count: qs.length, pts, mc, open, zuord };
}

function makeWordsClickable(container){
  if(!container) return;
  container.querySelectorAll('.qtext, .exp-box, .hint-box, .sit-box p, .sit-box td, .ai-res').forEach(function(el){
    if(el.dataset.wc) return;
    el.dataset.wc = '1';
    el.addEventListener('click', function(e){
      // Слово під курсором
      let word = '';
      const range = document.caretRangeFromPoint
        ? document.caretRangeFromPoint(e.clientX, e.clientY)
        : (document.caretPositionFromPoint
            ? (function(){ const p=document.caretPositionFromPoint(e.clientX,e.clientY); if(!p) return null; const r=document.createRange(); r.setStart(p.offsetNode,p.offset); return r; })()
            : null);
      if(range){
        range.expand('word');
        word = range.toString().trim().replace(/[.,!?;:()\[\]{}'"«»\n\r]/g,'').trim();
      }
      if(word.length > 1 && word.length < 60){
        showWordPopup(word, e.clientX, e.clientY);
      }
    });
  });
}

function showWordPopup(word, x, y){
  // Видаляємо старий попап
  const old = document.getElementById('word-popup');
  if(old) old.remove();

  const popup = document.createElement('div');
  popup.id = 'word-popup';
  popup.style.cssText = `
    position:fixed;z-index:9999;
    background:#1a1d2e;border:2px solid var(--gold);border-radius:12px;
    padding:14px 16px;min-width:200px;max-width:280px;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
    left:${Math.min(x, window.innerWidth-300)}px;
    top:${Math.min(y+10, window.innerHeight-150)}px;
  `;

  popup.innerHTML = `
    <div style="color:var(--gold);font-weight:700;font-size:15px;margin-bottom:4px">${word}</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px" id="popup-trans">🔄 Перекладаємо...</div>
    <div style="display:flex;gap:8px">
      <button onclick="addWordFromPopup('${word.replace(/'/g,"\'")}')" style="flex:1;background:var(--green);color:#000;border:none;border-radius:7px;padding:7px;font-weight:700;cursor:pointer;font-size:13px">+ Словник</button>
      <button onclick="document.getElementById('word-popup').remove()" style="background:var(--s3);color:var(--muted);border:none;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:16px">✕</button>
    </div>
  `;

  document.body.appendChild(popup);

  // Закриваємо при кліку поза попапом
  setTimeout(()=>{
    document.addEventListener('click', function handler(e){
      if(!popup.contains(e.target)){ popup.remove(); document.removeEventListener('click',handler); }
    });
  }, 100);

  // Переклад через Gemini API
  fetch('/api/gemini', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':window.ANTHROPIC_KEY||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({prompt:`Перекладай одне слово або фразу з німецької на українську. Відповідай ТІЛЬКИ перекладом, без пояснень, без лапок. Слово: "${word}"`})

  }).catch(()=>{
    const el = document.getElementById('popup-trans');

  });
}

// ===== EXAM MODE (ізольований модуль, не зачіпає звичайний режим) =====
let examState = null; // {tab, qs, answers:{}, idx, timeLeft, timerInterval, durationSec}

function startExamMode(tab){
  const auf = DATA[tab];
  if(!auf) return;
  const durationSec = tab === 'a5' ? 90*60 : 60*60; // Güterumschlag 90 Min, WiSo 60 Min
  examState = {
    tab,
    qs: auf.qs,
    answers: {},
    idx: 0,
    timeLeft: durationSec,
    durationSec,
    timerInterval: null,
    finished: false
  };
  document.getElementById('examHdrTitle').textContent = tab === 'a5' ? '🎯 Екзамен: Güterumschlag' : '🎯 Екзамен: WiSo';
  document.getElementById('examOverlay').classList.add('show');
  renderExamDots();
  renderExamQuestion();
  startExamTimer();
}

function startExamTimer(){
  updateExamTimerDisplay();
  examState.timerInterval = setInterval(()=>{
    examState.timeLeft--;
    updateExamTimerDisplay();
    if(examState.timeLeft <= 0){
      clearInterval(examState.timerInterval);
      finishExam(true);
    }
  }, 1000);
}

function updateExamTimerDisplay(){
  const t = document.getElementById('examTimer');
  const m = Math.floor(examState.timeLeft/60);
  const s = examState.timeLeft%60;
  t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  t.className = 'exam-timer';
  if(examState.timeLeft <= 300) t.classList.add('danger');
  else if(examState.timeLeft <= 600) t.classList.add('warn');
}

function renderExamDots(){
  const el = document.getElementById('examDots');
  el.innerHTML = examState.qs.map((q,i)=>{
    const answered = examState.answers[q.id] !== undefined;
    const isCurrent = i === examState.idx;
    return `<div class="exam-dot ${answered?'answered':''} ${isCurrent?'current':''}" onclick="goToExamQuestion(${i})">${i+1}</div>`;
  }).join('');
}

function goToExamQuestion(i){
  examState.idx = i;
  renderExamQuestion();
  renderExamDots();
}

function renderExamQuestion(){
  const q = examState.qs[examState.idx];
  const id = q.id;
  document.getElementById('examProgress').textContent = `Питання ${examState.idx+1} / ${examState.qs.length}`;

  let bodyHtml = `<div class="exam-q-card">
    <div class="exam-q-num">${q.id} · ${q.pts} бал${q.pts>1?'ів':''}</div>
    <div class="exam-q-text">${q.text}</div>`;

  const savedAns = examState.answers[id];

  if(q.correctMulti){
    // Zuordnung/Reihenfolge - кожен термін окремо
    const terms = Object.keys(q.correctMulti);
    bodyHtml += terms.map(term => {
      const savedForTerm = savedAns && savedAns[term];
      return `<div style="margin-bottom:14px">
        <div style="font-weight:600;color:#fff;margin-bottom:8px;font-size:13px">${term}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${q.options.map(opt=>{
            const val = opt.split('.')[0].trim();
            const sel = savedForTerm === val ? 'selected' : '';
            return `<button type="button" class="exam-opt ${sel}" style="width:auto;flex:1;min-width:120px" onclick="examSelectZuord('${term.replace(/'/g,"\\'")}','${val}')">${opt}</button>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  } else if(q.type === 'multiselect'){
    const savedArr = savedAns || [];
    bodyHtml += q.options.map(opt=>{
      const val = opt.split('.')[0].trim();
      const sel = savedArr.includes(val) ? 'selected' : '';
      return `<button type="button" class="exam-opt ${sel}" onclick="examToggleMultiselect('${val}')">${opt}</button>`;
    }).join('');
  } else if(q.type === 'mc'){
    bodyHtml += q.options.map(opt=>{
      const val = opt.split('.')[0].trim();
      const sel = savedAns === val ? 'selected' : '';
      return `<button type="button" class="exam-opt ${sel}" onclick="examSelectMC('${val}')">${opt}</button>`;
    }).join('');
  } else {
    // open question
    bodyHtml += `<textarea id="examOpenAnswer" style="width:100%;min-height:100px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:12px;font-family:'Inter',sans-serif;font-size:14px" placeholder="Schreibe deine Antwort..." oninput="examSaveOpenAnswer(this.value)">${savedAns||''}</textarea>`;
  }

  bodyHtml += `</div>`;
  document.getElementById('examBody').innerHTML = bodyHtml;

  const nav = document.getElementById('examNav');
  const isLast = examState.idx === examState.qs.length - 1;
  nav.innerHTML = `
    <button class="exam-btn-prev" onclick="examPrev()" ${examState.idx===0?'disabled style="opacity:.4"':''}>← Назад</button>
    ${isLast
      ? `<button class="exam-btn-finish" onclick="confirmFinishExam()">✓ Здати екзамен</button>`
      : `<button class="exam-btn-next" onclick="examNext()">Далі →</button>`}
  `;
}

function examSelectMC(val){
  const q = examState.qs[examState.idx];
  examState.answers[q.id] = val;
  renderExamQuestion();
  renderExamDots();
}

function examToggleMultiselect(val){
  const q = examState.qs[examState.idx];
  if(!examState.answers[q.id]) examState.answers[q.id] = [];
  const arr = examState.answers[q.id];
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  renderExamQuestion();
  renderExamDots();
}

function examSelectZuord(term, val){
  const q = examState.qs[examState.idx];
  if(!examState.answers[q.id]) examState.answers[q.id] = {};
  examState.answers[q.id][term] = val;
  renderExamQuestion();
  renderExamDots();
}

function examSaveOpenAnswer(val){
  const q = examState.qs[examState.idx];
  examState.answers[q.id] = val;
  // не перерендерюємо щоб не втратити фокус/курсор
  renderExamDots();
}

function examPrev(){
  if(examState.idx > 0){ examState.idx--; renderExamQuestion(); renderExamDots(); }
}
function examNext(){
  if(examState.idx < examState.qs.length-1){ examState.idx++; renderExamQuestion(); renderExamDots(); }
}

function confirmFinishExam(){
  const answered = Object.keys(examState.answers).length;
  const total = examState.qs.length;
  if(answered < total){
    const ok = confirm(`Ти відповів на ${answered} з ${total} питань. Точно завершити екзамен?`);
    if(!ok) return;
  }
  finishExam(false);
}

function finishExam(timeUp){
  if(examState.timerInterval) clearInterval(examState.timerInterval);
  examState.finished = true;

  // Підрахунок балів
  let earnedPts = 0;
  let totalPts = 0;
  let correctCount = 0;
  let answeredCount = 0;

  examState.qs.forEach(q=>{
    totalPts += q.pts;
    const ans = examState.answers[q.id];
    if(ans === undefined || (Array.isArray(ans) && ans.length===0) || (typeof ans==='object' && !Array.isArray(ans) && Object.keys(ans).length===0)) return;
    answeredCount++;

    if(q.correctMulti){
      // перевіряємо чи ВСІ терміни правильні
      const allCorrect = Object.keys(q.correctMulti).every(term => ans[term] === q.correctMulti[term]);
      if(allCorrect){ earnedPts += q.pts; correctCount++; }
    } else if(q.type === 'multiselect'){
      // для multiselect просто рахуємо як "відповів" - бали оцінюються приблизно (бо нема єдиного correct)
      // ставимо часткові бали якщо щось вибрано
      earnedPts += q.pts * 0.5; // консервативна оцінка
    } else if(q.type === 'mc'){
      if(ans === q.correct){ earnedPts += q.pts; correctCount++; }
    }
    // open питання не можна автоматично перевірити - не додаємо бали автоматично
  });

  const pct = totalPts > 0 ? (earnedPts/totalPts*100) : 0;
  const passed = pct >= 50;

  const examName = examState.tab === 'a5' ? 'Güterumschlag' : 'WiSo';
  const timeUsed = examState.durationSec - examState.timeLeft;
  const minUsed = Math.floor(timeUsed/60);

  document.getElementById('examHdrTitle').textContent = `🏁 Результат: ${examName}`;
  document.getElementById('examProgress').textContent = '';
  document.getElementById('examTimer').style.display = 'none';
  document.getElementById('examDots').innerHTML = '';
  document.getElementById('examNav').innerHTML = `<button class="exam-btn-next" onclick="closeExamMode()">Закрити</button>`;

  document.getElementById('examBody').innerHTML = `
    <div class="exam-result">
      <div class="exam-result-badge">${passed ? '✅' : '❌'}</div>
      <div class="exam-result-title ${passed?'pass':'fail'}">${passed ? 'ЗДАВ!' : 'НЕ ЗДАВ'}</div>
      <div class="exam-result-score">${pct.toFixed(1)}%</div>
      <div class="exam-result-sub">${earnedPts.toFixed(1)} з ${totalPts} балів ${timeUp ? '· ⏰ час вийшов' : ''}</div>
      <div class="exam-result-bar"><div class="exam-result-fill" style="width:${Math.min(pct,100)}%;background:${passed?'var(--green)':'#dc2626'}"></div></div>
      <div class="exam-result-stats">
        <div class="exam-result-stat"><div class="ers-num">${correctCount}</div><div class="ers-lbl">Правильних (MC/Zuordnung)</div></div>
        <div class="exam-result-stat"><div class="ers-num">${answeredCount}/${examState.qs.length}</div><div class="ers-lbl">Дано відповідей</div></div>
        <div class="exam-result-stat"><div class="ers-num">${minUsed} хв</div><div class="ers-lbl">Витрачено часу</div></div>
        <div class="exam-result-stat"><div class="ers-num">${pct>=50?'≥50%':'<50%'}</div><div class="ers-lbl">Прохідний бал</div></div>
      </div>
      <p style="font-size:11px;color:var(--muted);line-height:1.6">⚠️ Відкриті питання (Rechenaufgaben/Текст) не перевіряються автоматично — використовуй звичайний режим з AI-перевіркою щоб дізнатись точний бал по них.</p>
    </div>`;
}

function closeExamMode(){
  document.getElementById('examOverlay').classList.remove('show');
  document.getElementById('examTimer').style.display = '';
  examState = null;
}

    <div class="vt-dots">${dots}</div>
    <div class="vt-card" id="vtCard">
      <div class="vt-card-lbl">❓ Aufgabe ${q.id}</div>
      <div class="vt-pts">⭐ ${q.pts} бал${q.pts!==1?'ів':''}</div>
      <div class="vt-qtext">${q.text}</div>
      <textarea id="vtTextInput"
        placeholder="🎤 Говори через Samsung клавіатуру або пиши тут..."
        rows="4"
        style="width:100%;background:var(--s2);border:2px solid var(--acc);border-radius:10px;color:var(--text);padding:12px;font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;resize:none;margin-bottom:10px"
        oninput="vtHandleInput(this.value)"
      ></textarea>
      <button class="vt-mic-btn" id="vtCheckBtn" onclick="vtCheckFromInput()" disabled style="opacity:.5">
        🤖 AI перевіряє відповідь
      </button>
      <div class="vt-ai-result" id="vtAi" style="display:none"></div>
      <div class="vt-answer-box" id="vtAns">${(q.ans||q.a||'').replace(/\n/g,'<br>')}</div>
      <div class="vt-btns" id="vtBtns" style="display:none">
        <button class="vt-btn vt-btn-ans" onclick="document.getElementById('vtAns').classList.toggle('show')">📖 Відповідь</button>
        <button class="vt-btn vt-btn-no" onclick="vtMark(false)">✗ Не знав</button>
        <button class="vt-btn vt-btn-ok" onclick="vtMark(true)">✓ Знав</button>
      </div>
    </div>`;
}
function vtHandleInput(val){
  const btn = document.getElementById('vtCheckBtn');
  if(btn) btn.style.opacity = val.trim() ? '1' : '0.5';
  if(btn) btn.disabled = !val.trim();
}

function vtCheckFromInput(){
  const ta = document.getElementById('vtTextInput');
  if(!ta || !ta.value.trim()) return;
  vtCheck(ta.value.trim());
}

function vtToggle(){vtRecording?vtStop():vtStart();}
function vtStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Потрібен Chrome!');return;}
  vtRecognition=new SR();vtRecognition.lang='de-DE';
  vtRecognition.continuous=true;vtRecognition.interimResults=true;
  const btn=document.getElementById('vtMicBtn'),tr=document.getElementById('vtTr');
  btn.className='vt-mic-btn recording';btn.innerHTML='⏹ Зупинити';vtRecording=true;
  vtRecognition.onresult=e=>{
    let fin='',int='';
    for(let i=e.resultIndex;i<e.results.length;i++)
      e.results[i].isFinal?fin+=e.results[i][0].transcript:int+=e.results[i][0].transcript;
    tr.textContent=fin||int;tr.className='vt-transcript active';vtTranscript=fin||int;
  };
  vtRecognition.onerror=()=>vtStop();
  vtRecognition.onend=()=>{if(vtRecording)vtStop();};
  vtRecognition.start();
}
function vtStop(){
  vtRecording=false;if(vtRecognition)vtRecognition.stop();
  const btn=document.getElementById('vtMicBtn');
  btn.className='vt-mic-btn';btn.innerHTML='🎤 Говорити знову';
  if(vtTranscript&&vtTranscript.trim())vtCheck(vtTranscript);
}
async function vtCheck(ans){
  const qs=getVtQuestions(vtDay),q=qs[vtIdx];
  const ai=document.getElementById('vtAi'),btns=document.getElementById('vtBtns');
  ai.style.display='block';ai.className='vt-ai-result loading';ai.textContent='⏳ AI перевіряє...';
  const prompt=`Du bist ein IHK-Prüfer für Lagerlogistik.
Frage: ${q.text}
Musterlösung: ${q.ans||q.a||''}
Antwort des Lernenden: ${ans}
Bewerte kurz auf Ukrainisch (2-3 Sätze): beginne mit ✅ Richtig! oder ❌ Nicht vollständig. Was war gut? Was fehlte?`;
  try{
    const r=await fetch('/api/gemini',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const d=await r.json();
    const t=d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    if(!t) throw new Error('empty');
    ai.className='vt-ai-result '+(t.includes('✅')?'correct':'wrong');
    ai.innerHTML=t+'<div id="vtDialogArea" style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px"></div>';
    vtShowDialogInput(q, ans, t);
  }catch(e){
    ai.className='vt-ai-result wrong';
    ai.textContent='Помилка AI. Перевір відповідь вручну.';
  }
  btns.style.display='flex';
}

function vtShowDialogInput(q, userAns, prevResponse){
  const area = document.getElementById('vtDialogArea');
  if(!area) return;
  area.innerHTML=`
    <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px">💬 Запитай AI далі:</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <button onclick="vtAskFollowup(this,'Як правильно відповісти на це питання?')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif">Як правильно?</button>
      <button onclick="vtAskFollowup(this,'Що саме я пропустив у своїй відповіді?')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif">Що пропустив?</button>
      <button onclick="vtAskFollowup(this,'Наведи приклад ідеальної відповіді')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif">Ідеальна відповідь</button>
    </div>
    <div style="display:flex;gap:6px">
      <textarea id="vtFollowupInput" placeholder="Або напиши своє питання..." rows="2"
        style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:8px;font-size:13px;font-family:Inter,sans-serif;resize:none"></textarea>
      <button onclick="vtSendFollowup()" style="background:#4f7fff;border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap">→ Надіслати</button>
    </div>
    <div id="vtFollowupResp" style="margin-top:10px;font-size:13px;line-height:1.7;color:#86efac;white-space:pre-wrap"></div>`;

  // Зберігаємо контекст для діалогу
  window.vtDialogCtx = {
    question: q.text,
    correctAnswer: q.ans||q.a||'',
    userAnswer: userAns,
    lastResponse: prevResponse
  };
}

async function vtAskFollowup(btn, text){
  document.getElementById('vtFollowupInput').value = text;
  vtSendFollowup();
}

async function vtSendFollowup(){
  const input = document.getElementById('vtFollowupInput');
  const resp = document.getElementById('vtFollowupResp');
  if(!input||!resp) return;
  const question = input.value.trim();
  if(!question) return;

  const ctx = window.vtDialogCtx||{};
  resp.textContent = '⏳ AI думає...';
  resp.style.color = '#64748b';

  const prompt = `Контекст: Учень вивчає IHK Lagerlogistik.
Питання екзамену: ${ctx.question}
Правильна відповідь: ${ctx.correctAnswer}
Відповідь учня: ${ctx.userAnswer}
Попередня оцінка AI: ${ctx.lastResponse}

Запит учня: ${question}

Відповідай коротко і чітко українською мовою. Якщо питають "як правильно" — дай конкретну відповідь в форматі екзамену.`;

  try{
    const r = await fetch('/api/gemini',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const d = await r.json();
    const t = d.candidates?.[0]?.content?.parts?.[0]?.text||d.text||d.result||'';
    resp.textContent = t;
    resp.style.color = '#86efac';
    input.value = '';
  }catch(e){
    resp.textContent = 'Помилка. Спробуй ще раз.';
    resp.style.color = '#ef4444';
  }
}
function vtMark(ok){
  vtTodayRes[vtIdx]=ok;
  document.getElementById('vtCard').className='vt-card '+(ok?'correct':'wrong');
  const qs=getVtQuestions(vtDay);
  setTimeout(()=>{
    if(vtIdx<qs.length-1){vtIdx++;vtTranscript='';renderVtCard();}
    else vtDone();
  },600);
}
function vtGoCard(i){
  vtIdx=i;vtTranscript='';
  const ta=document.getElementById('vtTextInput');
  if(ta) ta.value='';
  renderVtCard();
}
function vtDone(){
  const ok=vtTodayRes.filter(r=>r===true).length,tot=getVtQuestions(vtDay).length,pct=Math.round(ok/tot*100);
  let vp=JSON.parse(localStorage.getItem('vt_v1')||'{"day":0,"res":{}}');
  vp.res[vtDay]={ok,tot,pct};localStorage.setItem('vt_v1',JSON.stringify(vp));
  const nx=vtDay<getTotalVtDays()-1?vtDay+1:null;
  document.getElementById('vtMain').innerHTML=`<div class="vt-done">
    <div class="vt-done-emoji">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
    <div class="vt-done-title">${pct>=80?'Ausgezeichnet!':pct>=60?'Gut gemacht!':'Weiter üben!'}</div>
    <div class="vt-done-sub">Tag ${vtDay+1} abgeschlossen!</div>
    <div class="vt-score-chips">
      <div class="vt-chip g"><div class="cn">${ok}</div><div class="cl">Знав</div></div>
      <div class="vt-chip r"><div class="cn">${tot-ok}</div><div class="cl">Не знав</div></div>
      <div class="vt-chip"><div class="cn">${pct}%</div><div class="cl">Результат</div></div>
    </div>
    ${nx!==null?`<button class="vt-next-btn" onclick="vtGoDay(${nx})">День ${nx+1} →</button>`:`<button class="vt-next-btn" style="background:var(--gold);color:#111">🏆 Все пройдено!</button>`}
    <br><button class="vt-retry-btn" onclick="vtGoDay(${vtDay})">↺ Повторити</button>
  </div>`;
}
