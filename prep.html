<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📚 IHK Підготовка — Варіанти питань</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
:root{--bg:#0b0d13;--s1:#13161f;--s2:#1a1e2b;--border:#252a3a;--acc:#4f7fff;--gold:#f5c842;--green:#22c55e;--red:#ef4444;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

.hdr{background:linear-gradient(135deg,#0c1428,#17233d);border-bottom:2px solid var(--acc);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr-left .title{font-size:14px;font-weight:700;color:#fff}
.hdr-left .sub{font-size:11px;color:var(--muted);margin-top:2px}
.hdr-right{display:flex;gap:6px;align-items:center}
.lb{background:var(--s2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif}
.lb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.hdr-back{color:var(--acc);font-size:12px;font-weight:600;text-decoration:none;padding:5px 10px;border:1px solid var(--acc);border-radius:7px}

.filter-bar{display:flex;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.filter-bar::-webkit-scrollbar{display:none}
.fb{padding:9px 12px;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:'Inter',sans-serif}
.fb.on{color:var(--acc);border-bottom-color:var(--acc)}

main{max-width:640px;margin:0 auto;padding:16px 16px 80px}

.q-section{margin-bottom:24px}
.q-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding:6px 10px;background:var(--s2);border-radius:6px;display:inline-block}

.card-wrap{margin-bottom:10px}
.flashcard{perspective:1200px}
.fc-inner{position:relative;width:100%;min-height:200px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:18px;display:flex;flex-direction:column}
.fc-front{background:var(--s1);border:1px solid var(--border)}
.fc-back{background:#091708;border:1px solid #1a4a2a;transform:rotateY(180deg)}
.fc-front.correct{border-color:var(--green)}
.fc-front.wrong{border-color:var(--red)}
.fc-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:8px}
.fc-q{font-size:14px;line-height:1.7;color:var(--text);flex:1}
.fc-hint{font-size:11px;color:var(--muted);margin-top:10px}
.fc-albl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:10px}
.fc-a{font-size:13px;line-height:1.8;color:#86efac;flex:1;white-space:pre-wrap;overflow-y:auto}

.btn-show{width:100%;padding:10px;border-radius:9px;border:2px solid var(--acc);background:#0d1829;color:#93c5fd;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.bback{background:var(--s2);border:1px solid var(--border);color:var(--muted)}
.bno{background:#1a0808;border:2px solid var(--red);color:var(--red)}
.bok{background:#0a1a10;border:2px solid var(--green);color:var(--green)}

.score-bar{position:fixed;bottom:0;left:0;right:0;background:#0d0f17;border-top:1px solid var(--border);padding:10px 20px;display:flex;justify-content:center;gap:20px}
.sc{font-size:13px;font-weight:600}
.sc.ok{color:var(--green)}.sc.no{color:var(--red)}.sc.tot{color:var(--muted)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="title">📚 IHK — Варіанти питань</div>
    <div class="sub">Різні формулювання · DE / UA · Картки</div>
  </div>
  <div class="hdr-right">
    <button class="lb on" onclick="setLang('de',this)">DE</button>
    <button class="lb" onclick="setLang('ua',this)">UA</button>
    <a class="hdr-back" href="/">← Назад</a>
  </div>
</div>

<div class="filter-bar" id="filterBar"></div>
<main id="main"></main>

<div class="score-bar">
  <div class="sc ok">✓ <span id="sok">0</span></div>
  <div class="sc no">✗ <span id="sno">0</span></div>
  <div class="sc tot"><span id="stot">0</span>/<span id="smax">0</span> пройдено</div>
</div>

<script>
const ALL = [{"tag":"1.1","pts":"2","de_q":"Nennen Sie 5 Angaben auf dem Lieferschein, die Sie vor der Entladung prüfen!","ua_q":"Назвіть 5 даних з накладної, які ви перевіряєте перед розвантаженням!","de_a":"1. Empfänger — Name und Adresse: Ist die Lieferung für uns bestimmt?\n2. Lieferdatum — Wurde pünktlich geliefert?\n3. Absender — Kommt die Ware vom richtigen Lieferanten?\n4. Kennzeichen des Fahrzeugs — Stimmt das Fahrzeug mit der Bestellung überein?\n5. Bestellnummer — Entspricht die Lieferung unserer Bestellung?\n\nWichtig: VOR der Entladung prüft man NUR Dokumente.\nDie Ware wird noch nicht berührt oder gezählt.","ua_a":"1. Одержувач — ім'я та адреса: чи для нас ця поставка?\n2. Дата доставки — чи доставлено вчасно?\n3. Відправник — чи прийшов товар від правильного постачальника?\n4. Номерний знак транспортного засобу — чи відповідає авто замовленню?\n5. Номер замовлення — чи відповідає доставка нашому замовленню?\n\nВажливо: ДО розвантаження перевіряємо ТІЛЬКИ документи.\nТовар ще не торкаємо і не рахуємо."},{"tag":"1.1","pts":"2","de_q":"Sie erhalten eine Lieferung ohne Lieferschein. Was tun Sie?","ua_q":"Ви отримуєте поставку без накладної. Що ви робите?","de_a":"1. Die Ware wird NICHT entladen.\n2. Den Fahrer auffordern, den Lieferschein vorzulegen.\n3. Den Vorgesetzten informieren.\n4. Ohne Lieferschein kann die Ware nicht angenommen werden — kein Nachweis über Menge, Artikel und Absender.\n\nBegründung: Der Lieferschein ist das Grunddokument für die Warenannahme. Ohne ihn kann man weder die Menge noch die Richtigkeit der Lieferung überprüfen.","ua_a":"1. Товар НЕ розвантажується.\n2. Попросити водія надати накладну.\n3. Повідомити керівника.\n4. Без накладної товар прийнятий бути не може — немає підтвердження кількості, артикулу та відправника.\n\nОбґрунтування: Накладна є основним документом для приймання товару. Без неї неможливо перевірити ні кількість, ні правильність поставки."},{"tag":"1.1","pts":"2","de_q":"Die Bestellnummer auf dem Lieferschein stimmt nicht mit Ihrer Bestellung überein. Was tun Sie?","ua_q":"Номер замовлення на накладній не збігається з вашим замовленням. Що ви робите?","de_a":"1. Die Ware wird vorerst NICHT entladen.\n2. Den Fahrer über die Abweichung informieren.\n3. Den Vorgesetzten informieren und Rücksprache halten.\n4. Den Lieferanten kontaktieren und die richtige Bestellung klären.\n5. Erst nach Klärung und Freigabe entladen.\n\nBegründung: Eine falsche Bestellnummer kann bedeuten, dass eine falsche Lieferung angekommen ist. Das muss vor der Entladung geklärt werden.","ua_a":"1. Товар поки що НЕ розвантажується.\n2. Повідомити водія про невідповідність.\n3. Повідомити керівника і проконсультуватись з ним.\n4. Зв'язатися з постачальником і з'ясувати правильне замовлення.\n5. Розвантажувати лише після з'ясування і отримання дозволу.\n\nОбґрунтування: Неправильний номер замовлення може означати, що надійшла не та поставка. Це потрібно з'ясувати до розвантаження."},{"tag":"1.1","pts":"2","de_q":"Der Absender auf dem Lieferschein ist eine Ihnen unbekannte Firma. Was tun Sie?","ua_q":"Відправник на накладній — невідома вам фірма. Що ви робите?","de_a":"1. Die Ware wird NICHT entladen.\n2. Den Vorgesetzten sofort informieren.\n3. In der eigenen Bestellliste prüfen, ob eine Lieferung von dieser Firma erwartet wird.\n4. Den bekannten Lieferanten kontaktieren und nachfragen.\n5. Erst nach Klärung entladen.\n\nBegründung: Ein unbekannter Absender kann auf eine Fehllieferung oder sogar auf Betrug hinweisen. Ohne Klärung darf die Ware nicht angenommen werden.","ua_a":"1. Товар НЕ розвантажується.\n2. Негайно повідомити керівника.\n3. Перевірити в своєму списку замовлень, чи очікується поставка від цієї фірми.\n4. Зв'язатися з відомим постачальником і уточнити.\n5. Розвантажувати лише після з'ясування.\n\nОбґрунтування: Невідомий відправник може свідчити про помилкову доставку або навіть шахрайство. Без з'ясування товар не може бути прийнятий."},{"tag":"1.1","pts":"2","de_q":"Das Lieferdatum auf dem Lieferschein ist falsch — es steht das gestrige Datum. Was tun Sie?","ua_q":"Дата доставки на накладній неправильна — вказано вчорашню дату. Що ви робите?","de_a":"1. Die Lieferung annehmen, aber einen Vorbehalt im Lieferschein vermerken.\n2. Das tatsächliche Datum der Anlieferung eintragen: 28.04.2026.\n3. Den Fahrer darauf hinweisen und unterschreiben lassen.\n4. Den Vorgesetzten und den Lieferanten informieren.\n\nBegründung: Das falsche Datum kann bei späteren Reklamationen oder Garantiefragen zu Problemen führen. Das korrekte Datum muss schriftlich festgehalten werden.","ua_a":"1. Прийняти поставку, але внести застереження (Vorbehalt) у накладну.\n2. Вписати фактичну дату доставки: 28.04.2026.\n3. Звернути увагу водія і попросити підписати.\n4. Повідомити керівника і постачальника.\n\nОбґрунтування: Неправильна дата може спричинити проблеми при подальших рекламаціях або гарантійних питаннях. Правильна дата повинна бути зафіксована письмово."},{"tag":"1.1","pts":"2","de_q":"Warum prüfen Sie den Lieferschein VOR der Entladung und nicht danach?","ua_q":"Чому ви перевіряєте накладну ДО розвантаження, а не після?","de_a":"Weil man nach der Entladung keine Möglichkeit mehr hat, die Annahme zu verweigern.\n\nKonkrete Gründe:\n1. Falsche Adresse → Ware muss zurück, ohne Entladung möglich.\n2. Falscher Lieferant → Ware wird nicht angenommen.\n3. Falsches Datum → Muss vor der Annahme dokumentiert werden.\n4. Falsche Bestellnummer → Lieferung könnte für einen anderen Kunden sein.\n\nFazit: Die Prüfung vor der Entladung schützt das Unternehmen vor falschen Lieferungen, unnötigen Kosten und rechtlichen Problemen.","ua_a":"Тому що після розвантаження вже неможливо відмовитись від прийняття товару.\n\nКонкретні причини:\n1. Неправильна адреса → товар треба повернути, без розвантаження.\n2. Неправильний постачальник → товар не приймається.\n3. Неправильна дата → потрібно задокументувати до прийняття.\n4. Неправильний номер замовлення → поставка може бути для іншого клієнта.\n\nВисновок: Перевірка до розвантаження захищає підприємство від помилкових поставок, зайвих витрат і правових проблем."},{"tag":"1.1","pts":"2","de_q":"Was prüfen Sie WÄHREND der Entladung? Nennen Sie 4 Punkte!","ua_q":"Що ви перевіряєте ПІД ЧАС розвантаження? Назвіть 4 пункти!","de_a":"1. Anzahl der Packstücke / Paletten — stimmt die Menge grob überein?\n2. Äußere Transportschäden — Kratzer, Dellen, nasse oder zerrissene Verpackung?\n3. Zustand der Verpackung — ist die Verpackung unversehrt?\n4. Grobe Sichtkontrolle — stimmt der Artikel augenscheinlich mit der Bestellung überein?\n\nWichtig: WÄHREND der Entladung sieht man die Ware zum ersten Mal.\nSchäden müssen SOFORT gemeldet und im Lieferschein vermerkt werden.","ua_a":"1. Кількість пакувальних місць / палет — чи приблизно збігається кількість?\n2. Зовнішні транспортні пошкодження — подряпини, вм'ятини, мокре або розірване пакування?\n3. Стан пакування — чи пакування непошкоджене?\n4. Груба візуальна перевірка — чи відповідає товар замовленню на перший погляд?\n\nВажливо: ПІД ЧАС розвантаження ви вперше бачите товар.\nПошкодження потрібно ОДРАЗУ повідомити і занести в накладну."},{"tag":"1.1","pts":"2","de_q":"Was tun Sie, wenn Sie WÄHREND der Entladung einen Transportschaden feststellen?","ua_q":"Що ви робите, якщо ПІД ЧАС розвантаження виявляєте транспортне пошкодження?","de_a":"1. Entladung unterbrechen und den Schaden genau dokumentieren.\n2. Schaden fotografieren (wenn möglich).\n3. Einen Vorbehalt im Lieferschein vermerken: z.B. \"Verpackung beschädigt angekommen\".\n4. Den Fahrer den Vorbehalt unterschreiben lassen.\n5. Den Vorgesetzten informieren.\n6. Den Lieferanten über den Schaden informieren → Reklamation einleiten.\n\nWichtig: Niemals ohne Vorbehalt unterschreiben wenn Schäden sichtbar sind.\nSonst verliert man das Recht auf Reklamation.","ua_a":"1. Перервати розвантаження і детально задокументувати пошкодження.\n2. Сфотографувати пошкодження (якщо можливо).\n3. Внести застереження (Vorbehalt) у накладну: напр. \"Пакування пошкоджено при доставці\".\n4. Попросити водія підписати застереження.\n5. Повідомити керівника.\n6. Повідомити постачальника про пошкодження → почати рекламацію.\n\nВажливо: Ніколи не підписувати без застереження, якщо видно пошкодження.\nІнакше втрачається право на рекламацію."},{"tag":"1.1","pts":"2","de_q":"Was prüfen Sie NACH der Entladung? Nennen Sie 4 Punkte!","ua_q":"Що ви перевіряєте ПІСЛЯ розвантаження? Назвіть 4 пункти!","de_a":"1. Genaue Stückzahl zählen und mit dem Lieferschein vergleichen.\n2. Qualitätsprüfung — Stichprobenprüfung durch die QS-Abteilung.\n3. Artikelnummer, Modell, Farbe, Größe mit Bestellung vergleichen.\n4. Bei Mängeln → Mängelprotokoll erstellen + Vorgesetzten informieren.\n\nWichtig: NACH der Entladung findet die detaillierte Prüfung statt.\nHier werden alle 4 Mangelarten geprüft: Identität, Quantität, Qualität, Beschaffenheit.","ua_a":"1. Точно підрахувати кількість і порівняти з накладною.\n2. Перевірка якості — вибіркова перевірка відділом контролю якості.\n3. Порівняти номер артикулу, модель, колір, розмір із замовленням.\n4. При дефектах → скласти протокол про дефекти + повідомити керівника.\n\nВажливо: ПІСЛЯ розвантаження проводиться детальна перевірка.\nТут перевіряються всі 4 види дефектів: ідентичність, кількість, якість, властивості."},{"tag":"1.1","pts":"2","de_q":"Was tun Sie, wenn Sie NACH der Entladung feststellen, dass die Stückzahl nicht stimmt?","ua_q":"Що ви робите, якщо ПІСЛЯ розвантаження виявляєте, що кількість не відповідає?","de_a":"1. Die tatsächliche Stückzahl genau nachzählen und dokumentieren.\n2. Die Abweichung schriftlich festhalten — z.B. \"Lieferschein: 1.500 Stück, erhalten: 1.400 Stück\".\n3. Den Vorgesetzten informieren.\n4. Den Lieferanten kontaktieren und eine Reklamation wegen Quantitätsmangel einleiten.\n5. Die fehlende Menge nachfordern (Nachlieferung) oder eine Gutschrift verlangen.\n\nRechtliche Grundlage: Es liegt ein Quantitätsmangel vor.\nDer Käufer hat das Recht auf Nacherfüllung (§ 437 BGB).","ua_a":"1. Точно перерахувати фактичну кількість і задокументувати.\n2. Зафіксувати відхилення письмово — напр. \"Накладна: 1.500 штук, отримано: 1.400 штук\".\n3. Повідомити керівника.\n4. Зв'язатися з постачальником і розпочати рекламацію через кількісний дефект.\n5. Вимагати допоставку відсутньої кількості або кредит-ноту.\n\nПравова основа: Має місце кількісний дефект (Quantitätsmangel).\nПокупець має право на усунення дефекту (Nacherfüllung, § 437 BGB)."},{"tag":"1.1","pts":"2","de_q":"Welche Funktion hat der Lieferschein im Wareneingang?","ua_q":"Яку функцію виконує накладна при прийманні товару?","de_a":"Der Lieferschein ist das wichtigste Dokument bei der Warenannahme.\n\nFunktionen:\n1. Nachweis der Lieferung — bestätigt, was geliefert wurde.\n2. Grundlage für die Prüfung — Menge, Artikel, Absender, Datum werden verglichen.\n3. Rechtsdokument — mit der Unterschrift bestätigt man die ordnungsgemäße Annahme.\n4. Grundlage für Reklamationen — bei Mängeln dient er als Beweisdokument.\n5. Buchhalterische Grundlage — Basis für die Rechnungsprüfung.","ua_a":"Накладна є найважливішим документом при прийманні товару.\n\nФункції:\n1. Підтвердження поставки — фіксує, що було доставлено.\n2. Основа для перевірки — кількість, артикул, відправник, дата порівнюються.\n3. Правовий документ — підписом підтверджується належне приймання.\n4. Основа для рекламацій — при дефектах є доказовим документом.\n5. Бухгалтерська основа — база для перевірки рахунку."},{"tag":"1.1","pts":"2","de_q":"Nennen Sie 5 Angaben, die auf einem Lieferschein stehen müssen!","ua_q":"Назвіть 5 даних, які повинні бути вказані в накладній!","de_a":"1. Absender — Name und Adresse des Lieferanten.\n2. Empfänger — Name und Adresse des Kunden (Eltron GmbH).\n3. Lieferdatum — wann wurde die Ware geliefert.\n4. Artikelbezeichnung und Artikelnummer — welche Ware wurde geliefert.\n5. Menge — wie viele Stück wurden geliefert.\n\nWeitere mögliche Angaben:\n• Bestellnummer\n• Lieferscheinnummer\n• Gewicht und Abmessungen","ua_a":"1. Відправник — ім'я та адреса постачальника.\n2. Одержувач — ім'я та адреса клієнта (Eltron GmbH).\n3. Дата доставки — коли був доставлений товар.\n4. Найменування та номер артикулу — який товар був доставлений.\n5. Кількість — скільки штук було доставлено.\n\nДодаткові можливі дані:\n• Номер замовлення\n• Номер накладної\n• Вага та розміри"},{"tag":"1.1","pts":"2","de_q":"Sie unterschreiben den Lieferschein ohne zu prüfen. Welche Folgen kann das haben?","ua_q":"Ви підписуєте накладну не перевіривши. Які можуть бути наслідки?","de_a":"1. Man verliert das Recht auf Reklamation — mit der Unterschrift bestätigt man eine ordnungsgemäße Lieferung.\n2. Spätere Mängel können nicht mehr dem Transportweg zugeordnet werden.\n3. Das Unternehmen trägt die Kosten für fehlerhafte oder fehlende Ware selbst.\n4. Der Vorgesetzte wird für den Fehler verantwortlich gemacht.\n5. Rechtliche Konsequenzen — im schlimmsten Fall haftet das Unternehmen.\n\nFazit: Eine Unterschrift ohne Prüfung ist ein schwerwiegender Fehler im Wareneingang!","ua_a":"1. Втрачається право на рекламацію — підписом підтверджується належна поставка.\n2. Подальші дефекти вже не можна пов'язати з транспортуванням.\n3. Підприємство саме несе витрати за неякісний або відсутній товар.\n4. Керівника притягнуть до відповідальності за помилку.\n5. Правові наслідки — у найгіршому випадку підприємство несе відповідальність.\n\nВисновок: Підпис без перевірки — це серйозна помилка при прийманні товару!"},{"tag":"1.1","pts":"2","de_q":"Was prüfen Sie VOR, WÄHREND und NACH der Entladung? Geben Sie eine vollständige Übersicht!","ua_q":"Що ви перевіряєте ДО, ПІД ЧАС і ПІСЛЯ розвантаження? Дайте повний огляд!","de_a":"VOR der Entladung — nur Dokumente, kein Kontakt mit der Ware:\n• Empfänger (Name + Adresse)\n• Lieferdatum\n• Absender\n• Kennzeichen des Fahrzeugs\n• Bestellnummer\n\nWÄHREND der Entladung — äußere Sichtkontrolle:\n• Anzahl der Packstücke / Paletten\n• Äußere Transportschäden (Kratzer, Dellen, nasse Verpackung)\n• Zustand der Verpackung\n• Grobe Sichtkontrolle ob richtiger Artikel\n\nNACH der Entladung — detaillierte Prüfung:\n• Genaue Stückzahl zählen\n• Qualitätsprüfung durch QS-Abteilung (Stichproben)\n• Artikelnummer, Modell, Farbe, Größe mit Bestellung vergleichen\n• Bei Mängeln → Mängelprotokoll + Vorgesetzten informieren","ua_a":"ДО розвантаження — тільки документи, товар не торкаємо:\n• Одержувач (ім'я + адреса)\n• Дата доставки\n• Відправник\n• Номерний знак транспортного засобу\n• Номер замовлення\n\nПІД ЧАС розвантаження — зовнішній візуальний огляд:\n• Кількість пакувальних місць / палет\n• Зовнішні транспортні пошкодження (подряпини, вм'ятини, мокре пакування)\n• Стан пакування\n• Груба візуальна перевірка правильності артикулу\n\nПІСЛЯ розвантаження — детальна перевірка:\n• Точно підрахувати кількість\n• Перевірка якості відділом QS (вибірково)\n• Порівняти номер артикулу, модель, колір, розмір із замовленням\n• При дефектах → протокол про дефекти + повідомити керівника"},{"tag":"1.2","pts":"2","de_q":"Während der Entladung stellen Sie keine Transportschäden fest. Was tragen Sie in den Lieferschein ein?","ua_q":"Під час розвантаження ви не виявляєте транспортних пошкоджень. Що ви вносите в накладну?","de_a":"1. Datum der Anlieferung eintragen: 28.04.2026\n2. Im Feld \"Ware erhalten\" unterschreiben.\n\nMit diesen zwei Einträgen bestätigt man dem Fahrer,\ndass die Lieferung vollständig und ohne Schäden\nangekommen ist.\n\nWichtig: Datum + Unterschrift — beide Angaben sind\nnotwendig. Nur eine Unterschrift ohne Datum reicht\nnicht aus.","ua_a":"1. Вписати дату доставки: 28.04.2026\n2. Підписати у полі \"Ware erhalten\" (Товар отримано).\n\nЦими двома записами підтверджується водієві,\nщо поставка прийшла повністю і без пошкоджень.\n\nВажливо: Дата + підпис — обидва записи необхідні.\nЛише підпис без дати недостатній."},{"tag":"1.2","pts":"2","de_q":"Was bedeutet \"ordnungsgemäße Anlieferung\" im Wareneingang?","ua_q":"Що означає \"ordnungsgemäße Anlieferung\" (належна доставка) при прийманні товару?","de_a":"Eine ordnungsgemäße Anlieferung bedeutet, dass:\n\n1. Die Ware vollständig geliefert wurde (richtige Menge).\n2. Keine sichtbaren Transportschäden vorhanden sind.\n3. Die Ware dem bestellten Artikel entspricht.\n4. Das Lieferdatum eingehalten wurde.\n5. Alle Dokumente (Lieferschein) vollständig vorhanden sind.\n\nErst wenn ALLE diese Punkte stimmen, kann man\nvon einer ordnungsgemäßen Anlieferung sprechen\nund den Lieferschein vorbehaltlos unterschreiben.","ua_a":"Належна доставка означає, що:\n\n1. Товар доставлено повністю (правильна кількість).\n2. Немає видимих транспортних пошкоджень.\n3. Товар відповідає замовленому артикулу.\n4. Дата доставки дотримана.\n5. Всі документи (накладна) наявні в повному обсязі.\n\nЛише коли ВСІ ці пункти виконані, можна говорити\nпро належну доставку і підписувати накладну\nбез застережень."},{"tag":"1.2","pts":"2","de_q":"Warum ist es wichtig, das genaue Datum auf dem Lieferschein einzutragen?","ua_q":"Чому важливо вписати точну дату у накладну?","de_a":"Das Datum auf dem Lieferschein ist wichtig, weil:\n\n1. Es den genauen Zeitpunkt der Warenannahme belegt.\n2. Es die Grundlage für Gewährleistungsfristen bildet\n   (Mängel müssen innerhalb bestimmter Fristen gemeldet werden).\n3. Es bei späteren Streitigkeiten als Beweis dient:\n   Wann wurde die Ware geliefert?\n4. Es für die Buchhaltung und Rechnungsprüfung\n   notwendig ist.\n\nOhne korrektes Datum kann der Lieferschein als\nBeweisdokument unbrauchbar werden.","ua_a":"Дата в накладній важлива, тому що:\n\n1. Вона підтверджує точний момент приймання товару.\n2. Вона є основою для строків гарантії\n   (дефекти потрібно повідомляти в певні строки).\n3. При подальших суперечках слугує доказом:\n   коли був доставлений товар?\n4. Вона необхідна для бухгалтерії і перевірки рахунків.\n\nБез правильної дати накладна може стати\nнепридатною як доказовий документ."},{"tag":"1.2","pts":"2","de_q":"Während der Entladung stellen Sie Transportschäden fest. Was tragen Sie in den Lieferschein ein?","ua_q":"Під час розвантаження ви виявляєте транспортні пошкодження. Що ви вносите в накладну?","de_a":"1. Einen Vorbehalt eintragen:\n   z.B. \"Verpackung beschädigt\", \"Kratzer auf der Ware\",\n   \"2 Kartons eingedrückt\".\n\n2. Den Schaden so genau wie möglich beschreiben:\n   Welche Ware? Wie viele Stücke? Art des Schadens?\n\n3. Datum der Anlieferung eintragen: 28.04.2026\n\n4. Unterschrift setzen.\n\n5. Den Fahrer ebenfalls unterschreiben lassen —\n   damit bestätigt er, dass der Schaden festgestellt wurde.\n\nWichtig: Ohne Vorbehalt verliert man das Recht\nauf Reklamation beim Transporteur!","ua_a":"1. Внести застереження (Vorbehalt):\n   напр. \"Пакування пошкоджено\", \"Подряпини на товарі\",\n   \"2 картонних ящики вм'яті\".\n\n2. Описати пошкодження якомога точніше:\n   Який товар? Скільки штук? Вид пошкодження?\n\n3. Вписати дату доставки: 28.04.2026\n\n4. Поставити підпис.\n\n5. Попросити водія також підписати —\n   він таким чином підтверджує, що пошкодження виявлено.\n\nВажливо: Без застереження втрачається право\nна рекламацію у перевізника!"},{"tag":"1.2","pts":"2","de_q":"Was ist ein Vorbehalt auf dem Lieferschein und wann setzt man ihn?","ua_q":"Що таке застереження (Vorbehalt) в накладній і коли його ставлять?","de_a":"Ein Vorbehalt ist ein schriftlicher Vermerk auf dem\nLieferschein, der auf Mängel oder Schäden hinweist.\n\nWann setzt man einen Vorbehalt?\n• Bei sichtbaren Transportschäden (Kratzer, Bruch, nasse Verpackung)\n• Bei offensichtlichen Mengenabweichungen\n• Bei beschädigter oder geöffneter Verpackung\n• Bei Zweifeln über den Zustand der Ware\n\nWie formuliert man einen Vorbehalt?\n• Konkret und präzise: \"3 Kartons eingedrückt, Ware sichtbar beschädigt\"\n• Nicht zu allgemein: \"Schäden vorbehalten\" reicht oft nicht aus\n\nRechtliche Bedeutung:\nOhne Vorbehalt gilt die Lieferung als einwandfrei\nangenommen — man verliert das Reklamationsrecht!","ua_a":"Застереження — це письмовий запис у накладній,\nякий вказує на дефекти або пошкодження.\n\nКоли ставлять застереження?\n• При видимих транспортних пошкодженнях (подряпини, злам, мокре пакування)\n• При очевидних відхиленнях у кількості\n• При пошкодженому або відкритому пакуванні\n• При сумнівах щодо стану товару\n\nЯк формулювати застереження?\n• Конкретно і точно: \"3 картонних ящики вм'яті, товар видимо пошкоджений\"\n• Не занадто загально: \"Застереження щодо пошкоджень\" часто недостатньо\n\nЮридичне значення:\nБез застереження поставка вважається прийнятою\nбез зауважень — право на рекламацію втрачається!"},{"tag":"1.2","pts":"2","de_q":"Sie stellen während der Entladung fest, dass eine Palette komplett fehlt. Was tun Sie?","ua_q":"Під час розвантаження ви виявляєте, що одна палета повністю відсутня. Що ви робите?","de_a":"1. Entladung kurz unterbrechen und die Situation dokumentieren.\n\n2. Im Lieferschein vermerken:\n   \"1 Palette fehlt — laut Lieferschein X Paletten,\n   erhalten Y Paletten\"\n\n3. Vorbehalt setzen und Datum eintragen.\n\n4. Den Fahrer darüber informieren und unterschreiben lassen.\n\n5. Den Vorgesetzten sofort informieren.\n\n6. Den Lieferanten kontaktieren:\n   → Nachlieferung der fehlenden Palette fordern\n   → Es liegt ein Quantitätsmangel vor (§ 437 BGB)\n\nWichtig: Nie den Lieferschein unterschreiben,\nals wären alle Paletten angekommen!","ua_a":"1. Коротко перервати розвантаження і задокументувати ситуацію.\n\n2. Внести запис у накладну:\n   \"1 палета відсутня — за накладною X палет,\n   отримано Y палет\"\n\n3. Поставити застереження і вписати дату.\n\n4. Повідомити водія і попросити підписати.\n\n5. Негайно повідомити керівника.\n\n6. Зв'язатися з постачальником:\n   → Вимагати допоставку відсутньої палети\n   → Має місце кількісний дефект (§ 437 BGB)\n\nВажливо: Ніколи не підписувати накладну так,\nніби всі палети надійшли!"},{"tag":"1.2","pts":"2","de_q":"Welche rechtliche Bedeutung hat Ihre Unterschrift auf dem Lieferschein?","ua_q":"Яке юридичне значення має ваш підпис на накладній?","de_a":"Mit der Unterschrift auf dem Lieferschein bestätigt man:\n\n1. Die Ware wurde in der angegebenen Menge erhalten.\n2. Es wurden keine sichtbaren Schäden festgestellt\n   (wenn kein Vorbehalt gesetzt wurde).\n3. Die Lieferung entspricht den Angaben im Lieferschein.\n\nRechtliche Folgen:\n• Die Unterschrift ist eine rechtsverbindliche Erklärung.\n• Ohne Vorbehalt gilt: Transportschäden können\n  nachträglich NICHT mehr beim Transporteur geltend\n  gemacht werden.\n• Versteckte Mängel (nicht sichtbar bei Annahme)\n  können weiterhin reklamiert werden.","ua_a":"Підписом на накладній підтверджується:\n\n1. Товар отримано у вказаній кількості.\n2. Видимих пошкоджень не виявлено\n   (якщо не поставлено застереження).\n3. Поставка відповідає даним у накладній.\n\nЮридичні наслідки:\n• Підпис є юридично обов'язковою заявою.\n• Без застереження діє правило: транспортні пошкодження\n  не можуть бути пред'явлені перевізнику пізніше.\n• Приховані дефекти (невидимі при прийманні)\n  можна рекламувати і надалі."},{"tag":"1.2","pts":"2","de_q":"Welche Folgen hat es, wenn Sie trotz sichtbarer Schäden OHNE Vorbehalt unterschreiben?","ua_q":"Які наслідки, якщо ви підписуєте накладну БЕЗ застереження, незважаючи на видимі пошкодження?","de_a":"1. Man verliert das Recht, den Transportschaden beim\n   Transporteur (Spediteur) zu reklamieren.\n   → Der Transporteur haftet nur für Schäden, die\n     bei Übergabe protokolliert wurden.\n\n2. Das eigene Unternehmen muss den Schaden selbst tragen.\n\n3. Der verantwortliche Mitarbeiter kann zur Rechenschaft\n   gezogen werden — grobe Fahrlässigkeit.\n\n4. Spätere Beschwerden beim Lieferanten sind schwieriger,\n   da der Zeitpunkt der Schadensentstehung unklar ist.\n\nFazit: Eine Unterschrift ohne Vorbehalt bei sichtbaren\nSchäden ist ein schwerwiegender Fehler mit\nerheblichen finanziellen Folgen!","ua_a":"1. Втрачається право рекламувати транспортне пошкодження\n   у перевізника (спедитора).\n   → Перевізник несе відповідальність лише за пошкодження,\n     які були задокументовані при передачі.\n\n2. Власне підприємство повинно самостійно покривати збитки.\n\n3. Відповідальний співробітник може бути притягнутий\n   до відповідальності — груба необережність.\n\n4. Подальші скарги постачальнику ускладнюються,\n   оскільки час виникнення пошкодження незрозумілий.\n\nВисновок: Підпис без застереження при видимих\nпошкодженнях — серйозна помилка зі значними\nфінансовими наслідками!"},{"tag":"1.2","pts":"2","de_q":"Warum muss der Fahrer den Lieferschein bei Schäden ebenfalls unterschreiben?","ua_q":"Чому водій теж повинен підписати накладну при пошкодженнях?","de_a":"Der Fahrer muss unterschreiben, weil:\n\n1. Er als Vertreter des Transportunternehmens\n   (Spediteurs) die Schadensbestätigung anerkennt.\n\n2. Seine Unterschrift beweist, dass der Schaden\n   bei der Übergabe festgestellt und protokolliert wurde.\n\n3. Ohne seine Unterschrift könnte das Transportunternehmen\n   später behaupten, der Schaden sei erst nach der\n   Anlieferung entstanden.\n\n4. Die Unterschrift des Fahrers ist die wichtigste\n   Grundlage für eine spätere Schadensersatzforderung\n   gegenüber dem Transporteur.\n\nWichtig: Verweigert der Fahrer die Unterschrift →\nSofort den Vorgesetzten informieren!","ua_a":"Водій повинен підписати, тому що:\n\n1. Як представник транспортної компанії\n   (спедитора) він визнає підтвердження пошкодження.\n\n2. Його підпис доводить, що пошкодження було\n   виявлено і задокументовано при передачі.\n\n3. Без його підпису транспортна компанія пізніше\n   могла б стверджувати, що пошкодження виникло\n   вже після доставки.\n\n4. Підпис водія є найважливішою основою для\n   подальшої вимоги відшкодування збитків\n   від перевізника.\n\nВажливо: Якщо водій відмовляється підписувати →\nНегайно повідомити керівника!"},{"tag":"1.3","pts":"3","de_q":"Nennen Sie 3 Mängel an Europaletten, die dazu führen, dass Sie diese nicht tauschen können!","ua_q":"Назвіть 3 дефекти Euro-палет, через які їх не можна обміняти!","de_a":"Ein Tausch ist nicht möglich bei: gebrochenen oder fehlenden Bodenbrettern, fehlenden oder beschädigten Klötzen, fehlendem oder unlesbarem EPAL-Brandzeichen.","ua_a":"Обмін неможливий при: зламаних або відсутніх дошках настилу, відсутніх або пошкоджених кубиках-опорах, відсутньому або нечитабельному знаку EPAL."},{"tag":"1.3","pts":"3","de_q":"Welche Mängel an einer Europalette verhindern den Tausch? Nennen Sie 3!","ua_q":"Які дефекти Euro-палети перешкоджають обміну? Назвіть 3!","de_a":"Ein Tausch ist nicht möglich bei: gebrochenen oder fehlenden Bodenbrettern, fehlenden oder beschädigten Klötzen, fehlendem oder unlesbarem EPAL-Brandzeichen.","ua_a":"Обмін неможливий при: зламаних або відсутніх дошках настилу, відсутніх або пошкоджених кубиках-опорах, відсутньому або нечитабельному знаку EPAL."},{"tag":"1.3","pts":"3","de_q":"Der Fahrer möchte die Europaletten tauschen. Bei welchen 3 Mängeln verweigern Sie den Tausch?","ua_q":"Водій хоче обміняти Euro-палети. При яких 3 дефектах ви відмовляєте?","de_a":"Ein Tausch ist nicht möglich bei: gebrochenen oder fehlenden Bodenbrettern, fehlenden oder beschädigten Klötzen, fehlendem oder unlesbarem EPAL-Brandzeichen.","ua_a":"Обмін неможливий при: зламаних або відсутніх дошках настилу, відсутніх або пошкоджених кубиках-опорах, відсутньому або нечитабельному знаку EPAL."},{"tag":"1.4","pts":"4","de_q":"Erläutern Sie die 4 Mangelarten am Beispiel „Sporthose, lang, grau\" (Art. 240150, 1.500 Stück)!","ua_q":"Поясніть 4 види дефектів на прикладі „Спортивні штани, довгі, сірі\" (арт. 240150, 1.500 шт.)!","de_a":"Es gibt vier Mangelarten: Identitätsmangel — falsches Produkt, z.B. kurze schwarze Hose statt langer grauer Sporthose. Quantitätsmangel — falsche Menge, z.B. 1.400 statt 1.500 Stück. Qualitätsmangel — fehlerhafte Verarbeitung, z.B. schlechte Nähte. Beschaffenheitsmangel — falsches Material, z.B. Baumwolle statt Polyester.","ua_a":"Є чотири види дефектів: Identitätsmangel — не той товар, напр. короткі чорні замість довгих сірих. Quantitätsmangel — не та кількість, напр. 1.400 замість 1.500. Qualitätsmangel — дефекти виготовлення, напр. погані шви. Beschaffenheitsmangel — неправильний матеріал, напр. бавовна замість поліестеру."},{"tag":"1.4","pts":"4","de_q":"Bei der Warenannahme werden Mängel festgestellt. Nennen und erläutern Sie die 4 Mangelarten!","ua_q":"При прийманні товару виявлено дефекти. Назвіть і поясніть 4 види дефектів!","de_a":"Es gibt vier Mangelarten: Identitätsmangel — falsches Produkt, z.B. kurze schwarze Hose statt langer grauer Sporthose. Quantitätsmangel — falsche Menge, z.B. 1.400 statt 1.500 Stück. Qualitätsmangel — fehlerhafte Verarbeitung, z.B. schlechte Nähte. Beschaffenheitsmangel — falsches Material, z.B. Baumwolle statt Polyester.","ua_a":"Є чотири види дефектів: Identitätsmangel — не той товар, напр. короткі чорні замість довгих сірих. Quantitätsmangel — не та кількість, напр. 1.400 замість 1.500. Qualitätsmangel — дефекти виготовлення, напр. погані шви. Beschaffenheitsmangel — неправильний матеріал, напр. бавовна замість поліестеру."},{"tag":"1.5","pts":"2","de_q":"Eltron GmbH prüft 15% der angelieferten Menge (1.500 Stück) in der QS. Berechnen Sie die Menge!","ua_q":"Eltron GmbH перевіряє 15% від 1.500 шт. у QS. Розрахуйте кількість!","de_a":"1.500 × 15 ÷ 100 = 225 Stück → QS-Abteilung. Restliche 1.275 Stück → Sperrfläche S 20.\n\nRechenweg immer vollständig angeben — ohne Rechenweg = 0 Punkte!","ua_a":"Беру 1.500 штук, множу на 15, ділю на 100 — отримую 225 штук для QS. Решта 1.275 штук іде на S 20.\n\nХід розрахунку завжди писати повністю — без нього = 0 балів!"},{"tag":"1.5","pts":"2","de_q":"Von 1.500 gelieferten Stück sollen 15% in der QS geprüft werden. Wie viele Stück sind das?","ua_q":"З 1.500 доставлених штук 15% потрібно перевірити в QS. Скільки це штук?","de_a":"1.500 × 15 ÷ 100 = 225 Stück → QS-Abteilung. Restliche 1.275 Stück → Sperrfläche S 20.\n\nRechenweg immer vollständig angeben — ohne Rechenweg = 0 Punkte!","ua_a":"Беру 1.500 штук, множу на 15, ділю на 100 — отримую 225 штук для QS. Решта 1.275 штук іде на S 20.\n\nХід розрахунку завжди писати повністю — без нього = 0 балів!"}];

let lang = 'de';
let filter = 'all';
let results = {};

const TAGS = [...new Set(ALL.map(c => c.tag))];

function init() {
  // Filter bar
  const fb = document.getElementById('filterBar');
  fb.innerHTML = `<button class="fb on" onclick="setFilter('all',this)">Всі</button>` +
    TAGS.map(t => `<button class="fb" onclick="setFilter('${t}',this)">${t}</button>`).join('');
  document.getElementById('smax').textContent = ALL.length;
  render();
}

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render() {
  const cards = filter === 'all' ? ALL : ALL.filter(c => c.tag === filter);
  const grouped = {};
  cards.forEach((c, gi) => {
    const realIdx = ALL.indexOf(c);
    if (!grouped[c.tag]) grouped[c.tag] = [];
    grouped[c.tag].push({...c, idx: realIdx});
  });

  const el = document.getElementById('main');
  el.innerHTML = Object.entries(grouped).map(([tag, cs]) => `
    <div class="q-section">
      <div class="q-label">Aufgabe ${tag}</div>
      ${cs.map((c, vi) => renderCard(c, vi)).join('')}
    </div>`).join('');
}

function renderCard(c, vi) {
  const i = c.idx;
  const flipped = results['f_'+i] || false;
  const marked = results[i];
  const qText = lang === 'de' ? c.de_q : c.ua_q;
  const aText = lang === 'de' ? c.de_a : c.ua_a;
  const frontCls = marked === true ? 'fc-front correct' : marked === false ? 'fc-front wrong' : 'fc-front';

  return `<div class="card-wrap">
    <div class="flashcard">
      <div class="fc-inner ${flipped?'flipped':''}" id="fci_${i}">
        <div class="fc-face ${frontCls}">
          <div class="fc-meta">Variante ${vi+1} · ${c.pts} Punkte</div>
          <div class="fc-q">${qText}</div>
          <div class="fc-hint">👆 Натисни картку або кнопку</div>
          <button class="btn-show" onclick="flip(${i},event)">Показати відповідь</button>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-albl">✅ Відповідь</div>
          <div class="fc-a">${aText}</div>
          <div class="btn-row">
            <button class="btn bback" onclick="flip(${i},event)">← Питання</button>
            <button class="btn bno" onclick="mark(${i},false,event)">✗ Не знав</button>
            <button class="btn bok" onclick="mark(${i},true,event)">✓ Знав</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function flip(i, e) {
  if(e) e.stopPropagation();
  results['f_'+i] = !results['f_'+i];
  render();
}

function mark(i, ok, e) {
  if(e) e.stopPropagation();
  results[i] = ok;
  results['f_'+i] = false;
  updateScore();
  render();
}

function updateScore() {
  const vals = Object.entries(results).filter(([k])=>!k.startsWith('f_')).map(([,v])=>v);
  document.getElementById('sok').textContent = vals.filter(v=>v).length;
  document.getElementById('sno').textContent = vals.filter(v=>!v).length;
  document.getElementById('stot').textContent = vals.length;
}

init();
</script>
</body>
